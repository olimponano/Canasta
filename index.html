  // ── InflacionScreen ───────────────────────────────────────────────────────────
  const fmtPct=(v)=>v==null?"—":`${Number(v).toLocaleString("es-AR",{maximumFractionDigits:2})} %`;
  const INFLACION_API="https://api.argentinadatos.com/v1/finanzas/indices/inflacion";
  // Barras de la inflación mensual (últimos 12 meses cargados)
  function InflacionChart({meses,inflacion,colors}) {
    // Rango continuo (los meses sin cargar quedan como hueco), últimos 12
    const todos=[];for(let m=meses[0];m<=meses[meses.length-1];m=mesSumar(m,1))todos.push(m);
    const ms=todos.slice(-12);
    const valsN=ms.map(m=>inflacion[m]!=null?Number(inflacion[m]):null);
    const vals=valsN.filter(v=>v!=null);
    const W=340,H=150,PL=8,PR=8,PT=22,PB=24;
    const iW=W-PL-PR,iH=H-PT-PB;
    const max=Math.max(...vals,0.1), min=Math.min(...vals,0);
    const range=max-min||1;
    const toY=v=>PT+(1-(v-min)/range)*iH;
    const slot=iW/ms.length, bw=Math.min(28,slot*0.62);
    const prom=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
    return (
      <div className="card" style={{padding:"14px 12px 8px",marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",padding:"0 4px",marginBottom:4}}>
          <div style={{fontSize:13,fontWeight:600,color:colors.text}}>Inflación mensual</div>
          {vals.length>1&&<div style={{fontSize:11.5,color:colors.textMuted}}>Promedio <b className="mono" style={{color:colors.textSecondary}}>{fmtPct(Math.round(prom*10)/10)}</b></div>}
        </div>
        <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block"}}>
          <line x1={PL} x2={W-PR} y1={toY(0)} y2={toY(0)} stroke={colors.cardBorder} strokeWidth={1}/>
          {vals.length>1&&<line x1={PL} x2={W-PR} y1={toY(prom)} y2={toY(prom)} stroke={colors.textMuted} strokeWidth={1} strokeDasharray="4 4" opacity={0.6}/>}
          {ms.map((m,i)=>{
            const v=valsN[i]; const x=PL+slot*i+(slot-bw)/2;
            if(v==null) return (<g key={m}>
              <text x={x+bw/2} y={toY(0)-6} textAnchor="middle" fontSize={10} fill={colors.warning}>–</text>
              <text x={x+bw/2} y={H-6} textAnchor="middle" fontSize={ms.length>8?8:9} fill={colors.warning}>{fmtMes(m,true).split(" ")[0]}</text>
            </g>);
            const y0=toY(0), y1=toY(v);
            const ultimo=i===ms.length-1;
            return (<g key={m}>
              <rect x={x} y={Math.min(y0,y1)} width={bw} height={Math.max(2,Math.abs(y0-y1))} rx={4} fill={colors.accent} opacity={ultimo?1:0.55}/>
              <text x={x+bw/2} y={Math.min(y0,y1)-6} textAnchor="middle" fontSize={ms.length>8?8.5:10} fontWeight={ultimo?700:500} fill={ultimo?colors.text:colors.textSecondary}>{v.toLocaleString("es-AR",{maximumFractionDigits:1})}</text>
              <text x={x+bw/2} y={H-6} textAnchor="middle" fontSize={ms.length>8?8:9} fill={colors.textMuted}>{fmtMes(m,true).split(" ")[0]}</text>
            </g>);
          })}
        </svg>
      </div>
    );
  }

  function InflacionScreen({productos,inflacion,guardarInflacion,guardarInflacionVarios,borrarInflacion,empezarInflacion,dejarInflacion,pop,showToast,askConfirm,colors}) {
    const hoy=mesActual();
    const anterior=mesSumar(hoy,-1);
    const [sugeridas,setSugeridas]=useState({});
    const [estadoApi,setEstadoApi]=useState("cargando");
    const [editMes,setEditMes]=useState(null);
    const [valor,setValor]=useState("");
    const [saving,setSaving]=useState(false);

    const mesesCargados=Object.keys(inflacion).filter(k=>ES_MES.test(k)).sort();
    const activa=inflacion[INICIO_KEY]!=null||mesesCargados.length>0;
    const inicio=(()=>{
      const v=inflacion[INICIO_KEY];
      if(v!=null){const t=String(Math.round(v));return `${t.slice(0,4)}-${t.slice(4,6)}`;}
      const bases=productos.filter(p=>p.precioRef!=null).map(p=>p.precioRefMes||hoy).sort();
      return bases[0]||hoy;
    })();
    const primero=mesSumar(inicio,1);               // primer mes que se aplica
    // El mes en curso no se muestra: recién se carga cuando termina
    const previo=anterior>=primero?anterior:null;    // mes anterior: editable durante todo el mes en curso
    const viejos=[];for(let m=mesSumar(anterior,-1);m>=primero;m=mesSumar(m,-1))viejos.push(m); // solo se cargan si faltan
    const faltantes=[previo,...viejos].filter(m=>m&&inflacion[m]==null);
    const ultimoCargado=mesesCargados.filter(m=>m<hoy).slice(-1)[0]||null; // el único cargado que se puede editar

    useEffect(()=>{
      if(!activa){setEstadoApi("off");return;}
      const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),8000);
      fetch(INFLACION_API,{signal:ctrl.signal})
        .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
        .then(data=>{
          const m={};
          (data||[]).forEach(d=>{const k=mesDeFecha(d.fecha);if(k&&d.valor!=null&&!isNaN(Number(d.valor)))m[k]=Number(d.valor);});
          setSugeridas(m);setEstadoApi(Object.keys(m).length?"ok":"error");
        })
        .catch(e=>{console.warn("Inflación sugerida no disponible:",e);setEstadoApi("error");})
        .finally(()=>clearTimeout(to));
      return ()=>{clearTimeout(to);ctrl.abort();};
    },[activa]);

    const abrir=(m)=>{setEditMes(m);setValor(inflacion[m]!=null?String(inflacion[m]).replace(".",","):sugeridas[m]!=null?String(sugeridas[m]).replace(".",","):"");};
    const cerrar=()=>{setEditMes(null);setValor("");};
    const guardar=async()=>{
      const v=parseFloat(String(valor).replace(",","."));
      if(isNaN(v)||v<-50||v>100)return showToast("Porcentaje inválido","err");
      setSaving(true);
      try{await guardarInflacion(editMes,v);showToast(`✅ ${fmtMes(editMes)}: ${fmtPct(v)}`);cerrar();}catch(e){}
      finally{setSaving(false);}
    };
    const borrar=(m)=>askConfirm(`¿Borrar la inflación de ${fmtMes(m)}?`,async()=>{
      try{await borrarInflacion(m);cerrar();showToast("🗑️ Mes borrado");}catch(e){}
    },"Borrar","#ef4444");
    const empezar=()=>askConfirm(`Los precios de referencia actuales pasan a ser la base de ${fmtMes(hoy)}. La primera inflación que se aplica es la de ${fmtMes(mesSumar(hoy,1))}.`,async()=>{
      await empezarInflacion();showToast("📈 Inflación activada");
    },"Empezar","#10b981");
    const dejar=()=>askConfirm("Los precios de referencia quedan fijos en su valor actual y se borran los meses cargados. Podés volver a empezar cuando quieras.",async()=>{
      await dejarInflacion();showToast("Inflación desactivada");
    },"Dejar de contemplar","#ef4444");

    const lbl={fontSize:11,fontWeight:600,color:colors.textMuted,textTransform:"uppercase",letterSpacing:".08em"};
    const editor=(m,conBorrar)=>(<>
      <div style={{display:"flex",gap:6,alignItems:"center"}}>
        <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. 2,4" value={valor} onChange={e=>setValor(e.target.value)} onKeyDown={e=>e.key==="Enter"&&guardar()} style={{flex:1,padding:"9px 10px"}} autoFocus/>
        <span style={{color:colors.textMuted,fontSize:14}}>%</span>
        <button className="btn" disabled={saving} onClick={guardar} style={{background:colors.accent,color:"#fff",padding:"9px 14px",fontSize:13,opacity:saving?.6:1}}>Guardar</button>
        <button className="btn" disabled={saving} onClick={cerrar} style={{background:colors.btnSecondary,color:colors.textSecondary,padding:"9px 12px",fontSize:13}}>✕</button>
      </div>
      {sugeridas[m]!=null&&<div style={{fontSize:11.5,color:colors.textMuted,marginTop:6}}>INDEC: {fmtPct(sugeridas[m])}</div>}
      {conBorrar&&inflacion[m]!=null&&<button className="btn" disabled={saving} onClick={()=>borrar(m)} style={{marginTop:6,background:"none",color:colors.error,padding:"4px 0",fontSize:12.5}}>Borrar este mes</button>}
    </>);
    const valorTxt=(m)=>inflacion[m]!=null
      ?<span className="mono" style={{fontSize:15,fontWeight:700,color:colors.text}}>{fmtPct(inflacion[m])}</span>
      :<span style={{fontSize:12.5,color:colors.warning,fontWeight:600}}>Sin cargar{sugeridas[m]!=null?` · INDEC ${fmtPct(sugeridas[m])}`:""}</span>;
    const difiere=(m)=>inflacion[m]!=null&&sugeridas[m]!=null&&Math.abs(sugeridas[m]-inflacion[m])>0.001;

    if(!activa) return (<div className="fade">
      <TopBar colors={colors} title="📈 Inflación" subtitle="IPC mensual · actualiza los precios de referencia" onBack={pop}/>
      <div className="card" style={{padding:20,marginBottom:12}}>
        <div style={{fontSize:14,color:colors.text,lineHeight:1.55,marginBottom:6}}>Los precios de referencia no se están actualizando con la inflación.</div>
        <div style={{fontSize:12.5,color:colors.textMuted,lineHeight:1.5,marginBottom:16}}>Al empezar, los precios actuales quedan como base y cada mes cargás el IPC para actualizarlos. Si editás un precio a mano, ese producto arranca de nuevo desde ese mes.</div>
        <button className="btn" onClick={empezar} style={{width:"100%",background:"#10b981",color:"#fff",padding:13,fontSize:15,fontWeight:700}}>Empezar a contemplar inflación</button>
      </div>
    </div>);

    return (<div className="fade">
      <TopBar colors={colors} title="📈 Inflación" subtitle="IPC mensual · actualiza los precios de referencia" onBack={pop}
        right={<button className="btn" onClick={dejar} style={{background:colors.errorBg,color:colors.error,border:`1px solid ${colors.errorBorder}`,padding:"8px 11px",fontSize:12}}>Desactivar</button>}/>

      {mesesCargados.some(m=>m<hoy)&&<InflacionChart meses={mesesCargados.filter(m=>m<hoy)} inflacion={inflacion} colors={colors}/>}

      {!previo&&(
        <div className="card" style={{padding:16,marginBottom:10,fontSize:13,color:colors.textMuted,lineHeight:1.5}}>
          La primera inflación a cargar es la de <b style={{color:colors.text}}>{fmtMes(primero)}</b>. Va a aparecer acá cuando termine ese mes; el INDEC la publica a mediados de {fmtMes(mesSumar(primero,1))}.
        </div>
      )}

      {/* Mes anterior: siempre editable */}
      {previo&&(
        <div className="card" style={{padding:16,marginBottom:10,border:`1px solid ${colors.accent}66`}}>
          <div style={{...lbl,marginBottom:6}}>Último mes</div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{flex:1,fontSize:15,fontWeight:600,color:colors.text}}>{fmtMes(previo)}</div>
            {editMes!==previo&&<>
              {difiere(previo)&&<span style={{fontSize:11,color:colors.warning}}>INDEC {fmtPct(sugeridas[previo])}</span>}
              {valorTxt(previo)}
              {(inflacion[previo]==null||previo===ultimoCargado)&&<button className="btn" onClick={()=>abrir(previo)} style={{background:colors.btnSecondary,color:colors.accent,border:`1px solid ${colors.hoverCard}`,padding:"6px 10px",fontSize:12}}>{inflacion[previo]!=null?"✏️ Editar":"+ Cargar"}</button>}
            </>}
          </div>
          {editMes===previo&&<div style={{marginTop:10}}>{editor(previo,true)}</div>}
          <div style={{fontSize:12,color:colors.textMuted,lineHeight:1.45,marginTop:8}}>Una vez cargado, se puede editar hasta que se cargue el mes siguiente.</div>
        </div>
      )}

      {faltantes.length>0&&<div style={{fontSize:12.5,color:colors.warning,fontWeight:600,margin:"2px 2px 10px"}}>⚠️ Falta{faltantes.length>1?"n":""} cargar {faltantes.length} mes{faltantes.length>1?"es":""}</div>}

      {/* Meses anteriores: cerrados; solo se pueden cargar si faltan */}
      {viejos.length>0&&(<>
        <div style={{...lbl,margin:"14px 0 8px"}}>Meses anteriores</div>
        <div className="card" style={{overflow:"hidden",marginBottom:12}}>
          {viejos.map((m,i)=>{
            const cargado=inflacion[m]!=null;
            const editable=!cargado||m===ultimoCargado;
            return (<div key={m} style={{borderTop:i?`1px solid ${colors.cardBorder}`:"none",padding:"11px 14px"}}>
              {editMes===m?(<>
                <div style={{fontSize:13.5,fontWeight:600,color:colors.text,marginBottom:8}}>{fmtMes(m)}</div>
                {editor(m,m===ultimoCargado)}
              </>):(
                <div style={{display:"flex",alignItems:"center",gap:10,cursor:editable?"pointer":"default"}} onClick={()=>editable&&abrir(m)}>
                  <div style={{flex:1,fontSize:14,color:editable?colors.text:colors.textSecondary}}>{fmtMes(m)}</div>
                  {valorTxt(m)}
                  <span style={{fontSize:13,width:18,textAlign:"center",color:editable?colors.accent:colors.textMuted}}>{!cargado?"+":editable?"✏️":"🔒"}</span>
                </div>
              )}
            </div>);
          })}
        </div>
      </>)}

      <div style={{fontSize:11.5,color:colors.textMuted,marginBottom:20,lineHeight:1.5}}>
        {estadoApi==="cargando"?"Buscando el IPC publicado…":estadoApi==="ok"?"Valores del INDEC: ArgentinaDatos (vía BCRA).":"No se pudo consultar el IPC publicado. Cargá los valores a mano."}
        {" "}Cada producto acumula la inflación de los meses posteriores al mes en que se cargó o editó su precio.
      </div>
    </div>);
  }

  // ── BackupScreen ──────────────────────────────────────────────────────────────
  function BackupScreen({cats,productos,pop,showToast,colors,borrarBaseDatos,grupoInfo}) {
    const [copied,setCopied]=useState(false);
    const [showBorrar,setShowBorrar]=useState(false);
    const [confirmTxt,setConfirmTxt]=useState("");
    const [borrando,setBorrando]=useState(false);
    const compartido=(grupoInfo?.miembros?.length||0)>1;
    const habilitado=confirmTxt.trim().toUpperCase()==="ELIMINAR";
    const doBorrar=async()=>{
      if(!habilitado||borrando)return;
      setBorrando(true);
      try{
        await borrarBaseDatos();
        showToast("🗑️ Base de datos eliminada");
        setShowBorrar(false);
        pop();
      }catch(e){
        console.error(e);
        showToast("Error al eliminar: "+(e.message||""),"err");
        setBorrando(false);
      }
    };
    const text=buildBackupText(cats,productos);
    const doCopy=async()=>{
      const ok=await copyToClipboard(text);
      if(ok){setCopied(true);showToast("💾 Backup copiado al portapapeles");setTimeout(()=>setCopied(false),3000);}
      else showToast("No se pudo copiar","err");
    };
    return (<div className="fade">
      <TopBar colors={colors} title="💾 Backup" subtitle="Formato importable — copia de seguridad completa" onBack={pop}/>
      <div className="card" style={{padding:16,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{fontSize:13,color:colors.textMuted}}>{productos.length} productos · {cats.length} categorías</div>
          <button className="btn" onClick={doCopy} style={{background:copied?"#10b981":"#3b82f6",color:"#fff",padding:"7px 16px",fontSize:13,transition:"background .3s"}}>
            {copied?"✅ Copiado":"Copiar todo"}
          </button>
        </div>
        <pre style={{fontSize:12,color:colors.text,lineHeight:1.7,whiteSpace:"pre-wrap",fontFamily:"'DM Mono',monospace",background:colors.inputBg,borderRadius:8,padding:12,maxHeight:400,overflowY:"auto"}}>{text||"Sin productos."}</pre>
      </div>
      <button className="btn" onClick={()=>{setConfirmTxt("");setShowBorrar(true);}} style={{width:"100%",padding:12,background:colors.errorBg,color:colors.error,border:`1px solid ${colors.errorBorder}`,fontSize:13}}>🗑️ Eliminar base de datos</button>
      {showBorrar&&(
        <div style={{position:"fixed",inset:0,background:colors.overlayDark,zIndex:3000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>e.target===e.currentTarget&&!borrando&&setShowBorrar(false)}>
          <div style={{background:colors.card,border:`1px solid ${colors.errorBorder}`,borderRadius:16,padding:24,maxWidth:340,width:"100%"}}>
            <div style={{fontWeight:700,fontSize:17,color:colors.error,marginBottom:10}}>Eliminar base de datos</div>
            <div style={{fontSize:13.5,color:colors.text,lineHeight:1.5,marginBottom:10}}>
              Se borran <b>{cats.length} categorías</b>, <b>{productos.length} productos</b>, todo el stock y el historial de compras. No se puede deshacer.
            </div>
            {compartido&&<div style={{fontSize:12.5,color:colors.warning,lineHeight:1.4,marginBottom:10}}>⚠️ Compartís esta base con tu grupo familiar: se borra para todos los miembros.</div>}
            <div style={{fontSize:12.5,color:colors.textMuted,lineHeight:1.4,marginBottom:14}}>Si querés conservar una copia, cancelá y tocá "Copiar todo" primero.</div>
            <div className="field" style={{marginBottom:16}}>
              <label>Escribí ELIMINAR para confirmar</label>
              <input className="inp" autoComplete="canasta-field-ignore" autoCapitalize="characters" value={confirmTxt} onChange={e=>setConfirmTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doBorrar()} autoFocus/>
            </div>
            <div style={{display:"flex",gap:10}}>
              <button className="btn" disabled={borrando} onClick={()=>setShowBorrar(false)} style={{flex:1,background:colors.btnSecondary,color:colors.textSecondary,padding:12}}>Cancelar</button>
              <button className="btn" disabled={!habilitado||borrando} onClick={doBorrar} style={{flex:1,background:habilitado?colors.error:colors.btnSecondary,color:habilitado?"#fff":colors.textMuted,padding:12,cursor:habilitado&&!borrando?"pointer":"default",opacity:borrando?.6:1}}>{borrando?"Eliminando…":"Eliminar"}</button>
            </div>
          </div>
        </div>
      )}
    </div>);
  }

  // ── ImportScreen ──────────────────────────────────────────────────────────────
  function ImportScreen({cats,productos,guardar,pop,showToast,colors}) {
    const [step,setStep]=useState("input"); const [text,setText]=useState(""); const [parsed,setParsed]=useState([]);
    const [conflicts,setConflicts]=useState([]); const [resolutions,setResolutions]=useState({});
    const [catsParaImport,setCatsParaImport]=useState(null);
    const doParse=async()=>{
    const blocks=parseImportText(text);
    if(!blocks.length)return showToast("No se encontraron productos válidos","err");
    // Auto-create missing cats and subs
    let updatedCats=[...cats];
    const matched=blocks.map(b=>{
      let cat=updatedCats.find(c=>matchStr(c.label,b.catLabel));
      if(!cat){
        // Create new category
        const CATCOLORS=["#60a5fa","#f472b6","#4ade80","#fb923c","#a78bfa","#facc15","#34d399","#f87171","#38bdf8","#e879f9"];
        cat={id:uid(),label:b.catLabel,emoji:"📦",color:CATCOLORS[updatedCats.length%CATCOLORS.length],subs:[]};
        updatedCats=[...updatedCats,cat];
      }
      let sub=null;
      if(b.subLabel){
        sub=cat.subs.find(s=>matchStr(s.label,b.subLabel));
        if(!sub){
          // Create new subcategory
          sub={id:uid(),label:b.subLabel};
          const newSubs=[...cat.subs,sub];
          updatedCats=updatedCats.map(c=>c.id===cat.id?{...c,subs:newSubs}:c);
          cat={...cat,subs:newSubs};
        }
      }
      return{...b,catId:cat.id,subId:sub?.id||null,catMatched:true,subMatched:true,autoCreated:!cats.find(c=>c.id===cat.id),autoCreatedSub:b.subLabel&&!cats.find(c=>c.id===cat.id||c.subs.find(s=>s.id===sub?.id))};
    });
    // Guardar cats actualizadas en el estado local para que doImport las use
    if(updatedCats.length>cats.length||updatedCats.some((c,i)=>c.subs.length!==(cats[i]?.subs.length||0))){
      setCatsParaImport(updatedCats);
    } else {
      setCatsParaImport(null);
    }
    setParsed(matched);setStep("preview");
  };
    const doImport=async()=>{
      const toAdd=[];const toUpdate=[];
      parsed.forEach(block=>{
        if(!block.catId)return;
        block.products.forEach(p=>{
          const ex=productos.find(x=>x.nombre.toLowerCase()===p.nombre.toLowerCase()&&x.catId===block.catId);
          if(ex){if(resolutions[ex.id]==="overwrite")toUpdate.push({...ex,...p,catId:block.catId,subId:block.subId||null});}
          else{toAdd.push({...p,id:uid(),catId:block.catId,subId:block.subId||null,historialCompra:[]});}
        });
      });
      const updatedProds=productos.map(p=>{const u=toUpdate.find(x=>x.id===p.id);return u||p;}).concat(toAdd);
      // Guardar cats y productos en una sola operación
      await guardar(catsParaImport||null, updatedProds);
      showToast(`✅ ${toAdd.length} agregados, ${toUpdate.length} actualizados`);
      pop();
    };
    const checkConflicts=()=>{const found=[];parsed.forEach(block=>{if(!block.catId)return;block.products.forEach(p=>{const ex=productos.find(x=>x.nombre.toLowerCase()===p.nombre.toLowerCase()&&x.catId===block.catId);if(ex)found.push({existing:ex,incoming:p,block});});});if(found.length){setConflicts(found);const def={};found.forEach(c=>{def[c.existing.id]="skip";});setResolutions(def);setStep("conflicts");}else doImport();};
    return (<div className="fade"><TopBar colors={colors} title="📥 Importar lista" onBack={pop}/>
      {step==="input"&&(<div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div className="card" style={{padding:16}}>
          <div style={{fontSize:13,color:colors.textSecondary,marginBottom:10,lineHeight:1.6}}>Formato por bloque (separá bloques con línea en blanco):<pre style={{marginTop:8,fontSize:12,color:"#4a90d9",background:colors.inputBg,borderRadius:8,padding:10,lineHeight:1.8}}>{`---Higiene---\nPersonal\nShampoo-Dove-400-mL-4500$-1\nJabón-Dove-90-gr-1180$-4\n\nLimpieza hogar\nDetergente-Magistral-500-mL-2371$-1\n\n---Primario---\nLeche-Carrefour-1-L-1182$-9`}</pre></div>
          <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Pegá tu lista acá…" style={{width:"100%",minHeight:200,background:colors.inputBg,border:`1px solid ${colors.cardBorder}`,color:colors.text,borderRadius:10,padding:"11px 14px",fontSize:13,fontFamily:"'DM Mono',monospace",outline:"none",resize:"vertical",lineHeight:1.7}}/>
        </div>
        <div style={{display:"flex",gap:10}}><button className="btn" onClick={pop} style={{flex:1,background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.text,padding:13}}>Cancelar</button><button className="btn" onClick={doParse} style={{flex:2,background:colors.accent,color:"#fff",padding:13,fontSize:15}} disabled={!text.trim()}>Importar</button></div>
      </div>)}
      {step==="preview"&&(<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{fontSize:13,color:colors.textMuted,marginBottom:4}}>Se van a importar {parsed.reduce((s,b)=>s+b.products.length,0)} productos:</div>
        {parsed.map((block,bi)=>{const cat=cats.find(c=>c.id===block.catId);return(<div key={bi} className="card" style={{padding:14,borderLeft:`3px solid ${cat?.color||"#4a5568"}`}}>
          <div style={{fontWeight:600,fontSize:14,marginBottom:2,color:colors.text}}>{cat?.emoji} {block.catLabel}{block.subLabel?` › ${block.subLabel}`:""}</div>
          {block.autoCreated&&<div style={{fontSize:12,color:"#4ade80",marginBottom:6}}>✅ Categoría nueva creada</div>}
          {block.autoCreatedSub&&<div style={{fontSize:12,color:"#4ade80",marginBottom:6}}>✅ Subcategoría nueva creada</div>}
          <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:8}}>{block.products.map((p,pi)=>(<div key={pi} style={{fontSize:13,color:p.error?"#ef4444":"#c8cfe0",display:"flex",justifyContent:"space-between"}}><span>{p.error?`⚠️ ${p.error}`:`${p.nombre} · `}<span style={{color:colors.textMuted}}>{p.marca}</span></span><span className="mono" style={{color:"#60a5fa"}}>{p.precioRef?fmt(p.precioRef):"—"}</span></div>))}</div>
        </div>);})}
        <div style={{display:"flex",gap:10,marginTop:4}}><button className="btn" onClick={()=>setStep("input")} style={{flex:1,background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.text,padding:13}}>Volver</button><button className="btn" onClick={checkConflicts} style={{flex:2,background:colors.accent,color:"#fff",padding:13,fontSize:15}}>Importar</button></div>
      </div>)}
      {step==="conflicts"&&(<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{fontSize:13,color:colors.warning,marginBottom:4}}>⚠️ {conflicts.length} producto{conflicts.length!==1?"s":""} ya existe{conflicts.length===1?"":"n"}.</div>
        {conflicts.map((c,i)=>(<div key={i} className="card" style={{padding:14}}>
          <div style={{fontWeight:600,fontSize:14,marginBottom:8,color:colors.text}}>{c.existing.nombre}</div>
          <div style={{fontSize:12,color:colors.textMuted,marginBottom:10}}>Actual: {fmt(c.existing.precioRef)} · Nuevo: {fmt(c.incoming.precioRef)}</div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn" onClick={()=>setResolutions(r=>({...r,[c.existing.id]:"skip"}))} style={{flex:1,padding:"9px 0",fontSize:13,background:resolutions[c.existing.id]==="skip"?"#1a2235":"#0d1321",color:resolutions[c.existing.id]==="skip"?"#e8eaf0":"#4a5568",border:`1px solid ${resolutions[c.existing.id]==="skip"?"#3b82f6":"#1a2235"}`}}>Mantener</button>
            <button className="btn" onClick={()=>setResolutions(r=>({...r,[c.existing.id]:"overwrite"}))} style={{flex:1,padding:"9px 0",fontSize:13,background:resolutions[c.existing.id]==="overwrite"?"#3b82f622":"#0d1321",color:resolutions[c.existing.id]==="overwrite"?"#3b82f6":"#4a5568",border:`1px solid ${resolutions[c.existing.id]==="overwrite"?"#3b82f6":"#1a2235"}`}}>Sobreescribir</button>
          </div>
        </div>))}
        <div style={{display:"flex",gap:10,marginTop:4}}><button className="btn" onClick={()=>setStep("preview")} style={{flex:1,background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.text,padding:13}}>Volver</button><button className="btn" onClick={doImport} style={{flex:2,background:colors.accent,color:"#fff",padding:13,fontSize:15}}>Confirmar</button></div>
      </div>)}
    </div>);
  }

  // ── ConfigScreen ──────────────────────────────────────────────────────────────
  function ConfigScreen({cats,productos,guardar,pop,showToast,askConfirm,openCatId,colors}) {
    const [openId,setOpenId]=useState(openCatId||null); const [localCats,setLocalCats]=useState(cats);
    const [newSubInputs,setNewSubInputs]=useState({}); const [movingSub,setMovingSub]=useState(null); const [moveTarget,setMoveTarget]=useState("");
    useEffect(()=>{setLocalCats(cats);},[cats]);
    const save=async(next)=>{setLocalCats(next);await guardar(next,null);};
    const deleteCat=(id)=>askConfirm("¿Eliminar esta categoría?",async()=>{if(productos.some(p=>p.catId===id))return showToast("Eliminá los productos primero","err");save(localCats.filter(c=>c.id!==id));showToast("Categoría eliminada");setOpenId(null);},"Eliminar","#ef4444");
    const addSub=(catId)=>askConfirm(`¿Crear subcategoría "${(newSubInputs[catId]||"").trim()}"?`,async()=>{const label=(newSubInputs[catId]||"").trim();if(!label)return;save(localCats.map(c=>c.id===catId?{...c,subs:[...c.subs,{id:uid(),label}]}:c));setNewSubInputs(f=>({...f,[catId]:""}));showToast("✅ Subcategoría creada");},"Crear");
    const deleteSub=(catId,subId)=>askConfirm("¿Eliminar esta subcategoría?",async()=>{if(productos.some(p=>p.catId===catId&&p.subId===subId))return showToast("Eliminá los productos primero","err");save(localCats.map(c=>c.id===catId?{...c,subs:c.subs.filter(s=>s.id!==subId)}:c));},"Eliminar","#ef4444");
    const doMoveSub=async()=>{if(!moveTarget||!movingSub)return;const sub=localCats.find(c=>c.id===movingSub.catId)?.subs?.find(s=>s.id===movingSub.subId);if(!sub)return;const nc=localCats.map(c=>{if(c.id===movingSub.catId)return{...c,subs:c.subs.filter(s=>s.id!==movingSub.subId)};if(c.id===moveTarget)return{...c,subs:[...c.subs,sub]};return c;});const np=productos.map(p=>p.catId===movingSub.catId&&p.subId===movingSub.subId?{...p,catId:moveTarget}:p);await guardar(nc,np);setMovingSub(null);setMoveTarget("");showToast("✅ Subcategoría movida");};
    return (<div className="fade"><TopBar colors={colors} title="📂 Configuración" subtitle="Categorías y subcategorías" onBack={pop}/>
      {movingSub&&(<div style={{position:"fixed",inset:0,background:colors.overlayDark,zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:colors.card,border:`1px solid ${colors.hoverCard}`,borderRadius:16,padding:24,maxWidth:320,width:"100%"}}>
          <div style={{fontWeight:600,marginBottom:4,color:colors.text}}>Mover "{movingSub.label}"</div>
          <div style={{fontSize:12,color:colors.textMuted,marginBottom:14}}>Elegí la categoría destino:</div>
          <select className="inp" value={moveTarget} onChange={e=>setMoveTarget(e.target.value)} style={{marginBottom:16}}><option value="">— Elegir —</option>{localCats.filter(c=>c.id!==movingSub.catId).sort((a,b)=>alpha(a,b)).map(c=><option key={c.id} value={c.id}>{c.emoji} {c.label}</option>)}</select>
          <div style={{display:"flex",gap:10}}><button className="btn" onClick={()=>{setMovingSub(null);setMoveTarget("");}} style={{flex:1,background:colors.btnSecondary,color:colors.textSecondary,padding:12}}>Cancelar</button><button className="btn" onClick={doMoveSub} style={{flex:1,background:colors.accent,color:"#fff",padding:12}} disabled={!moveTarget}>Mover</button></div>
        </div>
      </div>)}
      {[...localCats].sort((a,b)=>alpha(a,b)).map(cat=>(<div key={cat.id} className="card" style={{marginBottom:10,overflow:"hidden",borderTop:`3px solid ${cat.color}`}}>
        <div style={{padding:"14px 16px",display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>setOpenId(openId===cat.id?null:cat.id)}>
          <span style={{fontSize:20}}>{cat.emoji}</span><span style={{fontWeight:600,flex:1,color:colors.text}}>{cat.label}</span><span style={{fontSize:12,color:colors.textMuted}}>{cat.subs.length} sub</span><span style={{color:colors.textMuted,fontSize:13,marginLeft:4}}>{openId===cat.id?"▲":"▼"}</span>
        </div>
        {openId===cat.id&&(<div style={{padding:"0 16px 16px",borderTop:`1px solid ${colors.cardBorder}`}}>
          <CatEditFields cat={cat} onSave={(changes)=>askConfirm("¿Guardar cambios?",()=>save(localCats.map(c=>c.id===cat.id?{...c,...changes}:c)),"Guardar")} colors={colors}/>
          <div style={{marginTop:14}}>
            <div style={{fontSize:11,fontWeight:600,color:colors.textMuted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Subcategorías</div>
            {[...cat.subs].sort((a,b)=>alpha(a,b)).map(sub=>(<SubEditRow key={sub.id} sub={sub} catColor={cat.color}
              onSave={(label)=>askConfirm("¿Guardar cambios?",()=>save(localCats.map(c=>c.id===cat.id?{...c,subs:c.subs.map(s=>s.id===sub.id?{...s,label}:s)}:c)),"Guardar")}
              onDelete={()=>deleteSub(cat.id,sub.id)} onMove={()=>{setMovingSub({catId:cat.id,subId:sub.id,label:sub.label});setMoveTarget("");}} colors={colors}/>))}
            <div style={{display:"flex",gap:8,marginTop:6}}><input type="search" autoComplete="canasta-field-ignore" className="inp" placeholder="+ Nueva subcategoría…" value={newSubInputs[cat.id]||""} onChange={e=>setNewSubInputs(f=>({...f,[cat.id]:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addSub(cat.id)} style={{flex:1,borderStyle:"dashed",padding:"8px 12px",fontSize:13}}/><button className="btn" onClick={()=>addSub(cat.id)} style={{background:cat.color,color:"#080c14",padding:"7px 14px",fontSize:14}}>+</button></div>
          </div>
          <button className="btn" onClick={()=>deleteCat(cat.id)} style={{marginTop:14,width:"100%",background:colors.errorBg,color:colors.error,border:`1px solid ${colors.errorBorder}`,padding:10,fontSize:13}}>Eliminar categoría</button>
        </div>)}
      </div>))}
    </div>);
  }

  function CatEditFields({cat,onSave,colors}) {
    const [emoji,setEmoji]=useState(cat.emoji); const [label,setLabel]=useState(cat.label); const [color,setColor]=useState(cat.color);
    return (<div style={{marginTop:12}}>
      <div style={{display:"grid",gridTemplateColumns:"64px 1fr",gap:8}}>
        <div className="field"><label>Emoji</label><input type="search" autoComplete="canasta-field-ignore" className="inp" value={emoji} onChange={e=>setEmoji(e.target.value)} style={{textAlign:"center",fontSize:18,padding:"8px 4px"}}/></div>
        <div className="field"><label>Nombre</label><input type="search" autoComplete="canasta-field-ignore" className="inp" value={label} onChange={e=>setLabel(e.target.value)}/></div>
      </div>
      <div style={{marginTop:10}}><div style={{fontSize:11,fontWeight:600,color:colors.textMuted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Color</div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{COLORS.map(c=><div key={c} onClick={()=>setColor(c)} style={{width:26,height:26,borderRadius:"50%",background:c,cursor:"pointer",border:color===c?"3px solid #fff":"3px solid transparent",transition:"all .15s"}}/>)}</div></div>
      <button className="btn" onClick={()=>onSave({emoji,label,color})} style={{marginTop:10,width:"100%",background:colors.btnSecondary,color:colors.accent,padding:10,fontSize:13}}>Guardar cambios categoría</button>
    </div>);
  }

  function SubEditRow({sub,catColor,onSave,onDelete,onMove,colors}) {
    const [label,setLabel]=useState(sub.label);
    return (<div style={{background:colors.inputBg,borderRadius:8,padding:"8px 10px",marginBottom:6}}>
      <input type="search" autoComplete="canasta-field-ignore" className="inp" value={label} onChange={e=>setLabel(e.target.value)} style={{marginBottom:6,padding:"7px 10px",fontSize:13}}/>
      <div style={{display:"flex",gap:6}}>
        <button className="btn" onClick={()=>onSave(label)} style={{flex:1,background:colors.btnSecondary,color:colors.accent,padding:"6px 0",fontSize:12}}>Guardar</button>
        <button className="btn" onClick={onMove} style={{flex:1,background:colors.btnSecondary,color:colors.warning,padding:"6px 0",fontSize:12}}>Mover</button>
        <button className="btn" onClick={onDelete} style={{flex:1,background:colors.errorBg,color:colors.error,border:`1px solid ${colors.errorBorder}`,padding:"6px 0",fontSize:12}}>Eliminar</button>
      </div>
    </div>);
  }

  // ── Root: gate de sesión + captura de invitación por link ──────────────────────
  function Root() {
    const [session,setSession]=useState(undefined); // undefined=cargando, null=sin sesión
    const [inviteInfo,setInviteInfo]=useState(null);
    const [inviteChecked,setInviteChecked]=useState(false);
    const [pendingInvite,setPendingInvite]=useState(null);
    const isDarkModeAuth=(()=>{try{return localStorage.getItem("canasta_dark_mode")!=="false";}catch{return true;}})();
    const colorsAuth=getColors(isDarkModeAuth);

    useEffect(()=>{
      const m=(window.location.hash||"").match(/^#join\/([a-zA-Z0-9]+)/);
      if(m){
        setPendingInvite(m[1]);
        sb.rpc("buscar_grupo_por_codigo",{codigo:m[1]})
          .then(({data})=>{setInviteInfo(data&&data[0]?data[0]:null);setInviteChecked(true);})
          .catch(()=>setInviteChecked(true));
      } else setInviteChecked(true);
    },[]);

    useEffect(()=>{
      sb.auth.getSession().then(({data})=>setSession(data.session||null));
      const {data:listener}=sb.auth.onAuthStateChange((_evt,s)=>setSession(s));
      return ()=>listener.subscription.unsubscribe();
    },[]);

    if(session===undefined||!inviteChecked){
      return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",color:"#3b82f6",fontFamily:"monospace"}}>Cargando…</div>;
    }
    if(!session){
      return <AuthScreen colors={colorsAuth} inviteInfo={inviteInfo} onAuthed={()=>{}}/>;
    }
    return <App session={session} pendingInvite={pendingInvite} onInviteHandled={()=>setPendingInvite(null)}/>;
  }

  // ── Mount ────────────────────────────────────────────────────────────────────
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<Root/>);

})();
</script>
<script>
  if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{});});}
</script>
</body>
</html>
