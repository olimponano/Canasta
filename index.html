  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const norm = (s) => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
  const matchStr = (a, b) => {
    return norm(a) === norm(b);
  };
  const fmt = (n) => n == null ? "—" : `$${Number(n).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  const fmtDate = (d) => new Date(d + "T12:00:00").toLocaleDateString("es-AR", { day: "2-digit", month: "short", year: "2-digit" });
  const todayISO = () => new Date().toISOString().split("T")[0];
  // ── Meses e inflación ──
  // Los meses se manejan como texto "YYYY-MM" (se ordenan bien como texto)
  const ES_MES=/^\d{4}-\d{2}$/;
  // En la tabla de inflación, la fila "_inicio" guarda desde cuándo se contempla (pct = AAAAMM)
  const INICIO_KEY="_inicio";
  const mesActual=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;};
  const mesDeFecha=(f)=>f?String(f).slice(0,7):null;
  const mesSumar=(m,n)=>{const [y,mo]=m.split("-").map(Number);const t=y*12+(mo-1)+n;return `${Math.floor(t/12)}-${String(t%12+1).padStart(2,"0")}`;};
  const MESES_NOMBRE=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const fmtMes=(m,corto=false)=>{if(!m)return "—";const [y,mo]=m.split("-").map(Number);const n=MESES_NOMBRE[mo-1]||"";return corto?`${n.slice(0,3).toLowerCase()} ${String(y).slice(2)}`:`${n} ${y}`;};
  // Factor acumulado de los meses m con desde < m < hasta (los dos extremos excluidos)
  const factorInflacion=(infl,desde,hasta)=>{
    let f=1;
    Object.keys(infl||{}).forEach(m=>{if(!ES_MES.test(m))return;if((!desde||m>desde)&&(!hasta||m<hasta))f*=1+(Number(infl[m])||0)/100;});
    return f;
  };
  // Ref vigente: base × inflación de los meses posteriores al mes base que YA TERMINARON
  // (el valor del mes en curso se aplica recién a fin de mes). Redondeado a pesos si hubo inflación.
  const refConInflacion=(base,mesBase,infl,hasta=null)=>{
    if(base==null||base==="")return null;
    const f=factorInflacion(infl,mesBase||mesActual(),hasta||mesActual());
    return f===1?base:Math.round(base*f);
  };

  // Calcula el descuento aplicado por una promo sobre un subtotal, respetando el tope si está limitada.
  // Como el % es igual para toda la compra, distribuir proporcionalmente a cada producto
  // equivale a multiplicar el total de cada uno por el mismo factor.
  const calcPromo=(subtotal,promo)=>{
    if(!promo||!subtotal||subtotal<=0)return{descuentoAplicado:0,factor:1};
    const pct=parseFloat(String(promo.pct||0).replace(",","."))||0;
    const rawDescuento=subtotal*pct/100;
    const limite=promo.limitado?(parseFloat(String(promo.limite||0).replace(",","."))||0):null;
    const descuentoAplicado=promo.limitado?Math.min(rawDescuento,limite):rawDescuento;
    const factor=descuentoAplicado>0?(subtotal-descuentoAplicado)/subtotal:1;
    return{descuentoAplicado,factor};
  };
  // Último precio de compra, llevado a la cantidad de referencia del producto (comparable con el Ref)
  const ultimoEquiv=(p)=>{
    const h=p?.historialCompra||[]; if(!h.length)return null;
    const u=h[h.length-1];
    if(u.equivalente!=null)return u.equivalente;
    const c=parseFloat(String(u.cantidad||"").replace(",","."));
    if(c>0&&p.cantidadRef)return (u.precio/c)*p.cantidadRef;
    return u.precio??null;
  };
  // % de diferencia de a respecto de b
  const pctDiff=(a,b)=>(a!=null&&b)?((a-b)/b*100):null;
  // % del ticket completo vs Ref y vs Últ (solo items que tienen ese dato)
  // factor: descuento de una promo todavía no aplicada (ticket en curso); 1 si ya está incluido
  const ticketDiffs=(items,factor=1)=>{
    const calc=(k)=>{
      const its=(items||[]).filter(x=>!x.suelto&&(x[k]??0)>0);
      const base=its.reduce((s,x)=>s+x[k],0);
      const pag=its.reduce((s,x)=>s+(x.totalPagado??x.precio??0),0)*factor;
      return base>0?(pag-base)/base*100:null;
    };
    return {refPct:calc("totalRef"),ultPct:calc("totalUlt")};
  };
  // Etiquetas "Ref ▲x%  Últ ▼y%"
  function PctPair({refPct,ultPct,size=11,gap=8}) {
    const one=(lbl,v)=>v==null?null:(
      <span style={{fontSize:size,fontWeight:700,color:v<=0?"#10b981":"#ef4444",whiteSpace:"nowrap"}}>{lbl} {v<=0?"▼":"▲"}{Math.abs(v).toFixed(1)}%</span>
    );
    if(refPct==null&&ultPct==null)return null;
    return <span style={{display:"inline-flex",gap,alignItems:"baseline"}}>{one("Ref",refPct)}{one("Últ",ultPct)}</span>;
  }
  // Ref | Últ | Total de la tarjeta de compra (sin celdas: leyenda + precio al lado, % abajo)
  function CompararCeldas({precioRef,precioUlt,equivalente,totalPagado,colors}) {
    const lbl={fontSize:10,color:colors.textMuted,fontWeight:600,textTransform:"uppercase",letterSpacing:".04em"};
    const item=(titulo,valor)=>{
      const d=pctDiff(equivalente,valor);
      return (<div style={{minWidth:0}}>
        <div style={{display:"flex",alignItems:"baseline",gap:6,whiteSpace:"nowrap"}}>
          <span style={lbl}>{titulo}</span>
          <span className="mono" style={{fontSize:12,fontWeight:700,color:valor?colors.textSecondary:colors.hoverCard,overflow:"hidden",textOverflow:"ellipsis"}}>{valor?fmt(valor):"—"}</span>
        </div>
        <div style={{fontSize:12,fontWeight:700,marginTop:3,minHeight:16,color:d==null?colors.textMuted:d>0?"#ef4444":"#10b981"}}>{d==null?"—":`${d>0?"▲":"▼"}${Math.abs(d).toFixed(1)}%`}</div>
      </div>);
    };
    return (
      <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,1fr) 96px",gap:6,marginBottom:16,alignItems:"start"}}>
        {item("Ref",precioRef)}
        {item("Últ",precioUlt)}
        <div style={{textAlign:"right"}}>
          <div style={lbl}>Total</div>
          <div className="mono" style={{fontSize:14,fontWeight:700,marginTop:2,whiteSpace:"nowrap",color:totalPagado?colors.text:colors.hoverCard}}>{totalPagado?fmt(totalPagado):"—"}</div>
        </div>
      </div>
    );
  }
  const COLORS = ["#60a5fa","#f472b6","#4ade80","#fb923c","#a78bfa","#facc15","#34d399","#f87171","#38bdf8","#e879f9"];
  const alpha = (a, b, key="label") => (a[key]||"").localeCompare(b[key]||"", "es");
  const alphaStr = (a, b) => (a||"").localeCompare(b||"", "es");
  const fmtU = (u) => {
    if (!u) return "—";
    if (Number.isInteger(u)) return String(u);
    const fracs = [[1/12,"1/12"],[1/6,"1/6"],[1/4,"1/4"],[1/3,"1/3"],[1/2,"1/2"],[2/3,"2/3"],[3/4,"3/4"]];
    for (const [v,s] of fracs) if (Math.abs(u-v)<0.001) return s;
    return Number(u.toFixed(2)).toLocaleString("es-AR");
  };

  // Parse "NxM" format → total numeric value. "4x30"→120, "300"→300
  const parseQty = (s) => {
    if (!s) return null;
    const str = String(s).trim();
    if (str.includes("x")) {
      const [a, b] = str.split("x").map(Number);
      return (isNaN(a)||isNaN(b)) ? null : a * b;
    }
    const n = parseFloat(str.replace(",","."));
    return isNaN(n) ? null : n;
  };

  // Parse fraction input "1/3" → 0.333, "2" → 2
  const parseFrac = (s) => {
    if (!s) return null;
    const str = String(s).trim();
    if (str.includes("/")) {
      const [a,b] = str.split("/").map(Number);
      return (!isNaN(a)&&!isNaN(b)&&b!==0) ? a/b : null;
    }
    const n = parseFloat(str.replace(",","."));
    return isNaN(n) ? null : n;
  };
  // Muestra "3x40m" si hay display guardado, sino "120m"
  const fmtCantRef=(p)=>{if(!p||!p.cantidadRef)return "";if(p.unidad==="m"&&p.rollosRef&&p.metrosRef)return `${p.rollosRef}x${p.metrosRef}m`;return `${p.cantidadRef}${p.unidad||""}`;};

  const DEFAULT_CATS = [
    { id:"primario",   label:"Primario",   emoji:"🛒", color:"#60a5fa", subs:[] },
    { id:"higiene",    label:"Higiene",    emoji:"🧴", color:"#f472b6", subs:[] },
    { id:"verduleria", label:"Verdulería", emoji:"🥦", color:"#4ade80", subs:[] },
    { id:"carniceria", label:"Carnicería", emoji:"🥩", color:"#fb923c", subs:[] },
    { id:"secundario", label:"Secundario", emoji:"🍪", color:"#a78bfa", subs:[] },
  ];
  const DEFAULT_PRODUCTOS = [];
  const UNASSIGNED_ID = "__sin_sub__";
  const TODOS_ID = "__todos__"; // lista con los productos de todas las categorías

  function isUnassignedProd(p, cat) {
    if (!cat || !cat.subs.length) return false;
    return !p.subId || !cat.subs.find(s => s.id === p.subId);
  }

  // Backup export — full format compatible with import
  function buildBackupText(cats, productos) {
    const lines = [];
    [...cats].sort((a,b)=>alpha(a,b)).forEach(cat => {
      const catProds = productos.filter(p=>p.catId===cat.id);
      if (!catProds.length) return;
      lines.push(`---${cat.label}---`);
      if (cat.subs.length === 0) {
        [...catProds].sort((a,b)=>alpha(a,b,"nombre")).forEach(p => {
          const um = p.unidadesMes ? (Number.isInteger(p.unidadesMes)?String(p.unidadesMes):(() => {
            const fracs=[[1/12,"1/12"],[1/6,"1/6"],[1/4,"1/4"],[1/3,"1/3"],[1/2,"1/2"],[2/3,"2/3"],[3/4,"3/4"]];
            for(const [v,s] of fracs) if(Math.abs(p.unidadesMes-v)<0.001) return s;
            return p.unidadesMes.toFixed(2);
          })()) : "";
          const cant = p.cantidadRef||"";
          const unit = p.unidad||"gr";
          const precio = p.precioRef?`${p.precioRef}$`:"";
          lines.push([p.nombre,p.marca||"",cant,unit,precio,um].filter((v,i)=>i<4||v).join("-"));
        });
      } else {
        [...cat.subs].sort((a,b)=>alpha(a,b)).forEach(sub => {
          const subProds = [...catProds.filter(p=>p.subId===sub.id)].sort((a,b)=>alpha(a,b,"nombre"));
          if (!subProds.length) return;
          lines.push(sub.label);
          subProds.forEach(p => {
            const um = p.unidadesMes ? (Number.isInteger(p.unidadesMes)?String(p.unidadesMes):(() => {
              const fracs=[[1/12,"1/12"],[1/6,"1/6"],[1/4,"1/4"],[1/3,"1/3"],[1/2,"1/2"],[2/3,"2/3"],[3/4,"3/4"]];
              for(const [v,s] of fracs) if(Math.abs(p.unidadesMes-v)<0.001) return s;
              return p.unidadesMes.toFixed(2);
            })()) : "";
            const cant = p.cantidadRef||"";
            const unit = p.unidad||"gr";
            const precio = p.precioRef?`${p.precioRef}$`:"";
            lines.push([p.nombre,p.marca||"",cant,unit,precio,um].filter((v,i)=>i<4||v).join("-"));
          });
        });
      }
      lines.push("");
    });
    return lines.join("\n").trim();
  }

  function buildExportText(cats, productos, filterCatId=null, filterSubId=null) {
    // Handle orphans export
    if(filterSubId==="__sin_sub__"&&filterCatId){
      const cat=cats.find(c=>c.id===filterCatId);
      const validSubs=new Set((cat?.subs||[]).map(s=>s.id));
      const orphans=productos.filter(p=>p.catId===filterCatId&&(!p.subId||!validSubs.has(p.subId)));
      const lines=[];
      lines.push(`=== ${cat?.label.toUpperCase()} — SIN SUBCATEGORÍA ===`);
      [...orphans].sort((a,b)=>alpha(a,b,"nombre")).forEach(p=>{const cant=p.unidad==="m"&&p.rollosRef&&p.metrosRef?`${p.rollosRef}x${p.metrosRef}`:p.cantidadRef||"";const um=p.unidadesMes||"";lines.push(`${p.nombre}-${p.marca||""}-${cant}-${p.unidad||"gr"}-$${p.precioRef||""}-${um}`);});
      return lines.join("\n").trim();
    }
    const lines = [];
    const tCats = filterCatId ? cats.filter(c=>c.id===filterCatId) : [...cats].sort((a,b)=>alpha(a,b));
    tCats.forEach(cat => {
      const cp = productos.filter(p=>p.catId===cat.id); if (!cp.length) return;
      if (cat.subs.length===0) {
        const f = filterSubId ? [] : [...cp].sort((a,b)=>alpha(a,b,"nombre"));
        if (!f.length) return;
        lines.push(`=== ${cat.label.toUpperCase()} ===`);
        f.forEach(p=>{
          const cant=p.unidad==="m"&&p.rollosRef&&p.metrosRef?`${p.rollosRef}x${p.metrosRef}`:p.cantidadRef||"";
          const um=p.unidadesMes||"";
          lines.push(`${p.nombre}-${p.marca||""}-${cant}-${p.unidad||"gr"}-$${p.precioRef||""}-${um}`);
        });
      } else {
        const tSubs = filterSubId ? cat.subs.filter(s=>s.id===filterSubId) : [...cat.subs].sort((a,b)=>alpha(a,b));
        const validSubs=new Set(cat.subs.map(s=>s.id));
        const orphans=cp.filter(p=>!p.subId||!validSubs.has(p.subId));
        const hasProds = tSubs.some(sub => cp.some(p=>p.subId===sub.id)) || (!filterSubId&&orphans.length>0);
        if (!hasProds) return;
        lines.push(`=== ${cat.label.toUpperCase()} ===`);
        tSubs.forEach(sub => {
          const sp = [...cp.filter(p=>p.subId===sub.id)].sort((a,b)=>alpha(a,b,"nombre"));
          if (!sp.length) return;
          lines.push(`--- ${sub.label} ---`);
          sp.forEach(p=>{const cant=p.unidad==="m"&&p.rollosRef&&p.metrosRef?`${p.rollosRef}x${p.metrosRef}`:p.cantidadRef||"";const um=p.unidadesMes||"";lines.push(`${p.nombre}-${p.marca||""}-${cant}-${p.unidad||"gr"}-$${p.precioRef||""}-${um}`);});
        });
        // Exportar huérfanos al final si no hay filtro de sub
        if(!filterSubId&&orphans.length>0){
          lines.push(`--- Sin subcategoría ---`);
          [...orphans].sort((a,b)=>alpha(a,b,"nombre")).forEach(p=>{const cant=p.unidad==="m"&&p.rollosRef&&p.metrosRef?`${p.rollosRef}x${p.metrosRef}`:p.cantidadRef||"";const um=p.unidadesMes||"";lines.push(`${p.nombre}-${p.marca||""}-${cant}-${p.unidad||"gr"}-$${p.precioRef||""}-${um}`);});
        }
      }
    });
    return lines.join("\n").trim();
  }

  async function copyToClipboard(text) {
    try { if (navigator.clipboard) { await navigator.clipboard.writeText(text); return true; } } catch {}
    try {
      const el=document.createElement("textarea"); el.value=text; el.setAttribute("readonly","");
      el.style.cssText="position:absolute;left:-9999px;top:0"; document.body.appendChild(el);
      el.focus(); el.select(); el.setSelectionRange(0,el.value.length);
      const ok=document.execCommand("copy"); document.body.removeChild(el); return ok;
    } catch { return false; }
  }

  function parseProductLine(l) {
    if (!/\$/.test(l)||!l.includes("-")) return null;
    const parts=l.split("-").map(p=>p.trim()); if(parts.length<4) return null;
    const nombre=parts[0],marca=parts[1];
    const rawCant=(parts[2]||"").trim();
    const uLow=(parts[3]||"").toLowerCase();
    const unidad=uLow==="ml"?"mL":uLow==="l"?"L":uLow==="kg"?"kg":uLow==="m"?"m":uLow==="un"?"un":"gr";
    const precioRef=parseFloat((parts[4]||"").replace(/[$\s]/g,"").replace(",","."))||null;
    const umStr=(parts[5]||"").trim();
    const unidadesMes=umStr?(umStr.includes("/")?parseFloat(umStr.split("/")[0])/parseFloat(umStr.split("/")[1]):parseFloat(umStr.replace(",","."))):null;
    let cantidadRef=null, rollosRef=null, metrosRef=null;
    if(unidad==="m"){
      // Para metros debe ser formato NxM
      const mMatch=rawCant.match(/^(\d+(?:\.\d+)?)[xX×*](\d+(?:\.\d+)?)$/);
      if(!mMatch) return {error:`Formato inválido para metros: "${rawCant}". Usá formato 3x40 (o 3×40)`, nombre, marca};
      rollosRef=parseFloat(mMatch[1]);
      metrosRef=parseFloat(mMatch[2]);
      cantidadRef=rollosRef*metrosRef;
    } else {
      cantidadRef=uLow==="un"?parseFloat(rawCant)||null:(parseFloat(rawCant)||null);
    }
    return {nombre,marca,cantidadRef,rollosRef,metrosRef,unidad,precioRef,unidadesMes};
  }

  function parseImportText(text) {
    const lines=text.split("\n").map(l=>l.trim());
    const parsed=[]; let currentCat=null,currentSub=null,currentProducts=[];
    const flush=()=>{if(currentCat&&currentProducts.length){parsed.push({catLabel:currentCat,subLabel:currentSub,products:[...currentProducts]});currentProducts=[];}};
    for(const line of lines){
      if(!line) continue;
      const catMatch=line.match(/^---(.+?)---$/);
      if(catMatch){flush();currentCat=catMatch[1].trim();currentSub=null;continue;}
      if(!currentCat) continue;
      const prod=parseProductLine(line);
      if(prod){currentProducts.push(prod);}
      else{flush();currentSub=line;}
    }
    flush();
    return parsed;
  }

    const eliminarItem=(idx)=>askConfirm("¿Eliminar este producto del ticket?",()=>setTicket(t=>t.filter((_,i)=>i!==idx)),"Eliminar","#ef4444");

      const totalPagado=nuevoPrecio*nuevaCant;
      const totalRef=item.totalRef&&item.cantComprada?item.totalRef/item.cantComprada*nuevaCant:(item.precioRef?item.precioRef*nuevaCant:null);

  function TicketItemRow({item,factor=1,colors}) {
    const totalPagado=item.totalPagado??item.precio??0;
    const totalMostrado=totalPagado*factor;
    const precioMostrado=(item.precio??0)*factor;
    const refPct=item.totalRef>0?pctDiff(totalMostrado,item.totalRef):null;
    const ultPct=item.totalUlt>0?pctDiff(totalMostrado,item.totalUlt):null;
    const cantLabel=item.unidad==="m"&&item.rollosRef&&item.metrosRef
      ?`${item.rollosRef}x${item.metrosRef}m`
      :item.cantRef?`${item.cantRef}${item.unidad||""}`:null;
    return (
      <div style={{padding:"5px 0"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>

          <div style={{fontSize:11,color:colors.textMuted}}>{item.marca||""}{cantLabel?` · ${cantLabel}`:""}</div>

  // ── ComprasCardInline ─────────────────────────────────────────────────────────
  // soloModal: abre directo la ventana de compra (desde la lista), con initCant paquetes; avisa con onClose/onAgregado
  function ComprasCardInline({p,cat,stock,stockTotal,guardarStock,mesesRestantes,fmtMeses,guardar,productos,showToast,agregarAlTicket,colors,soloModal=false,initCant=null,onClose,onAgregado}) {
    const [open,setOpenRaw]=useState(!!soloModal);
    const setOpen=(v)=>{setOpenRaw(v);if(!v&&soloModal&&onClose)onClose();};
    const [precio,setPrecio]=useState("");
    const [cantidad,setCantidad]=useState(p.cantidadRef?String(p.cantidadRef):"");
    const [cantRollos,setCantRollos]=useState(p.rollosRef?String(p.rollosRef):"");
    const [cantMetros,setCantMetros]=useState(p.metrosRef?String(p.metrosRef):"");
    const [cantComprada,setCantComprada]=useState(initCant?String(initCant).replace(".",","):"1");
    const [saving,setSaving]=useState(false);

    const esM=p.unidad==="m";
    const entradasGuardadas=stock[p.id]||[];
    const total=stockTotal(p);
    const meses=mesesRestantes(p);
    const mesesTxt=fmtMeses(meses,true);
    const urgColor=meses===null?"#4a5568":meses===0?"#ef4444":meses<1?"#f97316":meses<2?"#facc15":"#4ade80";
    const hist=p.historialCompra||[];
    const precioUlt=ultimoEquiv(p);
    const fmtTotal=(t)=>{const r=Math.round(t*100)/100;return r===Math.round(r)?String(Math.round(r)):r.toLocaleString("es-AR");};

    const precioNum=parseFloat((precio||"").replace(",","."));
    const cantRollosNum=esM?(parseInt(cantRollos)||0):0;
    const cantMetrosNum=esM?(parseFloat(cantMetros)||0):0;
    const cantCompradaNum=parseFloat((cantComprada||"").replace(",","."))||1;
    const metrosPorPaq=cantRollosNum*cantMetrosNum;
    // cantNum = cantidad de UN paquete (los paquetes comprados van en cantCompradaNum)
    const cantNum=esM?metrosPorPaq:parseFloat((cantidad||"").replace(",","."));
    const cantDisplay=esM&&cantRollosNum>0&&cantMetrosNum>0?`${cantRollosNum}x${cantMetrosNum}`:null;
    const cantRefNum=p.cantidadRef;
    const equivalente=!(precioNum>0)?null
      :cantRefNum?(cantNum>0?(precioNum/cantNum)*cantRefNum:null)
      :precioNum;
    const totalPagado=precioNum>0&&cantCompradaNum>0?precioNum*cantCompradaNum:null;
    // Precio de referencia y último, llevados a la cantidad de este paquete
    const aPaquete=(v)=>v==null?null:(cantRefNum&&cantNum>0?(v/cantRefNum)*cantNum:v);
    const totalRef=p.precioRef&&cantCompradaNum>0?aPaquete(p.precioRef)*cantCompradaNum:null;
    const totalUlt=precioUlt&&cantCompradaNum>0?aPaquete(precioUlt)*cantCompradaNum:null;

    const doRegistrar=async()=>{
      if(!precioNum||precioNum<=0)return showToast("Precio inválido","err");

  function AuthScreen({colors,inviteInfo,onAuthed}) {
    const [modo,setModo]=useState("login"); // login | registro
    const [email,setEmail]=useState("");
    const [password,setPassword]=useState("");
    const [password2,setPassword2]=useState("");
    const [nombre,setNombre]=useState("");
    const [loading,setLoading]=useState(false);
    const [error,setError]=useState("");
    const [checkEmail,setCheckEmail]=useState(false);

    const submit=async()=>{
      setError("");
      if(!email||!password){setError("Completá email y contraseña.");return;}
      if(modo==="registro"){
        if(password.length<6){setError("La contraseña tiene que tener al menos 6 caracteres.");return;}
        if(password!==password2){setError("Las contraseñas no coinciden.");return;}
      }
      setLoading(true);
      try{
        if(modo==="registro"){
          const redirectTo=window.location.origin+window.location.pathname;
          const {data,error:err}=await sb.auth.signUp({email:email.trim(),password,options:{data:{nombre:nombre.trim()},emailRedirectTo:redirectTo}});
          if(err){setError(err.message);setLoading(false);return;}
          if(!data.session){
            setCheckEmail(true);setLoading(false);return;
          }
          onAuthed();
        } else {
          const {error:err}=await sb.auth.signInWithPassword({email:email.trim(),password});
          if(err){setError(err.message==="Invalid login credentials"?"Email o contraseña incorrectos.":err.message);setLoading(false);return;}
          onAuthed();
        }
      }catch(e){setError(e.message||"Error inesperado.");setLoading(false);}
    };

    }

    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:colors.bg}}>

    const COMPRA_ACTIVA_KEY="canasta_compra_activa";
    const [compraActiva,setCompraActivaRaw]=useState(()=>{try{return localStorage.getItem(COMPRA_ACTIVA_KEY)==="1";}catch(e){return false;}});
    const setCompraActiva=(v)=>{setCompraActivaRaw(v);try{v?localStorage.setItem(COMPRA_ACTIVA_KEY,"1"):localStorage.removeItem(COMPRA_ACTIVA_KEY);}catch(e){}};
    const [showItemSuelto,setShowItemSuelto]=useState(false);
    const [showNuevoProdModal,setShowNuevoProdModal]=useState(false);

    const toggleDarkMode=()=>{const newMode=!isDarkMode;setIsDarkMode(newMode);try{localStorage.setItem("canasta_dark_mode",String(newMode));}catch(e){}};
    const colors=getColors(isDarkMode);

    // Guardar ticket en localStorage cada vez que cambia
    useEffect(()=>{
      try{
        if(ticket.length>0) localStorage.setItem(TICKET_KEY,JSON.stringify(ticket));
        else localStorage.removeItem(TICKET_KEY);
      }catch(e){}
    },[ticket]);

    // Guardar promo en localStorage cada vez que cambia
    useEffect(()=>{
      try{
        if(promo) localStorage.setItem(PROMO_KEY,JSON.stringify(promo));
        else localStorage.removeItem(PROMO_KEY);
      }catch(e){}
    },[promo]);

    // Aplicar CSS variables dinámicamente
    useEffect(()=>{
      const root=document.documentElement;
      Object.entries(colors).forEach(([key,value])=>{
        root.style.setProperty(`--${key}`,value);
      });
      document.querySelector('meta[name="theme-color"]')?.setAttribute("content",colors.bg);
    },[colors]);

    const current=stack[stack.length-1];
    const push=(screen,params={})=>setStack(s=>[...s,{screen,...params}]);
    const pop=()=>setStack(s=>s.length>1?s.slice(0,-1):s);

    // Si se elimina una categoría que está referenciada en el stack de navegación
    // (por ejemplo, la categoría en la que estabas parado), cortamos el stack
    // antes de esa pantalla para evitar quedar en una pantalla en blanco/negra.
    useEffect(()=>{
      setStack(s=>{
        const idx=s.findIndex(f=>f.catId&&f.catId!==TODOS_ID&&!cats.some(c=>c.id===f.catId));
        if(idx===-1)return s;
        return idx===0?[{screen:"home"}]:s.slice(0,idx);
      });
    },[cats]);

    // Busca el grupo del usuario o le crea uno personal si es la primera vez
    const ensureMiGrupo=async()=>{
      const {data:gm,error:errGm}=await sb.from("grupo_miembros").select("grupo_id,rol").eq("user_id",userId).maybeSingle();
      if(errGm){console.error("Error leyendo membresía de grupo:",errGm);return null;}
      if(gm) return gm.grupo_id;
      const nuevoId=crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+Math.random());
      const {error:errG}=await sb.from("grupos").insert({id:nuevoId,nombre:"Mi grupo",creado_por:userId});
      if(errG){console.error("Error creando grupo:",errG);return null;}
      const {error:errGm2}=await sb.from("grupo_miembros").insert({grupo_id:nuevoId,user_id:userId,rol:"admin",email:session.user.email});
      if(errGm2){console.error("Error asignando membresía:",errGm2);return null;}
      return nuevoId;
    };

    const cargarInfoGrupo=async(gId)=>{
      try{
        const {data:g,error:errG}=await sb.from("grupos").select("*").eq("id",gId).maybeSingle();
        if(errG) console.error("Error cargando grupo:",errG);
        const {data:miembros,error:errM}=await sb.from("grupo_miembros").select("user_id,rol,email").eq("grupo_id",gId).order("created_at");
        if(errM) console.error("Error cargando miembros:",errM);
        const miGm=(miembros||[]).find(m=>m.user_id===userId);
        setGrupoInfo({id:gId,nombre:g?.nombre||"Mi grupo",codigo_invitacion:g?.codigo_invitacion,rol:miGm?.rol||"admin",miembros:miembros||[]});
      }catch(e){
        console.error("Error inesperado cargando grupo:",e);
        setGrupoInfo({id:gId,nombre:"Mi grupo",codigo_invitacion:null,rol:"admin",miembros:[],error:true});
      }
    };

    useEffect(()=>{
      (async()=>{
        try {
          const [gId, { data: catRows }, { data: prodRows }] = await Promise.all([
            ensureMiGrupo(),
            sb.from("categorias").select("*"),
            sb.from("productos").select("*")
          ]);
          setGrupoId(gId);
          if(gId) cargarInfoGrupo(gId);
          if (catRows && catRows.length) {
            const lc = catRows.map(r=>({id:r.id,label:r.label,emoji:r.emoji,color:r.color,subs:r.subs||[]}));
            const validSubs = new Set(lc.flatMap(c=>c.subs.map(s=>s.id)));
            const lp = (prodRows||[]).map(r=>{
              let cr=r.cantidad_ref;
              let rollosRef=r.rollos_ref||null, metrosRef=r.metros_ref||null;
              // Migración: si no tiene rollos_ref pero tiene cantidad_ref_display, extraer
              if(r.unidad==="m"&&!rollosRef&&r.cantidad_ref_display&&/^\d+x\d+/.test(r.cantidad_ref_display)){
                const parts=r.cantidad_ref_display.split("x");
                rollosRef=parseFloat(parts[0])||null;
                metrosRef=parseFloat(parts[1])||null;
              }
              if(cr!=null&&typeof cr==="string"){cr=parseQty(cr);}
              return {
                id:r.id, nombre:r.nombre, marca:r.marca||"", catId:r.cat_id, subId:r.sub_id&&validSubs.has(r.sub_id)?r.sub_id:null,
                precioRef:r.precio_ref, precioRefMes:r.precio_ref_mes||null, unidadesMes:r.unidades_mes,
                cantidadRef:cr, rollosRef, metrosRef, unidad:r.unidad||"gr",
                historialCompra:r.historial_compra||[]
              };
            });
            setCats(lc); setProductos(lp);
            // Cargar stock
            const { data: stockRows } = await sb.from("stock").select("*");
            if (stockRows) {
              const sm = {};
              stockRows.forEach(r=>{ sm[r.producto_id]=r.entradas||[]; });
              setStock(sm);
            }
            // Cargar listas (tabla puede no existir aún)
            try {
              const { data: lRows, error: lErr } = await sb.from("listas").select("*").order("creada",{ascending:true});
              if (lErr) console.warn("Tabla listas no disponible:", lErr.message);
              else if (lRows) setListas(lRows.map(r=>({id:r.id,nombre:r.nombre,fija:!!r.fija,items:r.items||[],creada:r.creada})));
            } catch(e){ console.warn("Tabla listas no disponible:", e); }
            // Cargar inflación (tabla puede no existir aún)
            try {
              const { data: infRows, error: infErr } = await sb.from("inflacion").select("mes,pct");
              if (infErr) console.warn("Tabla inflacion no disponible:", infErr.message);
              else if (infRows) setInflacion(Object.fromEntries(infRows.map(r=>[r.mes,Number(r.pct)])));
            } catch(e){ console.warn("Tabla inflacion no disponible:", e); }
            // Cargar tickets (tabla puede no existir aún)
            try {
              const { data: ticketRows } = await sb.from("tickets").select("*").order("fecha",{ascending:false}).limit(15);
              if (ticketRows) setTickets(ticketRows);
            } catch(e){ console.warn("Tabla tickets no disponible:", e); }
          } else {
            // Primera vez con este grupo: arranca completamente vacío, sin categorías por defecto
            setCats([]); setProductos([]);
          }
        } catch(e) { console.error(e); setProductos(DEFAULT_PRODUCTOS); }
        setLoaded(true);
      })();
    },[]);

    // Convierte un producto de pantalla (con Ref vigente) al formato guardado (Ref base + mes).
    // Si el Ref vigente cambió respecto del calculado, el usuario lo editó: pasa a ser la nueva base desde este mes.
    const normalizarRef=(p)=>{
      if(!("precioRefBase" in p)) return {...p,precioRefMes:p.precioRefMes||mesActual()};
      const {precioRefBase,...rest}=p;
      const vigente=refConInflacion(precioRefBase,p.precioRefMes,inflacion);
      let base=precioRefBase, mes=p.precioRefMes||mesActual();
      if(p.precioRef==null||p.precioRef===""){base=null;mes=mesActual();}
      else if(vigente==null||Math.abs(Number(p.precioRef)-vigente)>0.005){base=Number(p.precioRef);mes=mesActual();}
      return {...rest,precioRef:base,precioRefMes:mes};
    };
    const guardar=async(nextCats,nextProds,opts={})=>{
      const nc=nextCats??cats; const np=nextProds?nextProds.map(normalizarRef):productos;
      setCats(nc); setProductos(np);
      try {
        if (nextCats) {
          const catRes=await sb.from("categorias").upsert(
            nc.map(c=>({id:c.id,label:c.label,emoji:c.emoji,color:c.color,subs:c.subs,grupo_id:grupoId}))
          );
          if(catRes.error) { console.error("Error guardando cats:",catRes.error); showToast("Error guardando categorías","err"); return; }
          const ncIds = nc.map(c=>c.id);
          const oldIds = cats.map(c=>c.id).filter(id=>!ncIds.includes(id));
          if (oldIds.length) await sb.from("categorias").delete().in("id", oldIds);
        }
        if (nextProds) {
          console.log("Guardando",np.length,"productos en Supabase...");
          // Supabase tiene límite de ~1000 filas por upsert — dividir en chunks
          const CHUNK=100;
          for(let i=0;i<np.length;i+=CHUNK){
            const chunk=np.slice(i,i+CHUNK);
            const res=await sb.from("productos").upsert(
              chunk.map(p=>{
                let cr=p.cantidadRef;
                if(cr!=null&&typeof cr==="string"){
                  cr=parseQty(cr);
                }
                return {id:p.id,nombre:p.nombre,marca:p.marca||"",cat_id:p.catId,sub_id:p.subId||null,
                  precio_ref:p.precioRef,precio_ref_mes:p.precioRefMes||null,unidades_mes:p.unidadesMes,cantidad_ref:cr||null,rollos_ref:p.rollosRef||null,metros_ref:p.metrosRef||null,
                  unidad:p.unidad||"gr",historial_compra:p.historialCompra||[],grupo_id:grupoId};
              })
            );
            if(res.error){ console.error(`Error en chunk ${i}-${i+CHUNK}:`,res.error); showToast("Error guardando productos","err"); return; }
          }
          console.log("Guardado exitoso:",np.length,"productos");
          if (opts.deleteRemoved) {
            const npIds = np.map(p=>p.id);
            const oldPIds = productos.map(p=>p.id).filter(id=>!npIds.includes(id));
            if (oldPIds.length) await sb.from("productos").delete().in("id", oldPIds);
          }
        }
      } catch(e) { console.error("Supabase error:", e); showToast("Error al guardar: "+e.message,"err"); }
    };

    // Los avisos de error duran más para poder leer el motivo
    // Productos tal como se muestran: precioRef = Ref vigente (con inflación); precioRefBase = el guardado
    const productosUI=useMemo(()=>productos.map(p=>({...p,precioRefBase:p.precioRef,precioRef:refConInflacion(p.precioRef,p.precioRefMes,inflacion)})),[productos,inflacion]);
    // Ref que tenía un producto en un mes dado (para el gráfico). null si ese mes es anterior a su base.
    const refEnMes=(p,mes)=>{
      const base=p.precioRefBase!==undefined?p.precioRefBase:p.precioRef;
      const mb=p.precioRefMes||mesActual();
      if(base==null||!mes||mes<mb)return null;
      return refConInflacion(base,mb,inflacion,mes);
    };
    const guardarInflacion=async(mes,pct)=>{
      const prev=inflacion;
      setInflacion(i=>({...i,[mes]:pct}));
      const r=await sb.from("inflacion").upsert({grupo_id:grupoId,mes,pct},{onConflict:"grupo_id,mes"});
      if(r.error){setInflacion(prev);console.error(r.error);showToast("No se pudo guardar la inflación ("+(r.error.message||"")+")","err");throw r.error;}
    };
    const guardarInflacionVarios=async(valores)=>{ // {mes:pct}
      const prev=inflacion;
      setInflacion(i=>({...i,...valores}));
      const r=await sb.from("inflacion").upsert(Object.entries(valores).map(([mes,pct])=>({grupo_id:grupoId,mes,pct})),{onConflict:"grupo_id,mes"});
      if(r.error){setInflacion(prev);console.error(r.error);showToast("No se pudo guardar la inflación ("+(r.error.message||"")+")","err");throw r.error;}
    };
    const borrarInflacion=async(mes)=>{
      const prev=inflacion;
      setInflacion(i=>{const n={...i};delete n[mes];return n;});
      const r=await sb.from("inflacion").delete().eq("grupo_id",grupoId).eq("mes",mes);
      if(r.error){setInflacion(prev);console.error(r.error);showToast("No se pudo borrar ("+(r.error.message||"")+")","err");throw r.error;}
    };
    // ── Listas: guardar / borrar / refrescar ──
    const guardarLista=async(l)=>{
      ultimaEscrituraListas.current=Date.now();
      setListas(ls=>ls.some(x=>x.id===l.id)?ls.map(x=>x.id===l.id?l:x):[...ls,l]);
      const r=await sb.from("listas").upsert({id:l.id,nombre:l.nombre,fija:!!l.fija,items:l.items||[],grupo_id:grupoId,creada:l.creada||new Date().toISOString(),actualizada:new Date().toISOString()},{onConflict:"id"});
      ultimaEscrituraListas.current=Date.now();
      if(r.error){console.error(r.error);showToast("No se pudo guardar la lista ("+(r.error.message||"")+")","err");}
    };
    const crearLista=async(nombre,prods=[])=>{
      const items=prods.map(p=>({id:uid(),prodId:p.id,texto:null,cant:cantSugerida(p),estado:"pendiente"}));
      const l={id:uid(),nombre:(nombre||"").trim()||"Lista",fija:false,items,creada:new Date().toISOString()};
      await guardarLista(l);return l;
    };
    const borrarLista=async(id)=>{
      ultimaEscrituraListas.current=Date.now();
      setListas(ls=>ls.filter(x=>x.id!==id));
      if(compraListaId===id)setCompraListaId(null);
      const r=await sb.from("listas").delete().eq("id",id);
      if(r.error){console.error(r.error);showToast("No se pudo borrar la lista ("+(r.error.message||"")+")","err");}
    };
    const refrescarListas=async()=>{
      if(Date.now()-ultimaEscrituraListas.current<4000)return; // no pisar cambios propios en vuelo
      const {data,error}=await sb.from("listas").select("*").order("creada",{ascending:true});
      if(error||!data)return;
      if(Date.now()-ultimaEscrituraListas.current<4000)return;
      setListas(data.map(r=>({id:r.id,nombre:r.nombre,fija:!!r.fija,items:r.items||[],creada:r.creada})));
    };
    // Agrega productos a una lista (si ya están, no los duplica)
    const agregarALista=async(listaId,prods)=>{
      const l=listas.find(x=>x.id===listaId); if(!l)return 0;
      const ids=new Set(prods.map(p=>p.id));
      let reactivados=0;
      const items=l.items.map(it=>{if(it.prodId&&ids.has(it.prodId)&&it.estado==="comprado"){reactivados++;return {...it,estado:"pendiente"};}return it;});
      const nuevos=prods.filter(p=>!l.items.some(it=>it.prodId===p.id)).map(p=>({id:uid(),prodId:p.id,texto:null,cant:cantSugerida(p),estado:"pendiente"}));
      if(nuevos.length||reactivados)await guardarLista({...l,items:[...items,...nuevos]});
      return nuevos.length+reactivados;
    };
    // Cantidad sugerida: lo que falta para cubrir un mes de consumo (mínimo 1)
    const cantSugerida=(p)=>{
      if(!p.unidadesMes)return 1;
      return Math.max(1,Math.ceil(p.unidadesMes-stockTotal(p)-1e-9));
    };
    // Al terminar la compra: lo comprado queda como "ya comprado" (tachado al fondo); lo demás vuelve a pendiente
    const cerrarListaDeCompra=(listaId,itemsTicket)=>{
      const l=listas.find(x=>x.id===listaId); if(!l)return;
      const enTicket=new Set(itemsTicket.map(i=>i.prodId));
      const comprado=it=>it.estado==="tilde"||(it.prodId&&enTicket.has(it.prodId));
      const items=l.items.map(it=>({...it,estado:it.estado==="comprado"||comprado(it)?"comprado":"pendiente"}));
      guardarLista({...l,items});
    };

    // Iniciar compra: pasa a la vista de compras (precios). Con lista, se queda/abre la lista.
    // Sin lista: se compra desde el catálogo (pestaña Precios). Con lista: se compra dentro de la lista (pestaña Compras).
    const iniciarCompra=(listaId)=>{
      setCompraActiva(true);
      setCompraListaId(listaId||null);
      setModoCompras(true);
      if(!listaId){comprasStackRef.current=null;setActiveTab("productos");setStack([{screen:"home"}]);return;}
      setActiveTab("compras");
      if(!(current.screen==="lista-detalle"&&current.listaId===listaId)) push("lista-detalle",{listaId});
    };
    const continuarCompra=()=>{
      setModoCompras(true);
      if(compraListaId){setActiveTab("compras");push("lista-detalle",{listaId:compraListaId});}
      else{comprasStackRef.current=null;setActiveTab("productos");setStack([{screen:"home"}]);}
    };
    // Volver de la lista en compra: se pausa (sigue en curso) y se vuelve a la pestaña Compras
    const pausarCompra=()=>{setModoCompras(false);setTicketOpen(false);};

    // Empezar: todos los precios actuales pasan a ser la base de este mes; desde el mes siguiente acumulan inflación
    const empezarInflacion=async()=>{
      const hoy=mesActual();
      await guardar(null,productos.map(p=>({...p,precioRefMes:hoy})));
      const [y,m]=hoy.split("-");
      await guardarInflacion(INICIO_KEY,Number(y+m));
    };
    // Dejar: los Ref quedan fijos en su último valor y se borran los meses cargados
    const dejarInflacion=async()=>{
      const hoy=mesActual();
      await guardar(null,productos.map(p=>({...p,precioRef:refConInflacion(p.precioRef,p.precioRefMes,inflacion),precioRefMes:hoy})));
      const r=await sb.from("inflacion").delete().eq("grupo_id",grupoId);
      if(r.error){console.error(r.error);showToast("No se pudo borrar la inflación ("+(r.error.message||"")+")","err");return;}
      setInflacion({});
    };

    const showToast=(msg,tipo="ok")=>{setToast({msg,tipo});setTimeout(()=>setToast(null),tipo==="err"?(msg.length>60?9000:5000):2400);};
    const askConfirm=(msg,onOk,okLabel="Confirmar",okColor="#3b82f6")=>setConfirm({msg,onOk,okLabel,okColor});
    const getCat=(id)=>cats.find(c=>c.id===id);
    const getSub=(catId,subId)=>getCat(catId)?.subs?.find(s=>s.id===subId);
    const gastoMensual=(p)=>(p.precioRef&&p.unidadesMes)?p.precioRef*p.unidadesMes:null;

    const guardarStock=async(prodId,nuevasEntradas)=>{
      setStock(s=>({...s,[prodId]:nuevasEntradas}));
      try {
        await sb.from("stock").upsert({producto_id:prodId,entradas:nuevasEntradas,actualizado:new Date().toISOString(),grupo_id:grupoId},{onConflict:"producto_id"});
      } catch(e){console.error("Stock save error:",e);}
    };

    // Unirse a un grupo por código de invitación (llega por link #join/CODIGO)
    useEffect(()=>{
      if(!grupoId||!pendingInvite) return;
      (async()=>{
        const {data:targetRows}=await sb.rpc("buscar_grupo_por_codigo",{codigo:pendingInvite});
        const target=targetRows&&targetRows[0]?targetRows[0]:null;
        if(onInviteHandled) onInviteHandled();
        if(!target){showToast("El link de invitación no es válido","err");return;}
        if(target.id===grupoId){showToast("Ya formás parte de este grupo");return;}
        askConfirm(
          `¿Salir de "${grupoInfo?.nombre||"tu grupo"}" y unirte a "${target.nombre}"? Vas a empezar a compartir la base de datos de ese grupo.`,
          async()=>{
            await sb.from("grupo_miembros").delete().eq("user_id",userId);
            await sb.from("grupo_miembros").insert({grupo_id:target.id,user_id:userId,rol:"miembro",email:session.user.email});
            showToast("Te uniste a "+target.nombre);
            setTimeout(()=>window.location.reload(),700);
          },"Unirme","#3b82f6"
        );
      })();
    },[grupoId,pendingInvite]);

    // ── Edición y borrado de categorías / subcategorías ──
    const borrarProductosDB=async(ids)=>{
      for(let i=0;i<ids.length;i+=100){
        const chunk=ids.slice(i,i+100);
        const rs=await sb.from("stock").delete().in("producto_id",chunk); if(rs.error) throw rs.error;
        const rp=await sb.from("productos").delete().in("id",chunk); if(rp.error) throw rp.error;
      }
    };
    const quitarProductosLocal=(ids)=>{
      const set=new Set(ids);
      setProductos(ps=>ps.filter(p=>!set.has(p.id)));
      setStock(st=>{const n={...st};ids.forEach(i=>{delete n[i];});return n;});
      setTicket(t=>t.filter(i=>!set.has(i.prodId)));
    };
    const upsertCategoria=async(c)=>{
      const r=await sb.from("categorias").upsert({id:c.id,label:c.label,emoji:c.emoji,color:c.color,subs:c.subs,grupo_id:grupoId});
      if(r.error) throw r.error;
    };
    // cambios: {emoji,label,color,subs?} · moves: [{subId,destId}] subcategorías que pasan a otra categoría (con sus productos)
    const editarCategoria=async(catId,{moves=[],...cambios})=>{
      const c=cats.find(x=>x.id===catId); if(!c) return;
      const subsEditadas=cambios.subs||c.subs;
      const movidas=new Set(moves.map(m=>m.subId));
      const nc={...c,...cambios,subs:subsEditadas.filter(x=>!movidas.has(x.id))};
      if(!moves.length){
        try{await upsertCategoria(nc);setCats(cs=>cs.map(x=>x.id===catId?nc:x));}
        catch(e){console.error(e);showToast("Error al guardar la categoría","err");throw e;}
        return;
      }
      let nextCats=cats.map(x=>x.id===catId?nc:x);
      moves.forEach(m=>{
        const sub=subsEditadas.find(x=>x.id===m.subId); if(!sub) return;
        nextCats=nextCats.map(x=>x.id===m.destId?{...x,subs:[...x.subs.filter(y=>y.id!==sub.id),sub]}:x);
      });
      const destDe=Object.fromEntries(moves.map(m=>[m.subId,m.destId]));
      const nextProds=productos.map(p=>p.catId===catId&&destDe[p.subId]?{...p,catId:destDe[p.subId]}:p);
      await guardar(nextCats,nextProds);
    };
    const editarSubcategoria=async(catId,subId,label)=>{
      const c=cats.find(x=>x.id===catId); if(!c) return;
      const nc={...c,subs:c.subs.map(sb2=>sb2.id===subId?{...sb2,label}:sb2)};
      try{await upsertCategoria(nc);setCats(cs=>cs.map(x=>x.id===catId?nc:x));}
      catch(e){console.error(e);showToast("Error al guardar la subcategoría","err");throw e;}
    };
    const eliminarCategoria=async(catId)=>{
      const ids=productos.filter(p=>p.catId===catId).map(p=>p.id);
      await borrarProductosDB(ids);
      const r=await sb.from("categorias").delete().eq("id",catId); if(r.error) throw r.error;
      quitarProductosLocal(ids);
      setCats(cs=>cs.filter(c=>c.id!==catId));
    };
    const eliminarSubcategoria=async(catId,subId)=>{
      const c=cats.find(x=>x.id===catId); if(!c) return;
      const ids=productos.filter(p=>p.catId===catId&&p.subId===subId).map(p=>p.id);
      await borrarProductosDB(ids);
      const nc={...c,subs:c.subs.filter(x=>x.id!==subId)};
      await upsertCategoria(nc);
      quitarProductosLocal(ids);
      setCats(cs=>cs.map(x=>x.id===catId?nc:x));
    };

    // Borra todos los datos del grupo actual (categorías, productos, stock e historial de compras)
    const borrarBaseDatos=async()=>{
      if(!grupoId) throw new Error("No se encontró el grupo");
      const prodIds=productos.map(p=>p.id);
      const rs=await sb.from("stock").delete().eq("grupo_id",grupoId);
      if(rs.error) throw rs.error;
      // Barrido extra por si quedaron filas de stock viejas sin grupo_id
      for(let i=0;i<prodIds.length;i+=100){
        const r=await sb.from("stock").delete().in("producto_id",prodIds.slice(i,i+100));
        if(r.error) throw r.error;
      }
      const rl=await sb.from("listas").delete().eq("grupo_id",grupoId);
      if(rl.error) console.warn("Listas:",rl.error);
      const ri=await sb.from("inflacion").delete().eq("grupo_id",grupoId);
      if(ri.error) console.warn("Inflación:",ri.error);
      const rt=await sb.from("tickets").delete().eq("grupo_id",grupoId);
      if(rt.error) console.warn("Tickets:",rt.error);
      const rp=await sb.from("productos").delete().eq("grupo_id",grupoId);
      if(rp.error) throw rp.error;
      const rc=await sb.from("categorias").delete().eq("grupo_id",grupoId);
      if(rc.error) throw rc.error;
      setStock({});setTickets([]);setProductos([]);setCats([]);setInflacion({});setListas([]);setCompraListaId(null);
      setTicket([]);setPromo(null);setModoCompras(false);setTicketOpen(false);
      try{localStorage.removeItem(TICKET_KEY);localStorage.removeItem(PROMO_KEY);}catch(e){}
    };

    const salirDelGrupo=()=>{
      askConfirm(
        "¿Salir del grupo? Vas a pasar a tener tu propia base de datos individual, con una copia de los productos y categorías actuales. Los demás miembros del grupo no se ven afectados.",
        async()=>{
          try{
            const nuevoId=crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+Math.random());
            const {error:errG}=await sb.from("grupos").insert({id:nuevoId,nombre:"Mi grupo",creado_por:userId});
            if(errG) throw errG;
            // Copiar categorías y productos actuales al nuevo grupo personal
            if(cats.length) await sb.from("categorias").insert(cats.map(c=>({id:crypto.randomUUID?crypto.randomUUID():(c.id+"_"+Date.now()),label:c.label,emoji:c.emoji,color:c.color,subs:c.subs,grupo_id:nuevoId})));
            await sb.from("grupo_miembros").delete().eq("user_id",userId);
            await sb.from("grupo_miembros").insert({grupo_id:nuevoId,user_id:userId,rol:"admin",email:session.user.email});
            showToast("Saliste del grupo");
            setTimeout(()=>window.location.reload(),700);
          }catch(e){console.error(e);showToast("Error al salir del grupo","err");}
        },"Salir del grupo","#ef4444"
      );
    };

    const expulsarMiembro=(memberUserId)=>{

        }catch(e){console.error(e);showToast("Error al expulsar","err");}
      },"Expulsar","#ef4444");
    };

    const regenerarCodigo=async()=>{

      showToast("Nuevo link generado");

    const renombrarGrupo=async(nuevoNombre)=>{

    const cerrarSesion=async()=>{
      await sb.auth.signOut();
      window.location.reload();
    };

    // Calcula total en unidades de referencia del producto
    const stockTotal=(p)=>{
      try {
        const entradas=stock[p.id]||[];
        const cantRefNum=typeof p.cantidadRef==="string"?parseQty(p.cantidadRef):(p.cantidadRef||0);
        if(!cantRefNum||cantRefNum===0) return entradas.reduce((s,e)=>s+(e.stock||0),0);
        return entradas.reduce((s,e)=>{
          const eCantRef=typeof e.cantRef==="string"?parseQty(String(e.cantRef)):(e.cantRef||cantRefNum);
          return s+((e.stock||0)*((eCantRef||cantRefNum)/cantRefNum));
        },0);
      } catch(err){ return 0; }
    };

    const mesesRestantes=(p)=>{
      const total=stockTotal(p);
      if(!p.unidadesMes||p.unidadesMes===0)return null;
      return total/p.unidadesMes;
    };
    const fmtMeses=(m,corto=false)=>{
      if(m===null)return "Sin consumo definido";
      if(m===0)return "Sin stock";
      if(m<1)return "menos de 1 mes";
      const r=Math.round(m*10)/10;
      const mesesStr=r===1?"1 mes":`${r} meses`;
      return corto?mesesStr:`Queda para ${mesesStr}`;
    };
    const handleExport=async(catId=null,subId=null)=>{
      const text=buildExportText(cats,productos,catId,subId);
      if(!text)return showToast("No hay productos para exportar","err");
      const ok=await copyToClipboard(text);
      showToast(ok?"📋 Copiado al portapapeles":"No se pudo copiar");
    };

    const agregarAlTicket=(item)=>{
      setTicket(t=>{
        const idx=t.findIndex(x=>x.prodId===item.prodId);
        if(idx>=0){const n=[...t];n[idx]=item;return n;}
        return [...t,item];
      });
      // No abrir el drawer automáticamente — el usuario lo abre cuando quiere
    };

    const agregarItemSuelto=({nombre,precio,cantidad=1})=>{
      setTicket(t=>[...t,{
        prodId:"suelto-"+uid(),nombre,marca:"",cantRef:null,unidad:"",
        precio,equivalente:null,precioRef:null,fecha:todayISO(),
        cantComprada:cantidad,totalPagado:precio*cantidad,totalRef:null,
        suelto:true
      }]);
      setShowItemSuelto(false);
      showToast("✅ Item agregado al ticket");
    };

    // ── Guardado de la compra finalizada, en pasos y reanudable ──
    const PENDING_KEY="canasta_compra_pendiente";
    const guardarPendiente=(p)=>{try{localStorage.setItem(PENDING_KEY,JSON.stringify(p));}catch(e){}};
    const leerPendiente=()=>{try{const v=localStorage.getItem(PENDING_KEY);return v?JSON.parse(v):null;}catch(e){return null;}};
    const procesarPendiente=async(pend,prodsBase,stockBase,reintento=false)=>{
      const t=pend.ticket; const pasos={...pend.pasos};
      const marcar=(k)=>{pasos[k]=true;guardarPendiente({...pend,pasos});};
      let fallo=false; let errorTicket="";
      // 1) El ticket (lo que se ve en el historial)
      if(!pasos.ticket){
        // onConflict explícito por id: si la tabla tuviera otra clave única (ej. grupo_id),
        // falla con error en vez de sobrescribir otra compra en silencio
        const r=await sb.from("tickets").upsert({id:t.id,fecha:t.fecha,items:t.items,promo:t.promo,grupo_id:grupoId},{onConflict:"id"});
        if(r.error){console.error("Error guardando ticket:",r.error);fallo=true;errorTicket=r.error.message||r.error.code||"";}
        else{
          marcar("ticket");
          if(pend.aEliminar?.length){const d=await sb.from("tickets").delete().in("id",pend.aEliminar);if(d.error)console.warn("Tickets viejos:",d.error);}
        }
      }
      // 2) Historial de precios: solo los productos de esta compra (sin duplicar entradas)
      if(!pasos.productos){
        const entradas={};
        t.items.forEach(it=>{if(it.entrada)(entradas[it.prodId]=entradas[it.prodId]||[]).push(it.entrada);});
        const cambiados=[];
        const prodsNuevos=prodsBase.map(p=>{
          const add=(entradas[p.id]||[]).filter(e=>!(p.historialCompra||[]).some(h=>h.id===e.id));
          if(!add.length)return p;
          const np={...p,historialCompra:[...(p.historialCompra||[]),...add].sort((a,b)=>a.fecha.localeCompare(b.fecha))};
          cambiados.push(np);return np;
        });
        if(cambiados.length){
          const set=new Set(cambiados.map(p=>p.id));
          setProductos(ps=>ps.map(p=>set.has(p.id)?cambiados.find(c=>c.id===p.id):p));
          const r=await sb.from("productos").upsert(cambiados.map(p=>({id:p.id,nombre:p.nombre,marca:p.marca||"",cat_id:p.catId,sub_id:p.subId||null,
            precio_ref:p.precioRef,precio_ref_mes:p.precioRefMes||null,unidades_mes:p.unidadesMes,cantidad_ref:(typeof p.cantidadRef==="string"?parseQty(p.cantidadRef):p.cantidadRef)||null,
            rollos_ref:p.rollosRef||null,metros_ref:p.metrosRef||null,unidad:p.unidad||"gr",historial_compra:p.historialCompra||[],grupo_id:grupoId})));
          if(r.error){console.error("Error guardando historial de precios:",r.error);fallo=true;}
          else marcar("productos");
        } else marcar("productos");
      }
      // 3) Stock (al reintentar no se repite para no sumar dos veces)
      if(!pasos.stock&&!reintento){
        const acum={...stockBase};
        for(const item of t.items){
          if(!item.stockDelta||item.stockDelta.cantidad<=0) continue;
          const {cantRef,cantRefProd,cantidad,display}=item.stockDelta;
          const actuales=acum[item.prodId]||item.stockDelta.entradasBase||[];
          const base=actuales.length===0&&cantRefProd
            ?[{cantRef:cantRefProd,unidad:item.unidad||"gr",stock:0,display:display||null}]
            :[...actuales];
          const idx=base.findIndex(e=>e.cantRef===cantRef);
          const nuevas=idx>=0?base.map((e,i)=>i===idx?{...e,stock:e.stock+cantidad}:e):[...base,{cantRef,unidad:item.unidad||"gr",stock:cantidad,display:null}];
          acum[item.prodId]=nuevas;
          await guardarStock(item.prodId,nuevas);
        }
        marcar("stock");
      }
      if(fallo){
        showToast(errorTicket?`⚠️ No se pudo guardar la compra en el historial (${errorTicket}). Se reintenta al abrir la app.`:"⚠️ La compra no se pudo guardar del todo. Se reintenta al volver a abrir la app.","err");
      } else {
        try{localStorage.removeItem(PENDING_KEY);}catch(e){}
        if(reintento) showToast("✅ Se terminó de guardar una compra pendiente");
      }
    };
    // Al abrir la app: completar una compra que quedó a medio guardar
    useEffect(()=>{
      if(!loaded||!grupoId) return;
      const pend=leerPendiente(); if(!pend||!pend.ticket) return;
      setTickets(ts=>ts.some(x=>x.id===pend.ticket.id)?ts:[pend.ticket,...ts].slice(0,15));
      procesarPendiente({...pend,pasos:{...pend.pasos,stock:true}},productos,stock,true);
    },[loaded,grupoId]);

    const finalizarCompra=async()=>{
      if(ticket.length===0)return;
      askConfirm(`¿Finalizar compra con ${ticket.length} producto${ticket.length>1?"s":""}?`,async()=>{
        const subtotal=ticket.reduce((s,i)=>s+(i.totalPagado??i.precio??0),0);
        const promoCalc=calcPromo(subtotal,promo);
        const promoAplicado=promo&&promoCalc.descuentoAplicado>0;
        // Si hay promo, "horneamos" el descuento en el precio efectivo de cada producto
        // (no solo en el total): así el historial de precios y el gráfico de cada producto
        // reflejan lo que realmente pagaste, comparable con compras de otros supermercados.
        const itemsFinal=promoAplicado
          ?ticket.map(it=>{
              const f=promoCalc.factor;
              const baseTotal=it.totalPagado??it.precio??0;
              const nuevoTotalPagado=Math.round(baseTotal*f*100)/100;
              const nuevoPrecio=it.precio!=null?Math.round(it.precio*f*100)/100:it.precio;
              const nuevoEquivalente=it.equivalente!=null?Math.round(it.equivalente*f*100)/100:it.equivalente;
              const nuevaEntrada=it.entrada?{...it.entrada,precio:Math.round(it.entrada.precio*f*100)/100,equivalente:it.entrada.equivalente!=null?Math.round(it.entrada.equivalente*f*100)/100:it.entrada.equivalente}:it.entrada;
              return{...it,totalPagado:nuevoTotalPagado,precio:nuevoPrecio,equivalente:nuevoEquivalente,entrada:nuevaEntrada};
            })
          :ticket;
        const promoGuardado=promoAplicado?{pct:promo.pct,limitado:promo.limitado,limite:promo.limite,descuentoAplicado:Math.round(promoCalc.descuentoAplicado*100)/100}:null;
        const nuevoTicket={id:uid(),fecha:new Date().toISOString(),items:itemsFinal,promo:promoGuardado};
        const nuevos=[nuevoTicket,...tickets].slice(0,15);
        const aEliminar=tickets.slice(14).map(t=>t.id);
        setTickets(nuevos);
        setTicket([]);
        setPromo(null);
        setTicketOpen(false);
        setModoCompras(false);
        // Guardar la compra como pendiente ANTES de borrar el borrador: si la app se cierra
        // a mitad del guardado, se completa la próxima vez que se abra.
        const pendiente={ticket:nuevoTicket,aEliminar,pasos:{ticket:false,productos:false,stock:false}};
        guardarPendiente(pendiente);
        try{localStorage.removeItem(TICKET_KEY);}catch(e){}
        try{localStorage.removeItem(PROMO_KEY);}catch(e){}
        setTicketFinalizado(nuevoTicket);
        if(compraListaId){cerrarListaDeCompra(compraListaId,itemsFinal);setCompraListaId(null);}
        setCompraActiva(false);
        procesarPendiente(pendiente,productos,stock);
      },"Finalizar","#10b981");
    };

    const cancelarCompra=()=>{
      if(ticket.length===0){setTicketOpen(false);setModoCompras(false);setPromo(null);setCompraListaId(null);setCompraActiva(false);return;}
      askConfirm("¿Cancelar la compra? Se perderán los items del ticket.",()=>{
        setTicket([]);setPromo(null);setTicketOpen(false);setModoCompras(false);setCompraListaId(null);setCompraActiva(false);
        try{localStorage.removeItem(TICKET_KEY);}catch(e){}
        try{localStorage.removeItem(PROMO_KEY);}catch(e){}
      },"Cancelar compra","#ef4444");
    };

    // Listas compartidas: refrescar cada 8 s mientras se ve una lista, y al volver a la app
    useEffect(()=>{
      if(!loaded)return;
      const enListas=pantallaActual==="listas"||pantallaActual==="lista-detalle";
      const onVis=()=>{if(document.visibilityState==="visible")refrescarListas();};
      document.addEventListener("visibilitychange",onVis);
      const iv=enListas?setInterval(refrescarListas,8000):null;
      if(enListas)refrescarListas();
      return ()=>{document.removeEventListener("visibilitychange",onVis);if(iv)clearInterval(iv);};
    },[loaded,pantallaActual]);

    if(!loaded)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",color:colors.accent,fontFamily:"monospace"}}>Cargando…</div>;

    const s=current.screen;
    const shared={listas,guardarLista,crearLista,borrarLista,agregarALista,cantSugerida,compraListaId,setCompraListaId,compraActiva,iniciarCompra,continuarCompra,pausarCompra,agregarAlTicket,cats,productos:productosUI,inflacion,guardarInflacion,guardarInflacionVarios,borrarInflacion,empezarInflacion,dejarInflacion,refEnMes,guardar,showToast,askConfirm,push,pop,gastoMensual,getCat,getSub,handleExport,stock,guardarStock,stockTotal,mesesRestantes,fmtMeses,modoCompras,ticket,agregarAlTicket,setShowHistorial,setConfirmCompra,colors,isDarkMode,toggleDarkMode,session,grupoInfo,grupoId,cargarInfoGrupo,salirDelGrupo,expulsarMiembro,regenerarCodigo,renombrarGrupo,cerrarSesion,borrarBaseDatos,editarCategoria,editarSubcategoria,eliminarCategoria,eliminarSubcategoria};

    const isMenuScreen=["export","backup","import","config","cuenta","grupo","inflacion","listas","lista-detalle"].includes(s);
    const isFormScreen=["nuevo-prod","editar-prod","nuevo-precio","detalle"].includes(s);

    return (
      <div style={{fontFamily:"'DM Sans','Segoe UI',sans-serif",minHeight:"100vh",background:colors.bg,color:colors.text}}>
        {toast&&<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:3000,background:toast.tipo==="err"?colors.error:colors.success,color:"#fff",padding:"9px 20px",borderRadius:10,fontWeight:600,fontSize:13,boxShadow:`0 8px 32px ${colors.shadowSoft}`,whiteSpace:"nowrap",maxWidth:"90vw",textAlign:"center"}}>{toast.msg}</div>}
        {confirm&&<Confirm colors={colors} msg={confirm.msg} onOk={()=>{confirm.onOk();setConfirm(null);}} onCancel={()=>setConfirm(null)} okLabel={confirm.okLabel} okColor={confirm.okColor}/>}
        {confirmCompra&&<ConfirmCompra colors={colors} data={confirmCompra} onOk={()=>{confirmCompra.onOk();setConfirmCompra(null);}} onCancel={()=>setConfirmCompra(null)}/>}
        <div style={{maxWidth:500,margin:"0 auto",padding:`0 16px ${modoCompras?"180px":"100px"}`}}>
          {s==="home"        &&(activeTab==="compras"?<ComprasHomeScreen {...shared}/>:<HomeScreen {...shared} activeTab={activeTab}/>)}
          {s==="subs"        &&<SubsScreen {...shared} catId={current.catId} activeTab={activeTab}/>}
          {s==="lista"       &&<ListaScreen {...shared} catId={current.catId} subId={current.subId} activeTab={activeTab}/>}
          {s==="detalle"     &&<DetalleScreen {...shared} prodId={current.prodId}/>}
          {s==="nuevo-prod"  &&<NuevoProdScreen {...shared} initCatId={current.catId} initSubId={current.subId} desdeCompras={current.desdeCompras} agregarAlTicket={agregarAlTicket}/>}
          {s==="editar-prod" &&<EditarProdScreen {...shared} prodId={current.prodId}/>}
          {s==="nuevo-precio"&&<NuevoPrecioScreen {...shared} prodId={current.prodId}/>}
          {s==="config"      &&<ConfigScreen {...shared} openCatId={current.openCatId||null}/>}
          {s==="export"      &&<ExportScreen {...shared}/>}
          {s==="backup"      &&<BackupScreen {...shared}/>}
          {s==="inflacion"   &&<InflacionScreen {...shared}/>}
          {s==="listas"      &&<ListasScreen {...shared}/>}
          {s==="lista-detalle"&&<ListaDetalleScreen {...shared} listaId={current.listaId}/>}
          {s==="import"      &&<ImportScreen {...shared}/>}
          {s==="cuenta"      &&<CuentaScreen {...shared}/>}
          {s==="grupo"       &&<GrupoFamiliarScreen {...shared}/>}
        </div>
        {!isFormScreen&&!isMenuScreen&&(activeTab==="productos"||activeTab==="stock")&&!modoCompras&&(
          <FloatingAdd colors={colors} onClick={()=>push("nuevo-prod",{catId:current.catId&&current.catId!==TODOS_ID?current.catId:null,subId:current.subId&&current.subId!==UNASSIGNED_ID?current.subId:null})}/>
        )}
        {modoCompras&&(
          <TicketDrawer colors={colors} ticket={ticket} setTicket={setTicket} productos={productosUI} cats={cats} ticketOpen={ticketOpen} setTicketOpen={setTicketOpen} onFinalizar={finalizarCompra} onCancelar={cancelarCompra} askConfirm={askConfirm} onAddSuelto={()=>setShowItemSuelto(true)} onAddProducto={()=>setShowNuevoProdModal(true)} promo={promo} onEditPromo={()=>setShowPromoModal(true)} stock={stock} stockTotal={stockTotal} mesesRestantes={mesesRestantes} fmtMeses={fmtMeses}/>
        )}
        {showHistorial&&<HistorialTickets colors={colors} tickets={tickets} setTickets={setTickets} onClose={()=>setShowHistorial(false)} askConfirm={askConfirm}/>}
        {ticketFinalizado&&<TicketFinalizadoModal colors={colors} ticket={ticketFinalizado} onClose={()=>setTicketFinalizado(null)}/>}
        {showIniciarCompra&&(
          <Confirm colors={colors} msg="¿Iniciar compra?" onOk={()=>{setModoCompras(true);setShowIniciarCompra(false);}} onCancel={()=>setShowIniciarCompra(false)} okLabel="Iniciar" okColor={colors.success}/>
        )}
        {showItemSuelto&&<ItemSueltoModal colors={colors} onClose={()=>setShowItemSuelto(false)} onSave={agregarItemSuelto}/>}
        {showPromoModal&&<PromoModal colors={colors} promo={promo} subtotal={ticket.reduce((s,i)=>s+(i.totalPagado??i.precio??0),0)} onClose={()=>setShowPromoModal(false)} onSave={(p)=>{setPromo(p);setShowPromoModal(false);}} onQuitar={()=>{setPromo(null);setShowPromoModal(false);}}/>}
        {showNuevoProdModal&&(
          <div style={{position:"fixed",inset:0,background:colors.overlayDark,zIndex:1500,overflowY:"auto",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"20px 0 80px"}} onClick={e=>e.target===e.currentTarget&&setShowNuevoProdModal(false)}>
            <div style={{width:"100%",maxWidth:500,background:colors.inputBg}}>
              <NuevoProdScreen cats={cats} initCatId={current.catId&&current.catId!==TODOS_ID?current.catId:null} initSubId={null} productos={productosUI} guardar={guardar} pop={()=>setShowNuevoProdModal(false)} showToast={showToast} desdeCompras={true} agregarAlTicket={agregarAlTicket} colors={colors}/>
            </div>

  // ── Pulsación larga reutilizable ──────────────────────────────────────────────
  // bind(onLong,onTap) devuelve los handlers para un elemento. Si se dispara la pulsación
  // larga, el click siguiente se ignora. Moverse más de 10px (scroll) la cancela.
  function useLongPress(ms=450){
    const timer=useRef(null); const start=useRef(null); const fired=useRef(false);
    useEffect(()=>()=>clearTimeout(timer.current),[]);
    const end=()=>{clearTimeout(timer.current);start.current=null;};
    return (onLong,onTap)=>({
      onPointerDown:(e)=>{
        fired.current=false;
        if(!onLong)return;
        start.current={x:e.clientX,y:e.clientY};
        clearTimeout(timer.current);
        timer.current=setTimeout(()=>{
          fired.current=true;start.current=null;
          try{if(navigator.vibrate)navigator.vibrate(30);}catch(err){}
          onLong();
        },ms);
      },
      onPointerMove:(e)=>{
        if(!start.current)return;
        if(Math.abs(e.clientX-start.current.x)>10||Math.abs(e.clientY-start.current.y)>10)end();
      },
      onPointerUp:end,onPointerCancel:end,onPointerLeave:end,
      onContextMenu:(e)=>e.preventDefault(),
      onClick:()=>{if(fired.current){fired.current=false;return;}onTap&&onTap();}
    });
  }

          <div style={{fontWeight:600,marginBottom:4,color:colors.text}}>Mover {selected.size} producto{selected.size>1?"s":""}</div>
          <div style={{fontSize:12,color:colors.textMuted,marginBottom:14}}>Elegí el destino</div>
          <select className="inp" value={moveDest} onChange={e=>setMoveDest(e.target.value)} style={{marginBottom:16}}>

            {[...cats].sort((a,b)=>alpha(a,b)).map(c=>[
              <option key={c.id+"::"} value={c.id+"::"} style={{fontWeight:600}}>{c.emoji} {c.label} (sin sub)</option>,
              ...[...c.subs].sort((a,b)=>alpha(a,b)).map(s=><option key={c.id+"::"+s.id} value={c.id+"::"+s.id}>{c.emoji} {c.label} › {s.label}</option>)

            <button className="btn" onClick={doMove} style={{flex:1,background:colors.accent,color:"#fff",padding:12}} disabled={!moveDest}>Mover</button>
          </div>
        </div>
      </div>)}
      {selectMode&&canSelect?(
        <div style={{position:"sticky",top:0,zIndex:120,background:colors.bg,margin:"0 -16px 14px",padding:"28px 16px 12px",borderBottom:`1px solid ${colors.cardBorder}`}}>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <button className="btn" disabled={!selected.size} onClick={doDelete} style={{flex:1,background:colors.errorBg,color:selected.size?colors.error:colors.textMuted,border:`1px solid ${colors.errorBorder}`,padding:"11px 0",fontSize:14,cursor:selected.size?"pointer":"default"}}>🗑️ Eliminar</button>
            <button className="btn" disabled={!selected.size} onClick={()=>selected.size&&setListaModal(true)} style={{flex:1,background:colors.btnSecondary,color:selected.size?colors.text:colors.textMuted,border:`1px solid ${colors.hoverCard}`,padding:"11px 0",fontSize:14,cursor:selected.size?"pointer":"default"}}>📝 Lista</button>
            <button className="btn" disabled={!selected.size} onClick={()=>selected.size&&setMoveModal(true)} style={{flex:1,background:selected.size?colors.accent:colors.btnSecondary,color:selected.size?"#fff":colors.textMuted,padding:"11px 0",fontSize:14,cursor:selected.size?"pointer":"default"}}>📂 Mover</button>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <button className="btn" onClick={toggleAll} style={{background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.accent,padding:"8px 12px",fontSize:13,flexShrink:0,minWidth:76}}>{allSelected?"Ninguno":"Todos"}</button>
            <div style={{flex:1,minWidth:0,textAlign:"center"}}>
              <div style={{fontWeight:700,fontSize:15,color:colors.text}}>{selected.size} seleccionado{selected.size!==1?"s":""}</div>
              <div style={{fontSize:11,color:colors.textMuted,marginTop:2}}>Tocá para marcar o desmarcar</div>
            </div>
            <button className="btn" onClick={cancelSelect} style={{background:colors.card,color:colors.text,border:`1px solid ${colors.cardBorder}`,padding:"8px 12px",fontSize:14,flexShrink:0,minWidth:76}}>✕</button>
          </div>
        </div>
      ):(<>
      <TopBar colors={colors} title={title} subtitle={listSubtitle} onBack={()=>{cancelSelect();pop();}}
        right={!modoCompras&&<HamburgerMenu push={push} setShowHistorial={setShowHistorial} colors={colors} isDarkMode={isDarkMode} toggleDarkMode={toggleDarkMode} session={session}/>}/>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <input type="search" autoComplete="canasta-field-ignore" className="inp" placeholder={q?"🔍 Buscando en toda la canasta…":"🔍 Buscar en toda la canasta…"} value={q} onChange={v=>{setQ(v.target.value);if(v.target.value)cancelSelect();}} style={{flex:1,marginBottom:0,height:44,boxSizing:"border-box"}}/>
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.textSecondary,borderRadius:10,padding:"0 10px",fontSize:13,fontFamily:"inherit",outline:"none",flexShrink:0,height:44,width:90}}>
          <option value="nombre-az">A→Z</option>
          <option value="nombre-za">Z→A</option>
          {(isStock||modoCompras)&&<><option value="meses-asc">Meses ↑</option><option value="meses-desc">Meses ↓</option></>}
          {!isStock&&!modoCompras&&<><option value="precio-asc">Precio ↑</option><option value="precio-desc">Precio ↓</option><option value="gasto-asc">Gasto ↑</option><option value="gasto-desc">Gasto ↓</option></>}
        </select>
      </div>
      {q&&<div style={{fontSize:12,color:colors.textMuted,marginBottom:10}}>{lista.length} resultado{lista.length!==1?"s":""} en toda la canasta</div>}
      </>)}
      {lista.length===0?<div style={{textAlign:"center",color:colors.textMuted,padding:"60px 0",fontSize:14}}>Sin productos aún.</div>
        :<div style={{display:"flex",flexDirection:"column",gap:8}}>
          {lista.map(p=>{
            const pcat=(q||isAll)?cats.find(c=>c.id===p.catId):cat;
            // Stock: pulsación larga para seleccionar (si el panel de ese producto no está abierto)
            if(isStock&&!modoCompras&&!selectMode) return (<div key={"stock-"+p.id} style={{userSelect:"none",WebkitUserSelect:"none",WebkitTouchCallout:"none"}}
              onPointerDown={e=>{if(openStockId!==p.id)pressStart(p.id,e);}} onPointerMove={pressMove} onPointerUp={pressEnd} onPointerCancel={pressEnd} onPointerLeave={pressEnd}
              onContextMenu={e=>{if(openStockId!==p.id)e.preventDefault();}}
              onClickCapture={e=>{if(lpFired.current){lpFired.current=false;e.stopPropagation();e.preventDefault();}}}>
              <StockCard p={p} cat={pcat} stock={stock} stockTotal={stockTotal} mesesRestantes={mesesRestantes} fmtMeses={fmtMeses} guardarStock={guardarStock} askConfirm={askConfirm} onOpen={()=>handleStockOpen(p.id)} onClose={handleStockClose} colors={colors}/>
            </div>);
            if(modoCompras) return <ComprasCardInline key={p.id} p={p} cat={pcat} stock={stock} stockTotal={stockTotal} guardarStock={guardarStock} mesesRestantes={mesesRestantes} fmtMeses={fmtMeses} guardar={guardar} productos={productos} showToast={showToast} agregarAlTicket={agregarAlTicket} colors={colors}/>;
            const isSel=selected.has(p.id);
            return (<div key={p.id} className="card" style={{padding:"13px 16px",display:"flex",alignItems:"center",gap:12,borderLeft:`3px solid ${isSel?colors.accent:pcat?.color||"#444"}`,cursor:"pointer",background:isSel?`${colors.accent}22`:colors.card,transition:"background-color .15s, border-color .15s",userSelect:"none",WebkitUserSelect:"none",WebkitTouchCallout:"none"}}
              onPointerDown={e=>pressStart(p.id,e)} onPointerMove={pressMove} onPointerUp={pressEnd} onPointerCancel={pressEnd} onPointerLeave={pressEnd}

              {isStock?<div style={{textAlign:"right",flexShrink:0}}><div className="mono" style={{fontWeight:700,fontSize:15,color:colors.text}}>{fmtU(Math.round(stockTotal(p)*100)/100)}</div><div style={{fontSize:11,color:colors.textMuted,marginTop:2}}>{fmtMeses(mesesRestantes(p),true)}</div></div>:
              <div style={{textAlign:"right",flexShrink:0}}>{p.precioRef?<><div className="mono" style={{fontWeight:700,fontSize:16,color:colors.text}}>{fmt(p.precioRef)}</div>{gastoMensual(p)&&p.unidadesMes&&<div className="mono" style={{fontSize:11,color:pcat?.color,marginTop:2}}>{fmtU(p.unidadesMes)} u/mes = {fmt(gastoMensual(p))}</div>}</>:<div style={{fontSize:12,color:colors.textMuted}}>Sin precio</div>}</div>}
            </div>);
          })}
        </div>}
    </div>);
