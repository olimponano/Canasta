<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#080c14"/>
  <title>Canasta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#080c14;font-family:'DM Sans','Segoe UI',sans-serif}
    #root{min-height:100vh}
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#1e2535}
    .btn{cursor:pointer;border:none;font-family:inherit;font-weight:600;transition:all .15s;border-radius:10px}
    .btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
    .btn:active{transform:translateY(0);filter:brightness(.95)}
    .card{background:#0d1321;border:1px solid #1a2235;border-radius:14px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field label{font-size:11px;font-weight:600;color:#4a5568;text-transform:uppercase;letter-spacing:.08em}
    .inp{background:#080c14;border:1px solid #1a2235;color:#e8eaf0;border-radius:10px;padding:11px 14px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;width:100%}
    .inp:focus{border-color:#3b82f6}
    .mono{font-family:'DM Mono',monospace}
    .fade{animation:fi .22s ease}
    @keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    .row{cursor:pointer;transition:all .15s}
    .row:hover{transform:translateX(3px);border-color:#2a3550!important}
  </style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#3b82f6;font-family:monospace">Cargando…</div></div>

<!-- 1. React -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- 4. Supabase -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<!-- 5. Babel standalone -->
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
(function() {
  const { useState, useEffect, useRef } = React;
  const LineChart=null, Line=null, XAxis=null, YAxis=null, Tooltip=null, CartesianGrid=null;
const ResponsiveContainer=({children})=>children||null;

  const SUPABASE_URL = "https://czktusbzqrqcdxfmhioc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nJE2_030ourYKjbk_lKlTQ__8l2O0Sg";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const norm = (s) => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
  const matchStr = (a, b) => {
    const na=norm(a), nb=norm(b);
    return na===nb || na.includes(nb) || nb.includes(na);
  };
  const fmt = (n) => n == null ? "—" : `$${Number(n).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  const fmtDate = (d) => new Date(d + "T12:00:00").toLocaleDateString("es-AR", { day: "2-digit", month: "short", year: "2-digit" });
  const todayISO = () => new Date().toISOString().split("T")[0];
  const COLORS = ["#60a5fa","#f472b6","#4ade80","#fb923c","#a78bfa","#facc15","#34d399","#f87171","#38bdf8","#e879f9"];
  const alpha = (a, b, key="label") => (a[key]||"").localeCompare(b[key]||"", "es");
  const alphaStr = (a, b) => (a||"").localeCompare(b||"", "es");
  const fmtU = (u) => {
    if (!u) return "—";
    if (Number.isInteger(u)) return String(u);
    const fracs = [[1/12,"1/12"],[1/6,"1/6"],[1/4,"1/4"],[1/3,"1/3"],[1/2,"1/2"],[2/3,"2/3"],[3/4,"3/4"]];
    for (const [v,s] of fracs) if (Math.abs(u-v)<0.001) return s;
    return Number(u.toFixed(2)).toLocaleString("es-AR");
  };

  // Parse "NxM" format → total numeric value. "4x30"→120, "300"→300
  const parseQty = (s) => {
    if (!s) return null;
    const str = String(s).trim();
    if (str.includes("x")) {
      const [a, b] = str.split("x").map(Number);
      return (isNaN(a)||isNaN(b)) ? null : a * b;
    }
    const n = parseFloat(str.replace(",","."));
    return isNaN(n) ? null : n;
  };

  // Parse fraction input "1/3" → 0.333, "2" → 2
  const parseFrac = (s) => {
    if (!s) return null;
    const str = String(s).trim();
    if (str.includes("/")) {
      const [a,b] = str.split("/").map(Number);
      return (!isNaN(a)&&!isNaN(b)&&b!==0) ? a/b : null;
    }
    const n = parseFloat(str.replace(",","."));
    return isNaN(n) ? null : n;
  };

  const DEFAULT_CATS = [
    { id:"primario",   label:"Primario",   emoji:"🛒", color:"#60a5fa", subs:[] },
    { id:"higiene",    label:"Higiene",    emoji:"🧴", color:"#f472b6", subs:[] },
    { id:"verduleria", label:"Verdulería", emoji:"🥦", color:"#4ade80", subs:[] },
    { id:"carniceria", label:"Carnicería", emoji:"🥩", color:"#fb923c", subs:[] },
    { id:"secundario", label:"Secundario", emoji:"🍪", color:"#a78bfa", subs:[] },
  ];
  const DEFAULT_PRODUCTOS = [];
  const UNASSIGNED_ID = "__sin_sub__";

  function isUnassignedProd(p, cat) {
    if (!cat || !cat.subs.length) return false;
    return !p.subId || !cat.subs.find(s => s.id === p.subId);
  }

  // Backup export — full format compatible with import
  function buildBackupText(cats, productos) {
    const lines = [];
    [...cats].sort((a,b)=>alpha(a,b)).forEach(cat => {
      const catProds = productos.filter(p=>p.catId===cat.id);
      if (!catProds.length) return;
      lines.push(`---${cat.label}---`);
      if (cat.subs.length === 0) {
        [...catProds].sort((a,b)=>alpha(a,b,"nombre")).forEach(p => {
          const um = p.unidadesMes ? (Number.isInteger(p.unidadesMes)?String(p.unidadesMes):(() => {
            const fracs=[[1/12,"1/12"],[1/6,"1/6"],[1/4,"1/4"],[1/3,"1/3"],[1/2,"1/2"],[2/3,"2/3"],[3/4,"3/4"]];
            for(const [v,s] of fracs) if(Math.abs(p.unidadesMes-v)<0.001) return s;
            return p.unidadesMes.toFixed(2);
          })()) : "";
          const cant = p.cantidadRef||"";
          const unit = p.unidad||"gr";
          const precio = p.precioRef?`${p.precioRef}$`:"";
          lines.push([p.nombre,p.marca||"",cant,unit,precio,um].filter((v,i)=>i<4||v).join("-"));
        });
      } else {
        [...cat.subs].sort((a,b)=>alpha(a,b)).forEach(sub => {
          const subProds = [...catProds.filter(p=>p.subId===sub.id)].sort((a,b)=>alpha(a,b,"nombre"));
          if (!subProds.length) return;
          lines.push(sub.label);
          subProds.forEach(p => {
            const um = p.unidadesMes ? (Number.isInteger(p.unidadesMes)?String(p.unidadesMes):(() => {
              const fracs=[[1/12,"1/12"],[1/6,"1/6"],[1/4,"1/4"],[1/3,"1/3"],[1/2,"1/2"],[2/3,"2/3"],[3/4,"3/4"]];
              for(const [v,s] of fracs) if(Math.abs(p.unidadesMes-v)<0.001) return s;
              return p.unidadesMes.toFixed(2);
            })()) : "";
            const cant = p.cantidadRef||"";
            const unit = p.unidad||"gr";
            const precio = p.precioRef?`${p.precioRef}$`:"";
            lines.push([p.nombre,p.marca||"",cant,unit,precio,um].filter((v,i)=>i<4||v).join("-"));
          });
        });
      }
      lines.push("");
    });
    return lines.join("\n").trim();
  }

  function buildExportText(cats, productos, filterCatId=null, filterSubId=null) {
    const lines = [];
    const tCats = filterCatId ? cats.filter(c=>c.id===filterCatId) : [...cats].sort((a,b)=>alpha(a,b));
    tCats.forEach(cat => {
      const cp = productos.filter(p=>p.catId===cat.id); if (!cp.length) return;
      if (cat.subs.length===0) {
        const f = filterSubId ? [] : [...cp].sort((a,b)=>alpha(a,b,"nombre"));
        if (!f.length) return;
        lines.push(`=== ${cat.label.toUpperCase()} ===`);
        f.forEach(p=>{lines.push(p.nombre);lines.push(`${p.marca||""}${p.precioRef?" "+fmt(p.precioRef):""}`.trim());lines.push("");});
      } else {
        const tSubs = filterSubId ? cat.subs.filter(s=>s.id===filterSubId) : [...cat.subs].sort((a,b)=>alpha(a,b));
        const hasProds = tSubs.some(sub => cp.some(p=>p.subId===sub.id));
        if (!hasProds) return;
        lines.push(`=== ${cat.label.toUpperCase()} ===`);
        tSubs.forEach(sub => {
          const sp = [...cp.filter(p=>p.subId===sub.id)].sort((a,b)=>alpha(a,b,"nombre"));
          if (!sp.length) return;
          lines.push(`--- ${sub.label} ---`);
          sp.forEach(p=>{lines.push(p.nombre);lines.push(`${p.marca||""}${p.precioRef?" "+fmt(p.precioRef):""}`.trim());lines.push("");});
        });
      }
    });
    return lines.join("\n").trim();
  }

  async function copyToClipboard(text) {
    try { if (navigator.clipboard) { await navigator.clipboard.writeText(text); return true; } } catch {}
    try {
      const el=document.createElement("textarea"); el.value=text; el.setAttribute("readonly","");
      el.style.cssText="position:absolute;left:-9999px;top:0"; document.body.appendChild(el);
      el.focus(); el.select(); el.setSelectionRange(0,el.value.length);
      const ok=document.execCommand("copy"); document.body.removeChild(el); return ok;
    } catch { return false; }
  }

  function parseProductLine(l) {
    if (!/\$/.test(l)||!l.includes("-")) return null;
    const parts=l.split("-").map(p=>p.trim()); if(parts.length<4) return null;
    const nombre=parts[0],marca=parts[1];
    const rawCant=(parts[2]||"").trim();
    const uLow=(parts[3]||"").toLowerCase();
    const cantidad=(uLow==="m"||uLow==="un")?rawCant:(parseFloat(rawCant)||null);
    const unidad=uLow==="ml"?"mL":uLow==="l"?"L":uLow==="kg"?"kg":uLow==="m"?"m":uLow==="un"?"un":"gr";
    const precioRef=parseFloat((parts[4]||"").replace(/[$\s]/g,"").replace(",","."))||null;
    const umStr=(parts[5]||"").trim();
    const unidadesMes=umStr?(umStr.includes("/")?parseFloat(umStr.split("/")[0])/parseFloat(umStr.split("/")[1]):parseFloat(umStr.replace(",","."))):null;
    return {nombre,marca,cantidadRef:cantidad,unidad,precioRef,unidadesMes};
  }

  function parseImportText(text) {
    const lines=text.split("\n").map(l=>l.trim());
    const parsed=[]; let currentCat=null,currentSub=null,currentProducts=[];
    const flush=()=>{if(currentCat&&currentProducts.length){parsed.push({catLabel:currentCat,subLabel:currentSub,products:[...currentProducts]});currentProducts=[];}};
    for(const line of lines){
      if(!line) continue;
      const catMatch=line.match(/^---(.+?)---$/);
      if(catMatch){flush();currentCat=catMatch[1].trim();currentSub=null;continue;}
      if(!currentCat) continue;
      const prod=parseProductLine(line);
      if(prod){currentProducts.push(prod);}
      else{flush();currentSub=line;}
    }
    flush();
    return parsed;
  }


  function Confirm({msg,onOk,onCancel,okLabel="Confirmar",okColor="#3b82f6"}) {
    return (
      <div style={{position:"fixed",inset:0,background:"#000b",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:"#0d1321",border:"1px solid #2a3550",borderRadius:16,padding:24,maxWidth:320,width:"100%"}}>
          <div style={{fontSize:15,lineHeight:1.5,marginBottom:20,color:"#e8eaf0"}}>{msg}</div>
          <div style={{display:"flex",gap:10}}>
            <button className="btn" onClick={onCancel} style={{flex:1,background:"#1a2235",color:"#8b9ab0",padding:12}}>Cancelar</button>
            <button className="btn" onClick={onOk} style={{flex:1,background:okColor,color:okColor==="#ef4444"?"#fff":"#080c14",padding:12}}>{okLabel}</button>
          </div>
        </div>
      </div>
    );
  }

  function AddModal({title,namePlaceholder,onClose,onSave,showColor=true,accentColor="#3b82f6"}) {
    const [label,setLabel]=useState(""); const [emoji,setEmoji]=useState("📦"); const [color,setColor]=useState(accentColor);
    const submit=()=>{if(!label.trim())return; onSave({label:label.trim(),emoji,color});};
    return (
      <div style={{position:"fixed",inset:0,background:"#000c",zIndex:1500,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div style={{background:"#0d1321",borderRadius:"20px 20px 0 0",padding:"28px 24px 36px",width:"100%",maxWidth:500,border:"1px solid #1a2235",borderBottom:"none"}}>
          <div style={{width:40,height:4,background:"#2a3550",borderRadius:2,margin:"0 auto 24px"}}/>
          <div style={{fontWeight:700,fontSize:18,marginBottom:20,color:"#e8eaf0"}}>{title}</div>
          <div style={{display:"grid",gridTemplateColumns:"64px 1fr",gap:10,marginBottom:16}}>
            <div className="field"><label>Emoji</label><input className="inp" value={emoji} onChange={e=>setEmoji(e.target.value)} style={{textAlign:"center",fontSize:22,padding:"10px 4px"}} autoFocus/></div>
            <div className="field"><label>Nombre</label><input className="inp" placeholder={namePlaceholder} value={label} onChange={e=>setLabel(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
          </div>
          {showColor&&(
            <div style={{marginBottom:20}}>
              <div style={{fontSize:11,fontWeight:600,color:"#4a5568",textTransform:"uppercase",letterSpacing:".08em",marginBottom:10}}>Color</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>{COLORS.map(c=><div key={c} onClick={()=>setColor(c)} style={{width:32,height:32,borderRadius:"50%",background:c,cursor:"pointer",border:color===c?"3px solid #fff":"3px solid transparent",transition:"all .15s",flexShrink:0}}/>)}</div>
            </div>
          )}
          <div style={{display:"flex",gap:10}}>
            <button className="btn" onClick={onClose} style={{flex:1,background:"#1a2235",color:"#8b9ab0",padding:13,fontSize:14}}>Cancelar</button>
            <button className="btn" onClick={submit} style={{flex:2,background:showColor?color:accentColor,color:"#080c14",padding:13,fontSize:15,fontWeight:700}}>Crear</button>
          </div>
        </div>
      </div>
    );
  }

  function FloatingAdd({onClick}) {
    return <button onClick={onClick} style={{position:"fixed",bottom:28,right:20,width:56,height:56,borderRadius:"50%",background:"#3b82f6",color:"#fff",fontSize:28,display:"flex",alignItems:"center",justifyContent:"center",border:"none",cursor:"pointer",boxShadow:"0 4px 24px #3b82f655",zIndex:100,lineHeight:1}}>+</button>;
  }

  function TopBar({title,subtitle,onBack,right}) {
    return (
      <div style={{padding:"24px 0 16px",display:"flex",alignItems:"center",gap:12}}>
        {onBack&&<button className="btn" onClick={onBack} style={{background:"#0d1321",color:"#e8eaf0",border:"1px solid #1a2235",padding:"8px 12px",fontSize:14,flexShrink:0}}>←</button>}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:17,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",color:"#e8eaf0"}}>{title}</div>
          {subtitle&&<div style={{fontSize:12,color:"#4a5568",marginTop:2}}>{subtitle}</div>}
        </div>
        {right}
      </div>
    );
  }

  function SearchBar({value,onChange,placeholder="🔍 Buscar en toda la canasta…"}) {
    return <input className="inp" placeholder={placeholder} value={value} onChange={e=>onChange(e.target.value)} style={{marginBottom:14}}/>;
  }

  function ProdCard({p,cat,gastoMensual,push,selectMode,selected,onToggle}) {
    const gm=gastoMensual(p); const isSel=selected?.has(p.id);
    return (
      <div className="card" style={{padding:"13px 16px",display:"flex",alignItems:"center",gap:12,borderLeft:`3px solid ${isSel?"#3b82f6":cat?.color||"#444"}`,cursor:"pointer",background:isSel?"#0d1f3c":"#0d1321",transition:"all .15s"}}
        onClick={()=>selectMode?onToggle?.(p.id):push("detalle",{prodId:p.id})}>
        {selectMode&&<div style={{width:22,height:22,borderRadius:"50%",border:`2px solid ${isSel?"#3b82f6":"#2a3550"}`,background:isSel?"#3b82f6":"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:"#fff",fontWeight:700}}>{isSel?"✓":""}</div>}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600,fontSize:15,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",color:"#e8eaf0"}}>{p.nombre}</div>
          <div style={{fontSize:12,color:"#4a5568",marginTop:2}}>{p.marca||"—"}</div>
        </div>
        <div style={{textAlign:"right",flexShrink:0}}>
          {p.precioRef
            ?<><div style={{display:"flex",alignItems:"baseline",gap:6,justifyContent:"flex-end"}}><div className="mono" style={{fontWeight:700,fontSize:16,color:"#e8eaf0"}}>{fmt(p.precioRef)}</div>{p.cantidadRef&&<div style={{fontSize:11,color:"#4a5568"}}>{p.cantidadRef}{p.unidad||""}</div>}</div>{gm&&p.unidadesMes&&<div className="mono" style={{fontSize:11,color:cat?.color,marginTop:2}}>{fmtU(p.unidadesMes)} u/mes = {fmt(gm)}</div>}</>
            :<div style={{fontSize:12,color:"#4a5568"}}>Sin precio</div>}
        </div>
      </div>
    );
  }

  // ── App ─────────────────────────────────────────────────────────────────────
  function App() {
    const [cats,setCats]=useState(DEFAULT_CATS);
    const [productos,setProductos]=useState([]);
    const [loaded,setLoaded]=useState(false);
    const [stack,setStack]=useState([{screen:"home"}]);
    const [toast,setToast]=useState(null);
    const [confirm,setConfirm]=useState(null);

    const current=stack[stack.length-1];
    const push=(screen,params={})=>setStack(s=>[...s,{screen,...params}]);
    const pop=()=>setStack(s=>s.length>1?s.slice(0,-1):s);

    useEffect(()=>{
      (async()=>{
        try {
          const [{ data: catRows }, { data: prodRows }] = await Promise.all([
            sb.from("categorias").select("*"),
            sb.from("productos").select("*")
          ]);
          if (catRows && catRows.length) {
            const lc = catRows.map(r=>({id:r.id,label:r.label,emoji:r.emoji,color:r.color,subs:r.subs||[]}));
            const validSubs = new Set(lc.flatMap(c=>c.subs.map(s=>s.id)));
            const lp = (prodRows||[]).map(r=>({
              id:r.id, nombre:r.nombre, marca:r.marca||"", catId:r.cat_id, subId:r.sub_id&&validSubs.has(r.sub_id)?r.sub_id:null,
              precioRef:r.precio_ref, unidadesMes:r.unidades_mes, cantidadRef:r.cantidad_ref, unidad:r.unidad||"gr",
              historialCompra:r.historial_compra||[]
            }));
            setCats(lc); setProductos(lp);
          } else {
            // First time: seed default cats
            const inserts = DEFAULT_CATS.map(c=>({id:c.id,label:c.label,emoji:c.emoji,color:c.color,subs:c.subs}));
            await sb.from("categorias").insert(inserts);
            setCats(DEFAULT_CATS); setProductos([]);
          }
        } catch(e) { console.error(e); setProductos(DEFAULT_PRODUCTOS); }
        setLoaded(true);
      })();
    },[]);

    const guardar=async(nextCats,nextProds)=>{
      const nc=nextCats??cats; const np=nextProds??productos;
      setCats(nc); setProductos(np);
      try {
        if (nextCats) {
          await sb.from("categorias").upsert(
            nc.map(c=>({id:c.id,label:c.label,emoji:c.emoji,color:c.color,subs:c.subs}))
          );
          // Delete removed cats
          const ncIds = nc.map(c=>c.id);
          const oldIds = cats.map(c=>c.id).filter(id=>!ncIds.includes(id));
          if (oldIds.length) await sb.from("categorias").delete().in("id", oldIds);
        }
        if (nextProds) {
          await sb.from("productos").upsert(
            np.map(p=>({id:p.id,nombre:p.nombre,marca:p.marca||"",cat_id:p.catId,sub_id:p.subId||null,
              precio_ref:p.precioRef,unidades_mes:p.unidadesMes,cantidad_ref:p.cantidadRef,
              unidad:p.unidad||"gr",historial_compra:p.historialCompra||[]}))
          );
          // Delete removed products
          const npIds = np.map(p=>p.id);
          const oldPIds = productos.map(p=>p.id).filter(id=>!npIds.includes(id));
          if (oldPIds.length) await sb.from("productos").delete().in("id", oldPIds);
        }
      } catch(e) { console.error("Supabase error:", e); }
    };

    const showToast=(msg,tipo="ok")=>{setToast({msg,tipo});setTimeout(()=>setToast(null),2400);};
    const askConfirm=(msg,onOk,okLabel="Confirmar",okColor="#3b82f6")=>setConfirm({msg,onOk,okLabel,okColor});
    const getCat=(id)=>cats.find(c=>c.id===id);
    const getSub=(catId,subId)=>getCat(catId)?.subs?.find(s=>s.id===subId);
    const gastoMensual=(p)=>(p.precioRef&&p.unidadesMes)?p.precioRef*p.unidadesMes:null;
    const handleExport=async(catId=null,subId=null)=>{
      const text=buildExportText(cats,productos,catId,subId);
      if(!text)return showToast("No hay productos para exportar","err");
      const ok=await copyToClipboard(text);
      showToast(ok?"📋 Copiado al portapapeles":"No se pudo copiar");
    };

    if(!loaded)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",color:"#3b82f6",fontFamily:"monospace"}}>Cargando…</div>;

    const s=current.screen;
    const shared={cats,productos,guardar,showToast,askConfirm,push,pop,gastoMensual,getCat,getSub,handleExport};

    return (
      <div style={{fontFamily:"'DM Sans','Segoe UI',sans-serif",minHeight:"100vh",background:"#080c14",color:"#e8eaf0"}}>
        {toast&&<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",zIndex:3000,background:toast.tipo==="err"?"#ef4444":"#10b981",color:"#fff",padding:"9px 20px",borderRadius:10,fontWeight:600,fontSize:13,boxShadow:"0 8px 32px #0008",whiteSpace:"nowrap",maxWidth:"90vw",textAlign:"center"}}>{toast.msg}</div>}
        {confirm&&<Confirm msg={confirm.msg} onOk={()=>{confirm.onOk();setConfirm(null);}} onCancel={()=>setConfirm(null)} okLabel={confirm.okLabel} okColor={confirm.okColor}/>}
        <div style={{maxWidth:500,margin:"0 auto",padding:"0 16px 100px"}}>
          {s==="home"        &&<HomeScreen {...shared}/>}
          {s==="subs"        &&<SubsScreen {...shared} catId={current.catId}/>}
          {s==="lista"       &&<ListaScreen {...shared} catId={current.catId} subId={current.subId}/>}
          {s==="detalle"     &&<DetalleScreen {...shared} prodId={current.prodId}/>}
          {s==="nuevo-prod"  &&<NuevoProdScreen {...shared} initCatId={current.catId} initSubId={current.subId}/>}
          {s==="editar-prod" &&<EditarProdScreen {...shared} prodId={current.prodId}/>}
          {s==="nuevo-precio"&&<NuevoPrecioScreen {...shared} prodId={current.prodId}/>}
          {s==="config"      &&<ConfigScreen {...shared}/>}
          {s==="export"      &&<ExportScreen {...shared}/>}
          {s==="import"      &&<ImportScreen {...shared}/>}
        </div>
        {!["nuevo-prod","editar-prod","nuevo-precio"].includes(s)&&(
          <FloatingAdd onClick={()=>push("nuevo-prod",{catId:current.catId||null,subId:current.subId&&current.subId!==UNASSIGNED_ID?current.subId:null})}/>
        )}
      </div>
    );
  }

  // ── HomeScreen ───────────────────────────────────────────────────────────────
  function HomeScreen({cats,productos,push,gastoMensual,guardar,showToast}) {
    const [q,setQ]=useState(""); const [showAddCat,setShowAddCat]=useState(false); const [sortCats,setSortCats]=useState("nombre-az");
    const total=productos.reduce((s,p)=>s+(gastoMensual(p)||0),0);
    const addCat=async({label,emoji,color})=>{await guardar([...cats,{id:uid(),label,emoji,color,subs:[]}],null);setShowAddCat(false);showToast("✅ Categoría creada");};
    const sortedCats=[...cats].sort((a,b)=>{
      const ga=productos.filter(p=>p.catId===a.id).reduce((s,p)=>s+(gastoMensual(p)||0),0);
      const gb=productos.filter(p=>p.catId===b.id).reduce((s,p)=>s+(gastoMensual(p)||0),0);
      if(sortCats==="nombre-az")return alpha(a,b);
      if(sortCats==="nombre-za")return alpha(b,a);
      if(sortCats==="gasto-asc")return ga-gb;
      if(sortCats==="gasto-desc")return gb-ga;
      return 0;
    });
    if(q){
      const results=productos.filter(p=>p.nombre.toLowerCase().includes(q.toLowerCase())||(p.marca||"").toLowerCase().includes(q.toLowerCase()));
      return (<div className="fade">
        <div style={{padding:"28px 0 12px",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div><div style={{fontSize:22,fontWeight:700,letterSpacing:"-.03em",color:"#e8eaf0"}}>🧺 Canasta</div><div style={{fontSize:12,color:"#4a5568",marginTop:3}}><span style={{color:"#3b82f6",fontWeight:600}}>{fmt(total)}/mes</span></div></div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn" onClick={()=>push("import")} style={{background:"#0d1321",border:"1px solid #1a2235",color:"#e8eaf0",padding:"9px 13px",fontSize:15}}>📥</button>
            <button className="btn" onClick={()=>push("export")} style={{background:"#0d1321",border:"1px solid #1a2235",color:"#e8eaf0",padding:"9px 13px",fontSize:15}}>📋</button>
            <button className="btn" onClick={()=>push("config")} style={{background:"#0d1321",border:"1px solid #1a2235",color:"#e8eaf0",padding:"9px 13px",fontSize:15}}>⚙️</button>
          </div>
        </div>
        <SearchBar value={q} onChange={setQ}/>
        <div style={{fontSize:12,color:"#4a5568",marginBottom:10}}>{results.length} resultado{results.length!==1?"s":""} en toda la canasta</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>{[...results].sort((a,b)=>alphaStr(a.nombre,b.nombre)).map(p=>{const cat=cats.find(c=>c.id===p.catId);return <ProdCard key={p.id} p={p} cat={cat} gastoMensual={gastoMensual} push={push}/>;})}</div>
      </div>);
    }
    return (<div className="fade">
      <div style={{padding:"28px 0 12px",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div><div style={{fontSize:22,fontWeight:700,letterSpacing:"-.03em",color:"#e8eaf0"}}>🧺 Canasta</div><div style={{fontSize:12,color:"#4a5568",marginTop:3}}>{productos.length} productos · <span style={{color:"#3b82f6",fontWeight:600}}>{fmt(total)}/mes</span></div></div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn" onClick={()=>push("import")} style={{background:"#0d1321",border:"1px solid #1a2235",color:"#e8eaf0",padding:"9px 13px",fontSize:15}}>📥</button>
          <button className="btn" onClick={()=>push("export")} style={{background:"#0d1321",border:"1px solid #1a2235",color:"#e8eaf0",padding:"9px 13px",fontSize:15}}>📋</button>
          <button className="btn" onClick={()=>push("config")} style={{background:"#0d1321",border:"1px solid #1a2235",color:"#e8eaf0",padding:"9px 13px",fontSize:15}}>⚙️</button>
        </div>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <input className="inp" placeholder="🔍 Buscar en toda la canasta…" value={q} onChange={e=>setQ(e.target.value)} style={{flex:1,marginBottom:0}}/>
        <select value={sortCats} onChange={e=>setSortCats(e.target.value)} style={{background:"#0d1321",border:"1px solid #1a2235",color:"#8b9ab0",borderRadius:10,padding:"0 10px",fontSize:13,fontFamily:"inherit",outline:"none",flexShrink:0}}>
          <option value="nombre-az">A→Z</option>
          <option value="nombre-za">Z→A</option>
          <option value="gasto-desc">Gasto ↓</option>
          <option value="gasto-asc">Gasto ↑</option>
        </select>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {sortedCats.map(cat=>{
          const catProds=productos.filter(p=>p.catId===cat.id);
          const gasto=catProds.reduce((s,p)=>s+(gastoMensual(p)||0),0);
          return (<div key={cat.id} className="card row" style={{padding:"16px 18px",display:"flex",alignItems:"center",gap:14,borderLeft:`4px solid ${cat.color}`}}
            onClick={()=>cat.subs?.length?push("subs",{catId:cat.id}):push("lista",{catId:cat.id,subId:null})}>
            <div style={{fontSize:28}}>{cat.emoji}</div>
            <div style={{flex:1}}><div style={{fontWeight:600,fontSize:16,color:"#e8eaf0"}}>{cat.label}</div><div style={{fontSize:12,color:"#4a5568",marginTop:2}}>{cat.subs?.length?`${cat.subs.length} subcategorías · `:""}{catProds.length} productos</div></div>
            <div style={{textAlign:"right"}}>{gasto>0&&<div className="mono" style={{fontWeight:700,fontSize:15,color:cat.color}}>{fmt(gasto)}<span style={{fontSize:10,color:"#4a5568"}}>/mes</span></div>}<div style={{fontSize:18,color:"#2a3550",marginTop:2}}>›</div></div>
          </div>);
        })}
        <button className="btn" onClick={()=>setShowAddCat(true)} style={{background:"#3b82f611",border:"1px solid #3b82f6",color:"#3b82f6",padding:"13px",fontSize:14,marginTop:4,width:"100%",fontWeight:600}}>+ Agregar categoría</button>
      </div>
      {showAddCat&&<AddModal title="Nueva categoría" namePlaceholder="ej. Panadería" onClose={()=>setShowAddCat(false)} onSave={addCat} showColor={true}/>}
    </div>);
  }

  // ── SubsScreen ───────────────────────────────────────────────────────────────
  function SubsScreen({cats,catId,productos,push,pop,gastoMensual,guardar,showToast}) {
    const [q,setQ]=useState(""); const [showAddSub,setShowAddSub]=useState(false);
    const [sortBy,setSortBy]=useState("nombre-az");
    const cat=cats.find(c=>c.id===catId); if(!cat) return null;
    const catGasto=productos.filter(p=>p.catId===catId).reduce((s,p)=>s+(gastoMensual(p)||0),0);
    const addSub=({label})=>{guardar(cats.map(c=>c.id===catId?{...c,subs:[...c.subs,{id:uid(),label}]}:c),null);setShowAddSub(false);showToast("✅ Subcategoría creada");};

    const validSubIds=new Set(cat.subs.map(s=>s.id));
    const orphans=cat.subs.length>0
      ? productos.filter(p=>p.catId===catId&&(!p.subId||!validSubIds.has(p.subId)))
      : [];
    const orphanGasto=orphans.reduce((s,p)=>s+(gastoMensual(p)||0),0);

    const SortSelect=()=>(
      <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{background:"#0d1321",border:"1px solid #1a2235",color:"#8b9ab0",borderRadius:10,padding:"0 10px",fontSize:13,fontFamily:"inherit",outline:"none",flexShrink:0}}>
        <option value="nombre-az">A→Z</option><option value="nombre-za">Z→A</option>
        <option value="precio-asc">Precio ↑</option><option value="precio-desc">Precio ↓</option>
        <option value="gasto-asc">Gasto ↑</option><option value="gasto-desc">Gasto ↓</option>
      </select>
    );

    if(q){
      const results=productos.filter(p=>p.nombre.toLowerCase().includes(q.toLowerCase())||(p.marca||"").toLowerCase().includes(q.toLowerCase()));
      return (<div className="fade">
        <TopBar title={`${cat.emoji} ${cat.label}`} onBack={pop} right={<button className="btn" onClick={()=>push("config")} style={{background:"#0d1321",border:"1px solid #1a2235",color:"#a78bfa",padding:"8px 11px",fontSize:14}}>⚙️</button>}/>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          <input className="inp" placeholder="🔍 Buscar en toda la canasta…" value={q} onChange={e=>setQ(e.target.value)} style={{flex:1,marginBottom:0}}/>
          <SortSelect/>
        </div>
        <div style={{fontSize:12,color:"#4a5568",marginBottom:10}}>{results.length} resultado{results.length!==1?"s":""} en toda la canasta</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>{results.map(p=>{const pcat=cats.find(c=>c.id===p.catId);return <ProdCard key={p.id} p={p} cat={pcat} gastoMensual={gastoMensual} push={push}/>;})}</div>
      </div>);
    }

    return (<div className="fade">
      <TopBar title={`${cat.emoji} ${cat.label}`} subtitle={catGasto>0?`${fmt(catGasto)}/mes`:undefined} onBack={pop}
        right={<div style={{display:"flex",gap:8}}>
          <button className="btn" onClick={()=>push("config")} style={{background:"#0d1321",border:"1px solid #1a2235",color:"#a78bfa",padding:"8px 11px",fontSize:14}}>⚙️</button>
          <button className="btn" onClick={()=>push("lista",{catId,subId:null})} style={{background:"#0d1321",border:"1px solid #1a2235",color:"#8b9ab0",padding:"8px 11px",fontSize:12}}>Ver todos</button>
        </div>}/>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <input className="inp" placeholder="🔍 Buscar en toda la canasta…" value={q} onChange={e=>setQ(e.target.value)} style={{flex:1,marginBottom:0}}/>
        <SortSelect/>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {[...cat.subs].sort((a,b)=>alpha(a,b)).map(sub=>{
          const subProds=productos.filter(p=>p.catId===catId&&p.subId===sub.id);
          const gasto=subProds.reduce((s,p)=>s+(gastoMensual(p)||0),0);
          return (<div key={sub.id} className="card row" style={{padding:"14px 18px",display:"flex",alignItems:"center",gap:12,borderLeft:`3px solid ${cat.color}`}} onClick={()=>push("lista",{catId,subId:sub.id})}>
            <div style={{flex:1}}><div style={{fontWeight:600,fontSize:15,color:"#e8eaf0"}}>{sub.label}</div><div style={{fontSize:12,color:"#4a5568",marginTop:2}}>{subProds.length} productos</div></div>
            <div style={{textAlign:"right"}}>{gasto>0&&<div className="mono" style={{fontWeight:600,fontSize:14,color:cat.color}}>{fmt(gasto)}<span style={{fontSize:10,color:"#4a5568"}}>/mes</span></div>}<div style={{fontSize:18,color:"#2a3550"}}>›</div></div>
          </div>);
        })}
        {orphans.length>0&&(
          <div className="card row" style={{padding:"14px 18px",display:"flex",alignItems:"center",gap:12,borderLeft:"3px solid #4a5568",opacity:0.85}} onClick={()=>push("lista",{catId,subId:"__sin_sub__"})}>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:15,color:"#8b9ab0"}}>Sin subcategoría</div>
              <div style={{fontSize:12,color:"#4a5568",marginTop:2}}>{orphans.length} producto{orphans.length!==1?"s":""} sin asignar · usá Selec. para moverlos</div>
            </div>
            <div style={{textAlign:"right"}}>
              {orphanGasto>0&&<div className="mono" style={{fontWeight:600,fontSize:14,color:"#8b9ab0"}}>{fmt(orphanGasto)}<span style={{fontSize:10,color:"#4a5568"}}>/mes</span></div>}
              <div style={{fontSize:18,color:"#2a3550"}}>›</div>
            </div>
          </div>
        )}
      </div>
      <button className="btn" onClick={()=>setShowAddSub(true)} style={{background:cat.color+"11",border:`1px solid ${cat.color}`,color:cat.color,padding:"13px",fontSize:14,marginTop:14,width:"100%",fontWeight:600}}>+ Agregar subcategoría</button>
      {showAddSub&&<AddModal title={`Nueva subcategoría en ${cat.label}`} namePlaceholder="ej. Personal" onClose={()=>setShowAddSub(false)} onSave={addSub} showColor={false} accentColor={cat.color}/>}
    </div>);
  }
  function ListaScreen({cats,catId,subId,productos,guardar,push,pop,gastoMensual,handleExport,showToast}) {
    const [q,setQ]=useState("");
    const [sortBy,setSortBy]=useState("nombre-az"); const [selected,setSelected]=useState(new Set());
    const [selectMode,setSelectMode]=useState(false); const [moveModal,setMoveModal]=useState(false); const [moveDest,setMoveDest]=useState("");
    const cat=cats.find(c=>c.id===catId); const sub=cat?.subs?.find(s=>s.id===subId); if(!cat) return null;
    const isUnassignedView=subId===UNASSIGNED_ID;
    const sortFn = (a,b) => {
      const gma=gastoMensual(a)||0, gmb=gastoMensual(b)||0;
      if(sortBy==="nombre-az") return alphaStr(a.nombre,b.nombre);
      if(sortBy==="nombre-za") return alphaStr(b.nombre,a.nombre);
      if(sortBy==="precio-asc") return (a.precioRef||0)-(b.precioRef||0);
      if(sortBy==="precio-desc") return (b.precioRef||0)-(a.precioRef||0);
      if(sortBy==="gasto-asc") return gma-gmb;
      if(sortBy==="gasto-desc") return gmb-gma;
      return 0;
    };
    const baseLista=productos.filter(p=>{if(p.catId!==catId)return false;if(isUnassignedView)return isUnassignedProd(p,cat);if(subId)return p.subId===subId;return true;});
    const lista=[...(q?productos.filter(p=>p.nombre.toLowerCase().includes(q.toLowerCase())||(p.marca||"").toLowerCase().includes(q.toLowerCase())):baseLista)].sort(sortFn);
    const toggleSelect=(id)=>{setSelected(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});};
    const cancelSelect=()=>{setSelectMode(false);setSelected(new Set());};
    const doMove=async()=>{
      if(!moveDest)return;
      const [dCatId,dSubId]=moveDest.split("::");
      const dCat=cats.find(c=>c.id===dCatId); const dSub=dSubId?dCat?.subs?.find(s=>s.id===dSubId):null;
      await guardar(null,productos.map(p=>selected.has(p.id)?{...p,catId:dCatId,subId:dSubId||null}:p));
      showToast(`✅ ${selected.size} producto${selected.size>1?"s":""} movido${selected.size>1?"s":""} a ${dSub?`${dCat?.label} › ${dSub.label}`:dCat?.label}`);
      setMoveModal(false);setMoveDest("");cancelSelect();
    };
    const catGasto=productos.filter(p=>p.catId===catId).reduce((s,p)=>s+(gastoMensual(p)||0),0);
    const title=isUnassignedView?`${cat.emoji} Sin subcategoría`:sub?`${cat.emoji} ${sub.label}`:`${cat.emoji} ${cat.label}`;
    const listSubtitle=sub?cat.label:isUnassignedView?cat.label:catGasto>0?`${fmt(catGasto)}/mes`:undefined;
    return (<div className="fade">
      {moveModal&&(<div style={{position:"fixed",inset:0,background:"#000b",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:"#0d1321",border:"1px solid #2a3550",borderRadius:16,padding:24,maxWidth:320,width:"100%"}}>
          <div style={{fontWeight:600,marginBottom:4,color:"#e8eaf0"}}>Mover {selected.size} producto{selected.size>1?"s":""}</div>
          <div style={{fontSize:12,color:"#4a5568",marginBottom:14}}>Elegí el destino</div>
          <select className="inp" value={moveDest} onChange={e=>setMoveDest(e.target.value)} style={{marginBottom:16}}>
            <option value="">— Elegir —</option>
            {[...cats].sort((a,b)=>alpha(a,b)).map(c=>[
              <option key={c.id+"::"} value={c.id+"::"} style={{fontWeight:600}}>{c.emoji} {c.label} (sin sub)</option>,
              ...[...c.subs].sort((a,b)=>alpha(a,b)).map(s=><option key={c.id+"::"+s.id} value={c.id+"::"+s.id}>{c.emoji} {c.label} › {s.label}</option>)
            ])}
          </select>
          <div style={{display:"flex",gap:10}}>
            <button className="btn" onClick={()=>{setMoveModal(false);setMoveDest("");}} style={{flex:1,background:"#1a2235",color:"#8b9ab0",padding:12}}>Cancelar</button>
            <button className="btn" onClick={doMove} style={{flex:1,background:"#3b82f6",color:"#fff",padding:12}} disabled={!moveDest}>Mover</button>
          </div>
        </div>
      </div>)}
      <TopBar title={title} subtitle={listSubtitle} onBack={()=>{cancelSelect();pop();}}
        right={selectMode
          ?<div style={{display:"flex",gap:8,alignItems:"center"}}>
              <div style={{fontSize:13,color:"#3b82f6",fontWeight:600}}>{selected.size} sel.</div>
              {selected.size>0&&<button className="btn" onClick={()=>setMoveModal(true)} style={{background:"#3b82f6",color:"#fff",padding:"8px 12px",fontSize:13}}>Mover</button>}
              <button className="btn" onClick={cancelSelect} style={{background:"#1a2235",color:"#8b9ab0",padding:"8px 12px",fontSize:13}}>✕</button>
            </div>
          :<div style={{display:"flex",gap:8}}>
              <button className="btn" onClick={()=>setSelectMode(true)} style={{background:"#0d1321",border:"1px solid #1a2235",color:"#8b9ab0",padding:"8px 11px",fontSize:12}}>Selec.</button>
              <button className="btn" onClick={()=>handleExport(catId,isUnassignedView?UNASSIGNED_ID:subId)} style={{background:"#0d1321",border:"1px solid #1a2235",color:"#e8eaf0",padding:"8px 11px",fontSize:14}}>📋</button>
            </div>}/>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <input className="inp" placeholder={q?"🔍 Buscando en toda la canasta…":"🔍 Buscar en toda la canasta…"} value={q} onChange={v=>{setQ(v.target.value);if(v.target.value)cancelSelect();}} style={{flex:1,marginBottom:0}}/>
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{background:"#0d1321",border:"1px solid #1a2235",color:"#8b9ab0",borderRadius:10,padding:"0 10px",fontSize:13,fontFamily:"inherit",outline:"none",flexShrink:0}}>
          <option value="nombre-az">A→Z</option>
          <option value="nombre-za">Z→A</option>
          <option value="precio-asc">Precio ↑</option>
          <option value="precio-desc">Precio ↓</option>
          <option value="gasto-asc">Gasto ↑</option>
          <option value="gasto-desc">Gasto ↓</option>
        </select>
      </div>
      {q&&<div style={{fontSize:12,color:"#4a5568",marginBottom:10}}>{lista.length} resultado{lista.length!==1?"s":""} en toda la canasta</div>}
      {lista.length===0?<div style={{textAlign:"center",color:"#4a5568",padding:"60px 0",fontSize:14}}>Sin productos aún.</div>
        :<div style={{display:"flex",flexDirection:"column",gap:8}}>
          {lista.map(p=>{
            const pcat=q?cats.find(c=>c.id===p.catId):cat; const isSel=selected.has(p.id);
            return (<div key={p.id} className="card" style={{padding:"13px 16px",display:"flex",alignItems:"center",gap:12,borderLeft:`3px solid ${isSel?"#3b82f6":pcat?.color||"#444"}`,cursor:"pointer",background:isSel?"#0d1f3c":"#0d1321",transition:"all .15s"}}
              onClick={()=>selectMode?toggleSelect(p.id):push("detalle",{prodId:p.id})}>

  // ── PriceChart (SVG puro) ──────────────────────────────────────────────────
  function PriceChart({hist, precioRef, clr}) {
    const W=320, H=150, PL=52, PR=20, PT=14, PB=28;
    const iW=W-PL-PR, iH=H-PT-PB;
    if (!hist||hist.length<1) return null;
    const prices=hist.map(h=>h.precio);
    const allVals=precioRef?[...prices,precioRef]:prices;
    const minV=Math.min(...allVals)*0.93;
    const maxV=Math.max(...allVals)*1.07;
    const range=maxV-minV||1;
    const toX=(i)=>PL+(hist.length===1?iW/2:(i/(hist.length-1))*iW);
    const toY=(v)=>PT+(1-(v-minV)/range)*iH;
    const refY=precioRef!=null?toY(precioRef):null;
    const pts=hist.map((h,i)=>`${toX(i).toFixed(1)},${toY(h.precio).toFixed(1)}`).join(" ");
    const yTicks=[minV,(minV+maxV)/2,maxV];
    return (
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:"visible",display:"block"}}>
        {yTicks.map((v,i)=>[
          <line key={"g"+i} x1={PL} y1={toY(v)} x2={W-PR} y2={toY(v)} stroke="#1a2235" strokeWidth={1}/>,
          <text key={"t"+i} x={PL-4} y={toY(v)+4} textAnchor="end" fontSize={9} fill="#4a5568">${Math.round(v)}</text>
        ])}
        {refY!=null&&(
          <line x1={PL} y1={refY} x2={W-PR} y2={refY} stroke={clr} strokeWidth={1.5} strokeDasharray="6 4" opacity={0.7}/>
        )}
        {refY!=null&&(
          <text x={W-PR+2} y={refY+4} fontSize={9} fill={clr} opacity={0.8}>ref</text>
        )}
        {hist.length>1&&<polyline points={pts} fill="none" stroke="#4ade80" strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>}
        {hist.map((h,i)=>{
          const x=toX(i), y=toY(h.precio);
          const dotColor=refY!=null?(h.precio>precioRef?"#ef4444":"#4ade80"):"#4ade80";
          const lblY=y>PT+20?y-8:y+16;
          const show=hist.length<=6||i===0||i===hist.length-1||i%Math.ceil(hist.length/5)===0;
          return (
            <g key={i}>
              <circle cx={x} cy={y} r={5} fill={dotColor} stroke="#080c14" strokeWidth={1.5}/>
              {show&&<text x={x} y={lblY} textAnchor="middle" fontSize={9} fill={dotColor}>{fmt(h.precio)}</text>}
              <text x={x} y={H} textAnchor="middle" fontSize={8} fill="#4a5568">{h.fecha?h.fecha.slice(5):""}</text>
            </g>
          );
        })}
      </svg>
    );
  }

          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div className="mono" style={{fontSize:22,fontWeight:700,color:clr}}>{fmt(equivalente)}</div>
            {diff!=null&&(<div style={{fontSize:13,fontWeight:600,color:diff>0?"#ef4444":"#10b981",background:diff>0?"#ef444418":"#10b98118",padding:"3px 10px",borderRadius:6}}>{diff>0?"▲":"▼"} {Math.abs(diff).toFixed(1)}% {diff>0?"más caro":"más barato"}</div>)}
          </div>
        </div>)}
        <div className="field"><label>Fecha</label><input className="inp" type="date" value={form.fecha} onChange={e=>setForm(f=>({...f,fecha:e.target.value}))}/></div>
        <div style={{display:"flex",gap:10,marginTop:4}}>
          <button className="btn" onClick={pop} style={{flex:1,background:"#0d1321",border:"1px solid #1a2235",color:"#e8eaf0",padding:13}}>Cancelar</button>
          <button className="btn" onClick={submit} style={{flex:2,background:clr,color:"#080c14",padding:13,fontSize:15}}>Guardar</button>
        </div>
      </div>
    </div>);
  }

  // ── ExportScreen ──────────────────────────────────────────────────────────────
  function ExportScreen({cats,productos,pop,showToast}) {
    const [preview,setPreview]=useState(null);
    const showPreview=(catId=null,subId=null)=>setPreview({text:buildExportText(cats,productos,catId,subId)});
    const doCopy=async()=>{if(!preview?.text)return;const ok=await copyToClipboard(preview.text);if(ok){showToast("📋 Copiado al portapapeles");return;}const el=document.querySelector(".export-pre");if(el){const range=document.createRange();range.selectNodeContents(el);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);showToast("Seleccionado — copiá con Ctrl+C");}else showToast("No se pudo copiar","err");};
    return (<div className="fade"><TopBar title="📋 Exportar lista" subtitle="Elegí qué querés copiar" onBack={pop}/>
      {preview&&(<div className="card" style={{padding:16,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><div style={{fontSize:13,fontWeight:600,color:"#e8eaf0"}}>Vista previa</div><button className="btn" onClick={doCopy} style={{background:"#3b82f6",color:"#fff",padding:"7px 16px",fontSize:13}}>Copiar</button></div>
        <pre className="export-pre" style={{fontSize:13,color:"#c8cfe0",lineHeight:1.7,whiteSpace:"pre-wrap",fontFamily:"'DM Mono',monospace",background:"#080c14",borderRadius:8,padding:12,maxHeight:260,overflowY:"auto"}}>{preview.text||"Sin productos."}</pre>
      </div>)}
      <div className="card row" style={{padding:"14px 18px",marginBottom:8,display:"flex",alignItems:"center",gap:12,borderLeft:"4px solid #3b82f6"}} onClick={()=>showPreview(null,null)}>
        <div style={{flex:1}}><div style={{fontWeight:600,fontSize:15,color:"#e8eaf0"}}>Toda la canasta</div><div style={{fontSize:12,color:"#4a5568",marginTop:2}}>Formato legible</div></div>
        <div style={{fontSize:18,color:"#2a3550"}}>›</div>
      </div>
      <div className="card row" style={{padding:"14px 18px",marginBottom:10,display:"flex",alignItems:"center",gap:12,borderLeft:"4px solid #4ade80"}} onClick={()=>setPreview({text:buildBackupText(cats,productos)})}>
        <div style={{flex:1}}><div style={{fontWeight:600,fontSize:15,color:"#e8eaf0"}}>💾 Backup completo</div><div style={{fontSize:12,color:"#4a5568",marginTop:2}}>Formato importable — para copia de seguridad</div></div>
        <div style={{fontSize:18,color:"#2a3550"}}>›</div>
      </div>
      <div style={{fontSize:11,fontWeight:600,color:"#4a5568",textTransform:"uppercase",letterSpacing:".08em",marginBottom:8,marginTop:4}}>Por sección</div>
      {[...cats].sort((a,b)=>alpha(a,b)).map(cat=>{const cp=productos.filter(p=>p.catId===cat.id);return(
        <div key={cat.id} className="card" style={{marginBottom:8,overflow:"hidden",borderLeft:`3px solid ${cat.color}`}}>
          <div className="row" style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:10}} onClick={()=>showPreview(cat.id,null)}>
            <span style={{fontSize:18}}>{cat.emoji}</span><div style={{flex:1}}><div style={{fontWeight:600,fontSize:14,color:"#e8eaf0"}}>{cat.label}</div><div style={{fontSize:11,color:"#4a5568"}}>{cp.length} productos</div></div><div style={{fontSize:16,color:"#2a3550"}}>›</div>
          </div>
          {[...cat.subs].sort((a,b)=>alpha(a,b)).map(sub=>{const sp=cp.filter(p=>p.subId===sub.id);if(!sp.length)return null;return(
            <div key={sub.id} className="row" style={{padding:"9px 16px 9px 44px",display:"flex",alignItems:"center",gap:10,borderTop:"1px solid #1a2235"}} onClick={()=>showPreview(cat.id,sub.id)}>
              <div style={{flex:1}}><div style={{fontSize:13,color:"#c8cfe0"}}>{sub.label}</div><div style={{fontSize:11,color:"#4a5568"}}>{sp.length} productos</div></div><div style={{fontSize:14,color:"#2a3550"}}>›</div>
            </div>);})}
        </div>);})}
    </div>);
  }

  // ── ImportScreen ──────────────────────────────────────────────────────────────
  function ImportScreen({cats,productos,guardar,pop,showToast}) {
    const [step,setStep]=useState("input"); const [text,setText]=useState(""); const [parsed,setParsed]=useState([]);
    const [conflicts,setConflicts]=useState([]); const [resolutions,setResolutions]=useState({});
    const doParse=async()=>{
    const blocks=parseImportText(text);
    if(!blocks.length)return showToast("No se encontraron productos válidos","err");
    // Auto-create missing cats and subs
    let updatedCats=[...cats];
    const matched=blocks.map(b=>{
      let cat=updatedCats.find(c=>matchStr(c.label,b.catLabel));
      if(!cat){
        // Create new category
        const CATCOLORS=["#60a5fa","#f472b6","#4ade80","#fb923c","#a78bfa","#facc15","#34d399","#f87171","#38bdf8","#e879f9"];
        cat={id:uid(),label:b.catLabel,emoji:"📦",color:CATCOLORS[updatedCats.length%CATCOLORS.length],subs:[]};
        updatedCats=[...updatedCats,cat];
      }
      let sub=null;
      if(b.subLabel){
        sub=cat.subs.find(s=>matchStr(s.label,b.subLabel));
        if(!sub){
          // Create new subcategory
          sub={id:uid(),label:b.subLabel};
          const newSubs=[...cat.subs,sub];
          updatedCats=updatedCats.map(c=>c.id===cat.id?{...c,subs:newSubs}:c);
          cat={...cat,subs:newSubs};
        }
      }
      return{...b,catId:cat.id,subId:sub?.id||null,catMatched:true,subMatched:true,autoCreated:!cats.find(c=>c.id===cat.id),autoCreatedSub:b.subLabel&&!cats.find(c=>c.id===cat.id||c.subs.find(s=>s.id===sub?.id))};
    });
    // Save updated cats if any were created
    if(updatedCats.length>cats.length||updatedCats.some((c,i)=>c.subs.length!==(cats[i]?.subs.length||0))){
      await guardar(updatedCats,null);
    }
    setParsed(matched);setStep("preview");
  };
    const doImport=async()=>{const toAdd=[];const toUpdate=[];parsed.forEach(block=>{if(!block.catId)return;block.products.forEach(p=>{const ex=productos.find(x=>x.nombre.toLowerCase()===p.nombre.toLowerCase()&&x.catId===block.catId);if(ex){if(resolutions[ex.id]==="overwrite")toUpdate.push({...ex,...p,catId:block.catId,subId:block.subId||null});}else{toAdd.push({...p,id:uid(),catId:block.catId,subId:block.subId||null,historialCompra:[]});}});});const updated=productos.map(p=>{const u=toUpdate.find(x=>x.id===p.id);return u||p;}).concat(toAdd);await guardar(null,updated);showToast(`✅ ${toAdd.length} agregados, ${toUpdate.length} actualizados`);pop();};
    const checkConflicts=()=>{const found=[];parsed.forEach(block=>{if(!block.catId)return;block.products.forEach(p=>{const ex=productos.find(x=>x.nombre.toLowerCase()===p.nombre.toLowerCase()&&x.catId===block.catId);if(ex)found.push({existing:ex,incoming:p,block});});});if(found.length){setConflicts(found);const def={};found.forEach(c=>{def[c.existing.id]="skip";});setResolutions(def);setStep("conflicts");}else doImport();};
    return (<div className="fade"><TopBar title="📥 Importar lista" onBack={pop}/>
      {step==="input"&&(<div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div className="card" style={{padding:16}}>
          <div style={{fontSize:13,color:"#8b9ab0",marginBottom:10,lineHeight:1.6}}>Formato por bloque (separá bloques con línea en blanco):<pre style={{marginTop:8,fontSize:12,color:"#4a90d9",background:"#080c14",borderRadius:8,padding:10,lineHeight:1.8}}>{`---Higiene---\nPersonal\nShampoo-Dove-400-mL-4500$-1\nJabón-Dove-90-gr-1180$-4\n\nLimpieza hogar\nDetergente-Magistral-500-mL-2371$-1\n\n---Primario---\nLeche-Carrefour-1-L-1182$-9`}</pre></div>
          <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Pegá tu lista acá…" style={{width:"100%",minHeight:200,background:"#080c14",border:"1px solid #1a2235",color:"#e8eaf0",borderRadius:10,padding:"11px 14px",fontSize:13,fontFamily:"'DM Mono',monospace",outline:"none",resize:"vertical",lineHeight:1.7}}/>
        </div>
        <div style={{display:"flex",gap:10}}><button className="btn" onClick={pop} style={{flex:1,background:"#0d1321",border:"1px solid #1a2235",color:"#e8eaf0",padding:13}}>Cancelar</button><button className="btn" onClick={doParse} style={{flex:2,background:"#3b82f6",color:"#fff",padding:13,fontSize:15}} disabled={!text.trim()}>Importar</button></div>
      </div>)}
      {step==="preview"&&(<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{fontSize:13,color:"#4a5568",marginBottom:4}}>Se van a importar {parsed.reduce((s,b)=>s+b.products.length,0)} productos:</div>
        {parsed.map((block,bi)=>{const cat=cats.find(c=>c.id===block.catId);return(<div key={bi} className="card" style={{padding:14,borderLeft:`3px solid ${cat?.color||"#4a5568"}`}}>
          <div style={{fontWeight:600,fontSize:14,marginBottom:2,color:"#e8eaf0"}}>{cat?.emoji} {block.catLabel}{block.subLabel?` › ${block.subLabel}`:""}</div>
          {block.autoCreated&&<div style={{fontSize:12,color:"#4ade80",marginBottom:6}}>✅ Categoría nueva creada</div>}
          {block.autoCreatedSub&&<div style={{fontSize:12,color:"#4ade80",marginBottom:6}}>✅ Subcategoría nueva creada</div>}
          <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:8}}>{block.products.map((p,pi)=>(<div key={pi} style={{fontSize:13,color:"#c8cfe0",display:"flex",justifyContent:"space-between"}}><span>{p.nombre} · <span style={{color:"#4a5568"}}>{p.marca}</span></span><span className="mono" style={{color:"#60a5fa"}}>{p.precioRef?fmt(p.precioRef):"—"}</span></div>))}</div>
        </div>);})}
        <div style={{display:"flex",gap:10,marginTop:4}}><button className="btn" onClick={()=>setStep("input")} style={{flex:1,background:"#0d1321",border:"1px solid #1a2235",color:"#e8eaf0",padding:13}}>Volver</button><button className="btn" onClick={checkConflicts} style={{flex:2,background:"#3b82f6",color:"#fff",padding:13,fontSize:15}}>Importar</button></div>
      </div>)}
      {step==="conflicts"&&(<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{fontSize:13,color:"#facc15",marginBottom:4}}>⚠️ {conflicts.length} producto{conflicts.length!==1?"s":""} ya existe{conflicts.length===1?"":"n"}.</div>
        {conflicts.map((c,i)=>(<div key={i} className="card" style={{padding:14}}>
          <div style={{fontWeight:600,fontSize:14,marginBottom:8,color:"#e8eaf0"}}>{c.existing.nombre}</div>
          <div style={{fontSize:12,color:"#4a5568",marginBottom:10}}>Actual: {fmt(c.existing.precioRef)} · Nuevo: {fmt(c.incoming.precioRef)}</div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn" onClick={()=>setResolutions(r=>({...r,[c.existing.id]:"skip"}))} style={{flex:1,padding:"9px 0",fontSize:13,background:resolutions[c.existing.id]==="skip"?"#1a2235":"#0d1321",color:resolutions[c.existing.id]==="skip"?"#e8eaf0":"#4a5568",border:`1px solid ${resolutions[c.existing.id]==="skip"?"#3b82f6":"#1a2235"}`}}>Mantener</button>
            <button className="btn" onClick={()=>setResolutions(r=>({...r,[c.existing.id]:"overwrite"}))} style={{flex:1,padding:"9px 0",fontSize:13,background:resolutions[c.existing.id]==="overwrite"?"#3b82f622":"#0d1321",color:resolutions[c.existing.id]==="overwrite"?"#3b82f6":"#4a5568",border:`1px solid ${resolutions[c.existing.id]==="overwrite"?"#3b82f6":"#1a2235"}`}}>Sobreescribir</button>
          </div>
        </div>))}
        <div style={{display:"flex",gap:10,marginTop:4}}><button className="btn" onClick={()=>setStep("preview")} style={{flex:1,background:"#0d1321",border:"1px solid #1a2235",color:"#e8eaf0",padding:13}}>Volver</button><button className="btn" onClick={doImport} style={{flex:2,background:"#3b82f6",color:"#fff",padding:13,fontSize:15}}>Confirmar</button></div>
      </div>)}
    </div>);
  }

  // ── ConfigScreen ──────────────────────────────────────────────────────────────
  function ConfigScreen({cats,productos,guardar,pop,showToast,askConfirm}) {
    const [openId,setOpenId]=useState(null); const [localCats,setLocalCats]=useState(cats);
    const [newSubInputs,setNewSubInputs]=useState({}); const [movingSub,setMovingSub]=useState(null); const [moveTarget,setMoveTarget]=useState("");
    useEffect(()=>{setLocalCats(cats);},[cats]);
    const save=async(next)=>{setLocalCats(next);await guardar(next,null);};
    const deleteCat=(id)=>askConfirm("¿Eliminar esta categoría?",async()=>{if(productos.some(p=>p.catId===id))return showToast("Eliminá los productos primero","err");save(localCats.filter(c=>c.id!==id));showToast("Categoría eliminada");setOpenId(null);},"Eliminar","#ef4444");
    const addSub=(catId)=>askConfirm(`¿Crear subcategoría "${(newSubInputs[catId]||"").trim()}"?`,async()=>{const label=(newSubInputs[catId]||"").trim();if(!label)return;save(localCats.map(c=>c.id===catId?{...c,subs:[...c.subs,{id:uid(),label}]}:c));setNewSubInputs(f=>({...f,[catId]:""}));showToast("✅ Subcategoría creada");},"Crear");
    const deleteSub=(catId,subId)=>askConfirm("¿Eliminar esta subcategoría?",async()=>{if(productos.some(p=>p.catId===catId&&p.subId===subId))return showToast("Eliminá los productos primero","err");save(localCats.map(c=>c.id===catId?{...c,subs:c.subs.filter(s=>s.id!==subId)}:c));},"Eliminar","#ef4444");
    const doMoveSub=async()=>{if(!moveTarget||!movingSub)return;const sub=localCats.find(c=>c.id===movingSub.catId)?.subs?.find(s=>s.id===movingSub.subId);if(!sub)return;const nc=localCats.map(c=>{if(c.id===movingSub.catId)return{...c,subs:c.subs.filter(s=>s.id!==movingSub.subId)};if(c.id===moveTarget)return{...c,subs:[...c.subs,sub]};return c;});const np=productos.map(p=>p.catId===movingSub.catId&&p.subId===movingSub.subId?{...p,catId:moveTarget}:p);await guardar(nc,np);setMovingSub(null);setMoveTarget("");showToast("✅ Subcategoría movida");};
    return (<div className="fade"><TopBar title="⚙️ Configuración" subtitle="Categorías y subcategorías" onBack={pop}/>
      {movingSub&&(<div style={{position:"fixed",inset:0,background:"#000b",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:"#0d1321",border:"1px solid #2a3550",borderRadius:16,padding:24,maxWidth:320,width:"100%"}}>
          <div style={{fontWeight:600,marginBottom:4,color:"#e8eaf0"}}>Mover "{movingSub.label}"</div>
          <div style={{fontSize:12,color:"#4a5568",marginBottom:14}}>Elegí la categoría destino:</div>
          <select className="inp" value={moveTarget} onChange={e=>setMoveTarget(e.target.value)} style={{marginBottom:16}}><option value="">— Elegir —</option>{localCats.filter(c=>c.id!==movingSub.catId).sort((a,b)=>alpha(a,b)).map(c=><option key={c.id} value={c.id}>{c.emoji} {c.label}</option>)}</select>
          <div style={{display:"flex",gap:10}}><button className="btn" onClick={()=>{setMovingSub(null);setMoveTarget("");}} style={{flex:1,background:"#1a2235",color:"#8b9ab0",padding:12}}>Cancelar</button><button className="btn" onClick={doMoveSub} style={{flex:1,background:"#3b82f6",color:"#fff",padding:12}} disabled={!moveTarget}>Mover</button></div>
        </div>
      </div>)}
      {[...localCats].sort((a,b)=>alpha(a,b)).map(cat=>(<div key={cat.id} className="card" style={{marginBottom:10,overflow:"hidden",borderTop:`3px solid ${cat.color}`}}>
        <div style={{padding:"14px 16px",display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>setOpenId(openId===cat.id?null:cat.id)}>
          <span style={{fontSize:20}}>{cat.emoji}</span><span style={{fontWeight:600,flex:1,color:"#e8eaf0"}}>{cat.label}</span><span style={{fontSize:12,color:"#4a5568"}}>{cat.subs.length} sub</span><span style={{color:"#4a5568",fontSize:13,marginLeft:4}}>{openId===cat.id?"▲":"▼"}</span>
        </div>
        {openId===cat.id&&(<div style={{padding:"0 16px 16px",borderTop:"1px solid #1a2235"}}>
          <CatEditFields cat={cat} onSave={(changes)=>askConfirm("¿Guardar cambios?",()=>save(localCats.map(c=>c.id===cat.id?{...c,...changes}:c)),"Guardar")}/>
          <div style={{marginTop:14}}>
            <div style={{fontSize:11,fontWeight:600,color:"#4a5568",textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Subcategorías</div>
            {[...cat.subs].sort((a,b)=>alpha(a,b)).map(sub=>(<SubEditRow key={sub.id} sub={sub} catColor={cat.color}
              onSave={(label)=>askConfirm("¿Guardar cambios?",()=>save(localCats.map(c=>c.id===cat.id?{...c,subs:c.subs.map(s=>s.id===sub.id?{...s,label}:s)}:c)),"Guardar")}
              onDelete={()=>deleteSub(cat.id,sub.id)} onMove={()=>{setMovingSub({catId:cat.id,subId:sub.id,label:sub.label});setMoveTarget("");}}/>))}
            <div style={{display:"flex",gap:8,marginTop:6}}><input className="inp" placeholder="+ Nueva subcategoría…" value={newSubInputs[cat.id]||""} onChange={e=>setNewSubInputs(f=>({...f,[cat.id]:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addSub(cat.id)} style={{flex:1,borderStyle:"dashed",padding:"8px 12px",fontSize:13}}/><button className="btn" onClick={()=>addSub(cat.id)} style={{background:cat.color,color:"#080c14",padding:"7px 14px",fontSize:14}}>+</button></div>
          </div>
          <button className="btn" onClick={()=>deleteCat(cat.id)} style={{marginTop:14,width:"100%",background:"#1a0a0a",color:"#ef4444",border:"1px solid #2d1212",padding:10,fontSize:13}}>Eliminar categoría</button>
        </div>)}
      </div>))}
    </div>);
  }

  function CatEditFields({cat,onSave}) {
    const [emoji,setEmoji]=useState(cat.emoji); const [label,setLabel]=useState(cat.label); const [color,setColor]=useState(cat.color);
    return (<div style={{marginTop:12}}>
      <div style={{display:"grid",gridTemplateColumns:"64px 1fr",gap:8}}>
        <div className="field"><label>Emoji</label><input className="inp" value={emoji} onChange={e=>setEmoji(e.target.value)} style={{textAlign:"center",fontSize:18,padding:"8px 4px"}}/></div>
        <div className="field"><label>Nombre</label><input className="inp" value={label} onChange={e=>setLabel(e.target.value)}/></div>
      </div>
      <div style={{marginTop:10}}><div style={{fontSize:11,fontWeight:600,color:"#4a5568",textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Color</div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{COLORS.map(c=><div key={c} onClick={()=>setColor(c)} style={{width:26,height:26,borderRadius:"50%",background:c,cursor:"pointer",border:color===c?"3px solid #fff":"3px solid transparent",transition:"all .15s"}}/>)}</div></div>
      <button className="btn" onClick={()=>onSave({emoji,label,color})} style={{marginTop:10,width:"100%",background:"#1a2235",color:"#93c5fd",padding:10,fontSize:13}}>Guardar cambios categoría</button>
    </div>);
  }

  function SubEditRow({sub,catColor,onSave,onDelete,onMove}) {
    const [label,setLabel]=useState(sub.label);
    return (<div style={{background:"#080c14",borderRadius:8,padding:"8px 10px",marginBottom:6}}>
      <input className="inp" value={label} onChange={e=>setLabel(e.target.value)} style={{marginBottom:6,padding:"7px 10px",fontSize:13}}/>
      <div style={{display:"flex",gap:6}}>
        <button className="btn" onClick={()=>onSave(label)} style={{flex:1,background:"#1a2235",color:"#93c5fd",padding:"6px 0",fontSize:12}}>Guardar</button>
        <button className="btn" onClick={onMove} style={{flex:1,background:"#1a2235",color:"#facc15",padding:"6px 0",fontSize:12}}>Mover</button>
        <button className="btn" onClick={onDelete} style={{flex:1,background:"#1a0a0a",color:"#ef4444",border:"1px solid #2d1212",padding:"6px 0",fontSize:12}}>Eliminar</button>
      </div>
    </div>);
  }

  // ── Mount ────────────────────────────────────────────────────────────────────
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App/>);

})();
</script>
</body>
</html>
