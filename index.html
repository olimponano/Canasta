  // ── StockCard ─────────────────────────────────────────────────────────────────
  function StockCard({p,cat,stock,stockTotal,mesesRestantes,fmtMeses,guardarStock,askConfirm,onOpen,onClose,colors}) {
    const [open,setOpen]=useState(false);
    const [showAddDim,setShowAddDim]=useState(false);
    const [newCantRef,setNewCantRef]=useState("");
    const [newMetros,setNewMetros]=useState("");

    const entradasGuardadas=stock[p.id]||[];
    const entradas=entradasGuardadas.length===0&&p.cantidadRef
      ?[{cantRef:p.cantidadRef,unidad:p.unidad||"gr",stock:0,virtual:true,rollosRef:p.rollosRef||null,metrosRef:p.metrosRef||null}]
      :entradasGuardadas;

    const total=stockTotal(p);
    const meses=mesesRestantes(p);
    const mesesTxt=fmtMeses(meses);
    const urgColor=meses===null?"#4a5568":meses===0?"#ef4444":meses<1?"#f97316":meses<2?"#facc15":"#4ade80";

    const handleOpen=()=>{const abriendo=!open;setOpen(abriendo);setShowAddDim(false);if(abriendo&&onOpen)onOpen();if(!abriendo&&onClose)onClose();};

    const fmtEntrada=(e)=>{
      if(e.rollosRef&&e.metrosRef) return `${e.rollosRef}x${e.metrosRef}${e.unidad||p.unidad||""}`;
      if(e.cantRef===p.cantidadRef) return fmtCantRef(p);
      return `${e.cantRef}${e.unidad||p.unidad||"gr"}`;
    };

    const cambiarStock=(idx,delta)=>{
      const base=entradasGuardadas.length===0&&p.cantidadRef
        ?[{cantRef:p.cantidadRef,unidad:p.unidad||"gr",stock:0,rollosRef:p.rollosRef||null,metrosRef:p.metrosRef||null}]
        :entradasGuardadas;
      const nuevas=base.map((e,i)=>i===idx?{...e,stock:Math.max(0,e.stock+delta)}:e);
      guardarStock(p.id,nuevas);
    };

    const eliminarEntrada=(idx)=>{
      const nuevas=entradasGuardadas.filter((_,i)=>i!==idx);
      guardarStock(p.id,nuevas);
    };

    const agregarDimension=()=>{
      let cant, display=null;
      if(p.unidad==="m"){
        const r=parseFloat(newCantRef)||0;
        const m=parseFloat(newMetros)||0;
        cant=r*m;
        if(r>0&&m>0) display=`${r}x${m}`;
      } else {
        cant=parseFloat(newCantRef.replace(",","."));
      }
      if(!cant||cant<=0)return;
      if(entradasGuardadas.find(e=>e.cantRef===cant))return;
      const base=entradasGuardadas.length===0&&p.cantidadRef
        ?[{cantRef:p.cantidadRef,unidad:p.unidad||"gr",stock:0,rollosRef:p.rollosRef||null,metrosRef:p.metrosRef||null}]
        :entradasGuardadas;
      const nuevas=[...base,{cantRef:cant,unidad:p.unidad||"gr",stock:0,display}];
      guardarStock(p.id,nuevas);
      setNewCantRef("");setNewMetros("");setShowAddDim(false);
    };

    const fmtTotal=(t)=>{const r=Math.round(t*100)/100;return r===Math.round(r)?String(Math.round(r)):r.toLocaleString("es-AR");};

    return (
      <div className="card" style={{borderLeft:`3px solid ${cat?.color||"#444"}`,overflow:"hidden"}}>
        <div style={{padding:"13px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}} onClick={handleOpen}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600,fontSize:15,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",color:colors.text}}>{p.nombre}</div>
            <div style={{fontSize:12,color:colors.textMuted,marginTop:2}}>{p.marca||"—"}{p.cantidadRef&&<span style={{marginLeft:6,color:colors.textMuted}}>{fmtCantRef(p)}</span>}</div>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontSize:12,color:colors.textMuted}}>Stock: <span className="mono" style={{fontWeight:700,fontSize:16,color:colors.text}}>{fmtTotal(total)}</span></div>
            <div style={{fontSize:12,fontWeight:600,color:urgColor,marginTop:2}}>{mesesTxt}</div>
          </div>
          <div style={{color:colors.hoverCard,fontSize:14,marginLeft:4}}>{open?"▲":"▼"}</div>
        </div>

        {open&&(
          <div style={{borderTop:`1px solid ${colors.cardBorder}`,padding:"12px 16px",display:"flex",flexDirection:"column",gap:10}}>
            {entradas.map((e,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{flex:1,fontSize:14,fontWeight:600,color:colors.text}}>{fmtEntrada(e)}</div>
                <button onClick={()=>cambiarStock(i,-1)} disabled={e.stock<=0} style={{width:34,height:34,borderRadius:8,background:e.stock<=0?"#0d1321":"#1a2235",border:`1px solid ${colors.hoverCard}`,color:e.stock<=0?"#2a3570":"#e8eaf0",fontSize:20,cursor:e.stock<=0?"default":"pointer",fontFamily:"inherit",fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
                <div style={{width:32,textAlign:"center",fontFamily:"'DM Mono',monospace",fontWeight:700,fontSize:16,color:colors.text}}>{e.stock}</div>
                <button onClick={()=>cambiarStock(i,1)} style={{width:34,height:34,borderRadius:8,background:colors.btnSecondary,border:`1px solid ${colors.hoverCard}`,color:colors.text,fontSize:20,cursor:"pointer",fontFamily:"inherit",fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
                {!e.virtual&&entradasGuardadas.length>1&&<button onClick={()=>askConfirm("¿Eliminar esta medida?",()=>eliminarEntrada(i),"Eliminar","#ef4444")} style={{width:28,height:28,borderRadius:6,background:"#1a0a0a",border:"1px solid #2d1212",color:colors.error,fontSize:13,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>}
              </div>
            ))}

            {entradasGuardadas.length>1&&p.cantidadRef&&(
              <div style={{fontSize:12,color:colors.textMuted,borderTop:`1px solid ${colors.cardBorder}`,paddingTop:8}}>
                Total: <span style={{color:colors.text,fontWeight:600,fontFamily:"'DM Mono',monospace"}}>{fmtTotal(total)}</span> × {fmtCantRef(p)}
              </div>
            )}

            {!showAddDim&&(
              <button className="btn" onClick={()=>setShowAddDim(true)} style={{background:colors.card,border:"1px dashed #2a3550",color:colors.textMuted,padding:"7px 0",fontSize:13}}>
                + Agregar otra medida
              </button>
            )}
            {showAddDim&&(p.unidad==="m"?(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="3" value={newCantRef} onChange={e=>setNewCantRef(e.target.value)} style={{width:52,padding:"8px 8px",fontSize:14,textAlign:"center"}} autoFocus/>
                  <span style={{fontSize:12,color:colors.textMuted,flexShrink:0}}>rollos ×</span>
                  <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="40" value={newMetros} onChange={e=>setNewMetros(e.target.value)} style={{width:52,padding:"8px 8px",fontSize:14,textAlign:"center"}}/>
                  <span style={{fontSize:12,color:colors.textMuted,flexShrink:0}}>m</span>
                  <button className="btn" onClick={agregarDimension} style={{background:colors.accent,color:"#fff",padding:"8px 12px",fontSize:14}}>+</button>
                  <button className="btn" onClick={()=>{setShowAddDim(false);setNewCantRef("");setNewMetros("");}} style={{background:colors.btnSecondary,color:colors.textSecondary,padding:"8px 10px",fontSize:14}}>✕</button>
                </div>
                {parseFloat(newCantRef)>0&&parseFloat(newMetros)>0&&<div style={{fontSize:11,color:colors.textMuted}}>= <span style={{color:colors.accent,fontWeight:600}}>{parseFloat(newCantRef)*parseFloat(newMetros)} m</span> en total</div>}
              </div>
            ):(
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. 1500" value={newCantRef} onChange={e=>setNewCantRef(e.target.value)}
                  style={{flex:1,padding:"8px 12px",fontSize:14}} autoFocus
                  onKeyDown={e=>e.key==="Enter"&&agregarDimension()}/>
                <span style={{fontSize:13,color:colors.textMuted,whiteSpace:"nowrap"}}>{p.unidad||"gr"}</span>
                <button className="btn" onClick={agregarDimension} style={{background:colors.accent,color:"#fff",padding:"8px 14px",fontSize:14}}>+</button>
                <button className="btn" onClick={()=>{setShowAddDim(false);setNewCantRef("");}} style={{background:colors.btnSecondary,color:colors.textSecondary,padding:"8px 10px",fontSize:14}}>✕</button>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  // ── ComprasCard ───────────────────────────────────────────────────────────────
  function ComprasCard({p,cat,stock,stockTotal,mesesRestantes,fmtMeses,push,colors}) {
    const total=stockTotal(p);
    const meses=mesesRestantes(p);
    const mesesTxt=fmtMeses(meses);
    const urgColor=meses===null?"#4a5568":meses===0?"#ef4444":meses<1?"#f97316":meses<2?"#facc15":"#4ade80";
    const hist=p.historialCompra||[];
    const ultimoPrecio=hist.length>0?hist[hist.length-1].precio:null;
    const fmtTotal=(t)=>{const r=Math.round(t*100)/100;return r===Math.round(r)?String(Math.round(r)):r.toLocaleString("es-AR");};
    return (
      <div className="card" style={{padding:"13px 16px",borderLeft:`3px solid ${cat?.color||"#444"}`}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600,fontSize:15,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",color:colors.text}}>{p.nombre}</div>
            <div style={{fontSize:12,color:colors.textMuted,marginTop:2}}>{p.marca||"—"}{p.cantidadRef&&<span style={{marginLeft:6}}>{fmtCantRef(p)}</span>}</div>
            <div style={{marginTop:6,display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
              <span style={{fontSize:12,fontWeight:600,color:urgColor}}>{mesesTxt}</span>
              <span style={{fontSize:11,color:colors.textMuted}}>· Stock: <span style={{color:colors.text,fontWeight:600,fontFamily:"'DM Mono',monospace"}}>{fmtTotal(total)}</span></span>
            </div>
            <div style={{marginTop:4,display:"flex",gap:10,alignItems:"center"}}>
              {p.precioRef&&<span style={{fontSize:12,color:colors.textMuted}}>Ref: <span style={{color:cat?.color||"#3b82f6",fontWeight:700,fontFamily:"'DM Mono',monospace"}}>{fmt(p.precioRef)}</span></span>}
              {ultimoPrecio&&<span style={{fontSize:12,color:colors.textMuted}}>Último: <span style={{color:colors.text,fontWeight:700,fontFamily:"'DM Mono',monospace"}}>{fmt(ultimoPrecio)}</span></span>}
            </div>
          </div>
          <button onClick={()=>push("nuevo-precio",{prodId:p.id})} style={{width:36,height:36,borderRadius:10,background:colors.accent,border:"none",color:"#fff",fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:600,lineHeight:1,flexShrink:0}}>+</button>
        </div>
      </div>
    );
  }

  // ── PriceChart (SVG puro) ──────────────────────────────────────────────────
  // hist: [{fecha,precio,ref}] — ref es el Ref que tenía el producto en esa fecha (puede ser null)
  function PriceChart({hist, precioRef, clr, colors}) {
    const W=320, H=150, PL=52, PR=20, PT=14, PB=28;
    const iW=W-PL-PR, iH=H-PT-PB;
    if (!hist||hist.length<1) return null;
    const prices=hist.map(h=>h.precio);
    const refs=hist.map(h=>h.ref!==undefined?h.ref:precioRef);
    const allVals=[...prices,...refs.filter(v=>v!=null),...(precioRef?[precioRef]:[])];
    const minV=Math.min(...allVals)*0.93;
    const maxV=Math.max(...allVals)*1.07;
    const range=maxV-minV||1;
    const toX=(i)=>PL+(hist.length===1?iW/2:(i/(hist.length-1))*iW);
    const toY=(v)=>PT+(1-(v-minV)/range)*iH;
    const refY=precioRef!=null?toY(precioRef):null;
    // Línea del Ref: escalonada, sigue los cambios por inflación; termina en el Ref de hoy
    const refPts=[];
    hist.forEach((h,i)=>{const r=refs[i];if(r==null)return;const x=toX(i);
      if(!refPts.length)refPts.push([hist.length===1?PL:x,toY(r)]);
      else{refPts.push([x,refPts[refPts.length-1][1]]);refPts.push([x,toY(r)]);}
    });
    if(refY!=null){
      if(!refPts.length)refPts.push([PL,refY]);
      const lastX=hist.length===1?PL:toX(hist.length-1);
      if(refPts[refPts.length-1][0]<lastX)refPts.push([lastX,refPts[refPts.length-1][1]]);
      refPts.push([W-PR,refPts[refPts.length-1][1]]);
      if(Math.abs(refPts[refPts.length-1][1]-refY)>0.5)refPts.push([W-PR,refY]);
    }
    const pts=hist.map((h,i)=>`${toX(i).toFixed(1)},${toY(h.precio).toFixed(1)}`).join(" ");
    const yTicks=[minV,(minV+maxV)/2,maxV];
    const successColor=colors.success;
    const errorColor=colors.error;
    return (
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:"visible",display:"block"}}>
        {yTicks.map((v,i)=>[
          <line key={"g"+i} x1={PL} y1={toY(v)} x2={W-PR} y2={toY(v)} stroke={colors.cardBorder} strokeWidth={1}/>,
          <text key={"t"+i} x={PL-4} y={toY(v)+4} textAnchor="end" fontSize={9} fill={colors.textMuted}>${Math.round(v)}</text>
        ])}
        {refPts.length>1&&(
          <polyline points={refPts.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(" ")} fill="none" stroke={clr} strokeWidth={1.5} strokeDasharray="6 4" opacity={0.7}/>
        )}
        {refY!=null&&(
          <text x={W-PR+2} y={refY+4} fontSize={9} fill={clr} opacity={0.8}>ref</text>
        )}
        {hist.length>1&&<polyline points={pts} fill="none" stroke={successColor} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>}
        {hist.map((h,i)=>{
          const x=toX(i), y=toY(h.precio);
          const rr=refs[i];
          const dotColor=rr!=null?(h.precio>rr?errorColor:successColor):successColor;
          const lblY=y>PT+20?y-8:y+16;
          const show=hist.length<=6||i===0||i===hist.length-1||i%Math.ceil(hist.length/5)===0;
          return (
            <g key={i}>
              <circle cx={x} cy={y} r={5} fill={dotColor} stroke={colors.inputBg} strokeWidth={1.5}/>
              {show&&<text x={x} y={lblY} textAnchor="middle" fontSize={9} fill={dotColor}>{fmt(h.precio)}</text>}
              <text x={x} y={H} textAnchor="middle" fontSize={8} fill={colors.textMuted}>{h.fecha?h.fecha.slice(5):""}</text>
            </g>
          );
        })}
      </svg>
    );
  }

  // ── DetalleScreen ─────────────────────────────────────────────────────────────
  function DetalleScreen({prodId,productos,guardar,pop,showToast,askConfirm,push,gastoMensual,getCat,getSub,colors,refEnMes,inflacion,listas,agregarALista,crearLista}) {
    const [listaModal,setListaModal]=useState(false);
    const p=productos.find(x=>x.id===prodId); if(!p) return null;
    const cat=getCat(p.catId); const sub=p.subId?getSub(p.catId,p.subId):null;
    const gm=gastoMensual(p); const clr=cat?.color||"#3b82f6";
    const hist=p.historialCompra||[];
    const chartData=hist.map(h=>{
      let precioGrafico=h.equivalente||null;
      if(!precioGrafico&&h.cantidad&&p.cantidadRef){
        const cantNum=parseFloat(String(h.cantidad).replace(",","."));
        if(cantNum>0) precioGrafico=(h.precio/cantNum)*p.cantidadRef;
      }
      return {fecha:fmtDate(h.fecha),precio:precioGrafico||h.precio,ref:refEnMes?refEnMes(p,mesDeFecha(h.fecha)):undefined};
    });
    const infPct=p.precioRefBase&&p.precioRef&&p.precioRef!==p.precioRefBase?(p.precioRef/p.precioRefBase-1)*100:null;
    const variacion=hist.length>=2?((hist[hist.length-1].precio-hist[0].precio)/hist[0].precio*100).toFixed(1):null;
    const del=()=>askConfirm(`¿Eliminar "${p.nombre}"?`,async()=>{await guardar(null,productos.filter(x=>x.id!==prodId),{deleteRemoved:true});showToast("🗑️ Eliminado");pop();},"Eliminar","#ef4444");
    const delH=(hid)=>askConfirm("¿Eliminar este registro?",async()=>{await guardar(null,productos.map(x=>x.id===prodId?{...x,historialCompra:x.historialCompra.filter(h=>h.id!==hid)}:x));showToast("Eliminado");},"Eliminar","#ef4444");
    return (<div className="fade">
      <TopBar colors={colors} title={p.nombre} subtitle={[cat?.label,sub?.label].filter(Boolean).join(" › ")} onBack={pop}
        right={<div style={{display:"flex",gap:8}}>
          <button className="btn" onClick={()=>push("editar-prod",{prodId})} style={{background:colors.btnSecondary,color:colors.accent,border:`1px solid ${colors.hoverCard}`,padding:"8px 12px",fontSize:13}}>Editar</button>
          <button className="btn" onClick={del} style={{background:colors.errorBg,color:colors.error,border:`1px solid ${colors.errorBorder}`,padding:"8px 12px",fontSize:13}}>Eliminar</button>
        </div>}/>
      <div className="card" style={{padding:20,marginBottom:12,borderLeft:`4px solid ${clr}`}}>
        <div style={{display:"flex",gap:14}}>
          <div style={{fontSize:34}}>{cat?.emoji}</div>
          <div style={{flex:1}}><div style={{fontWeight:700,fontSize:19,color:colors.text}}>{p.nombre}</div><div style={{fontSize:13,color:colors.textMuted,marginTop:2}}>{p.marca||"—"}</div><div style={{marginTop:8}}><span style={{background:clr+"22",color:clr,borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:600}}>{cat?.label}{sub?` › ${sub.label}`:""}</span></div></div>
          {p.cantidadRef&&<div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:18,fontWeight:700,color:colors.text}}>{fmtCantRef(p)}</div></div>}
        </div>
        <div style={{marginTop:16,background:colors.inputBg,borderRadius:12,padding:"14px 16px"}}>
          <div style={{fontSize:11,color:colors.textMuted,marginBottom:8,textTransform:"uppercase",letterSpacing:".06em",fontWeight:600}}>Precio de referencia</div>
          <div className="mono" style={{fontSize:28,fontWeight:700,color:clr}}>{p.precioRef?fmt(p.precioRef):"—"}</div>
          {p.precioRef!=null&&p.precioRefMes&&<div style={{fontSize:12,color:colors.textMuted,marginTop:4}}>
            {infPct!=null
              ?<>Base {fmt(p.precioRefBase)} en {fmtMes(p.precioRefMes,true)} · <span style={{color:colors.warning,fontWeight:600}}>+{infPct.toLocaleString("es-AR",{maximumFractionDigits:1})}% inflación</span></>
              :<>Cargado en {fmtMes(p.precioRefMes,true)}{Object.keys(inflacion||{}).some(k=>ES_MES.test(k))?" · sin inflación aplicada todavía":""}</>}
          </div>}
          {p.precioRef&&p.unidadesMes&&(<div style={{display:"flex",alignItems:"center",gap:6,marginTop:10,padding:"9px 12px",background:colors.card,borderRadius:8}}>
            <span className="mono" style={{fontSize:14,color:colors.textSecondary,fontWeight:500}}>{fmtU(p.unidadesMes)}</span>
            <span style={{fontSize:13,color:colors.textMuted}}>u/mes</span>
            <span style={{fontSize:14,color:colors.textMuted,fontWeight:700}}>=</span>
            <span className="mono" style={{fontSize:15,fontWeight:700,color:clr}}>{fmt(gm)}</span>
          </div>)}
        </div>
        {variacion!==null&&<div style={{marginTop:10,fontSize:12,color:parseFloat(variacion)>0?"#ef4444":"#10b981"}}>{parseFloat(variacion)>0?"▲":"▼"} {Math.abs(variacion)}% desde el primer registro</div>}
      </div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <button className="btn" onClick={()=>push("nuevo-precio",{prodId})} style={{flex:2,background:clr,color:"#080c14",padding:13,fontSize:14}}>+ Registrar precio de compra</button>
        <button className="btn" onClick={()=>setListaModal(true)} style={{flex:1,background:colors.btnSecondary,color:colors.text,border:`1px solid ${colors.hoverCard}`,padding:13,fontSize:14}}>📝 A lista</button>
      </div>
      {listaModal&&<AgregarAListaModal colors={colors} listas={listas||[]} cantidad={1} onClose={()=>setListaModal(false)}
        onElegir={async(id,nombreNueva)=>{
          const n=id?await agregarALista(id,[p]):(await crearLista(nombreNueva,[p]),1);
          setListaModal(false);
          showToast(n?"📝 Agregado a la lista":"Ya estaba en la lista");
        }}/>}
      {hist.length>=1&&(
      <div className="card" style={{padding:"18px 12px 10px",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:8,paddingLeft:4,color:colors.text}}>Evolución del precio de compra</div>
        <PriceChart hist={chartData} precioRef={p.precioRef} clr={clr} colors={colors}/>
      </div>
    )}
      {hist.length>0&&(<div className="card" style={{padding:16}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:12,color:colors.text}}>Historial de precios de compra</div>
        {[...hist].reverse().map((h,i)=>(<div key={h.id} style={{padding:"10px 0",borderBottom:i<hist.length-1?"1px solid #1a2235":"none"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"baseline",gap:8}}><div className="mono" style={{fontWeight:700,fontSize:16,color:colors.text}}>{fmt(h.precio)}</div>{h.cantidad&&p.unidad&&<div style={{fontSize:12,color:colors.textMuted}}>{h.cantidad}{p.unidad}</div>}</div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginTop:3,flexWrap:"wrap"}}>
                <div style={{fontSize:11,color:colors.textMuted}}>{fmtDate(h.fecha)}</div>
                {h.equivalente!=null&&p.cantidadRef&&(<div style={{fontSize:11,color:clr}}>≈ {fmt(h.equivalente)} por {fmtCantRef(p)}</div>)}
              </div>
            </div>
            <button className="btn" onClick={()=>delH(h.id)} style={{background:colors.errorBg,color:colors.error,border:`1px solid ${colors.errorBorder}`,padding:"5px 10px",fontSize:12}}>✕</button>
          </div>
        </div>))}
      </div>)}
    </div>);
  }

  // ── CantidadRefField ──────────────────────────────────────────────────────────
  function CantidadRefField({unidad, cantidadRef, rollosRef, metrosRef, onChange, colors}) {
    const initRollos = rollosRef ? String(rollosRef) : "";
    const initMetros = metrosRef ? String(metrosRef) : "";
    const [rollos, setRollos] = useState(initRollos);
    const [metros, setMetros] = useState(initMetros);

    const handleRollos=(v)=>{
      setRollos(v);
      const r=parseFloat(v)||0, m=parseFloat(metros)||0, total=r*m;
      onChange({valor:total>0?total:null, rollosRef:r>0?r:null, metrosRef:m>0?m:null});
    };
    const handleMetros=(v)=>{
      setMetros(v);
      const r=parseFloat(rollos)||0, m=parseFloat(v)||0, total=r*m;
      onChange({valor:total>0?total:null, rollosRef:r>0?r:null, metrosRef:m>0?m:null});
    };

    if(unidad==="m"){
      const r=parseFloat(rollos)||0;
      const m=parseFloat(metros)||0;
      const total=r*m;
      return (
        <div>
          <label style={{display:"block",fontSize:12,color:colors.textSecondary,marginBottom:6,fontWeight:600}}>Cantidad ref.</label>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="3" value={rollos} onChange={e=>handleRollos(e.target.value)} style={{width:52,padding:"9px 8px",textAlign:"center"}}/>
            <span style={{fontSize:12,color:colors.textMuted,flexShrink:0}}>×</span>
            <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="40" value={metros} onChange={e=>handleMetros(e.target.value)} style={{width:52,padding:"9px 8px",textAlign:"center"}}/>
            <span style={{fontSize:12,color:colors.textMuted,flexShrink:0}}>m</span>
          </div>
          {total>0&&<div style={{fontSize:11,color:colors.textMuted,marginTop:4}}>= <span style={{color:colors.accent,fontWeight:600}}>{total} m</span> en total</div>}
        </div>
      );
    }
    return (
      <div className="field">
        <label>Cantidad ref.</label>
        <input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. 300" value={cantidadRef!=null?String(cantidadRef):""} onChange={e=>onChange({valor:e.target.value,display:null})}/>
      </div>
    );
  }

  // ── EditarProdScreen ──────────────────────────────────────────────────────────
  function EditarProdScreen({prodId,cats,productos,guardar,pop,showToast,askConfirm,colors}) {
    const pOrig=productos.find(x=>x.id===prodId);
    const p=productos.find(x=>x.id===prodId); if(!p) return null;
    const [form,setForm]=useState({nombre:p.nombre,marca:p.marca||"",catId:p.catId,subId:p.subId||"",unidadesMes:p.unidadesMes!=null?String(p.unidadesMes):"",precioRef:p.precioRef!=null?String(p.precioRef):"",cantidadRef:p.cantidadRef,rollosRef:p.rollosRef||null,metrosRef:p.metrosRef||null,unidad:p.unidad||"gr"});
    const [showAddSub,setShowAddSub]=useState(false);
    const selCat=cats.find(c=>c.id===form.catId);
    const createSub=async(label)=>{const ns={id:uid(),label:label.trim()};await guardar(cats.map(c=>c.id===form.catId?{...c,subs:[...c.subs,ns]}:c),null);setForm(f=>({...f,subId:ns.id}));setShowAddSub(false);showToast("✅ Subcategoría creada");};
    const submit=()=>askConfirm("¿Guardar los cambios?",async()=>{
      if(!form.nombre.trim())return showToast("El nombre es obligatorio","err");
      const pr=form.precioRef?parseFloat(String(form.precioRef).replace(",",".")):null;
      const um=form.unidadesMes?parseFrac(form.unidadesMes):null;
      const cr=form.cantidadRef!=null?parseFloat(form.cantidadRef):null;
      await guardar(null,productos.map(x=>x.id===prodId?{...x,...form,precioRef:pr,unidadesMes:um,cantidadRef:cr,rollosRef:form.rollosRef||null,metrosRef:form.metrosRef||null,subId:form.subId||null}:x));
      showToast("✅ Guardado");pop();
    },"Guardar cambios");
    return (<div className="fade"><TopBar colors={colors} title="Editar producto" subtitle={p.nombre} onBack={pop}/>
      <div className="card" style={{padding:20,display:"flex",flexDirection:"column",gap:14}}>
        <div className="field"><label>Nombre</label><input type="search" autoComplete="canasta-field-ignore" className="inp" value={form.nombre} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))}/></div>
        <div className="field"><label>Marca / detalle</label><input type="search" autoComplete="canasta-field-ignore" className="inp" value={form.marca} onChange={e=>setForm(f=>({...f,marca:e.target.value}))}/></div>
        <div className="field"><label>Categoría</label><select className="inp" value={form.catId} onChange={e=>setForm(f=>({...f,catId:e.target.value,subId:""}))}>
          {[...cats].sort((a,b)=>alpha(a,b)).map(c=><option key={c.id} value={c.id}>{c.emoji} {c.label}</option>)}</select></div>
        <div className="field"><label>Subcategoría</label>
          <div style={{display:"flex",gap:8}}>
            <select className="inp" value={form.subId} onChange={e=>setForm(f=>({...f,subId:e.target.value}))} style={{flex:1}}>
              <option value="">— Sin subcategoría —</option>{[...(selCat?.subs||[])].sort((a,b)=>alpha(a,b)).map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
            </select>
            <button className="btn" onClick={()=>setShowAddSub(true)} style={{background:selCat?.color||"#3b82f6",color:"#fff",padding:"9px 14px",fontSize:18,flexShrink:0}}>+</button>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div className="field"><label>Unidades/mes</label><input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. 2 o 1/3" value={form.unidadesMes} onChange={e=>setForm(f=>({...f,unidadesMes:e.target.value}))}/></div>
          <div className="field"><label>Precio ref. ($)</label><input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. 1200" value={form.precioRef} onChange={e=>setForm(f=>({...f,precioRef:e.target.value}))}/>{pOrig&&pOrig.precioRefBase!=null&&pOrig.precioRef!==pOrig.precioRefBase&&<div style={{fontSize:11.5,color:colors.textMuted,marginTop:5,lineHeight:1.4}}>Incluye inflación desde {fmtMes(pOrig.precioRefMes,true)} (base {fmt(pOrig.precioRefBase)}). Si lo cambiás, pasa a ser el nuevo precio base desde este mes.</div>}</div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <CantidadRefField unidad={form.unidad} cantidadRef={form.cantidadRef} rollosRef={form.rollosRef} metrosRef={form.metrosRef} onChange={({valor,rollosRef,metrosRef})=>setForm(f=>({...f,cantidadRef:valor,rollosRef:rollosRef||null,metrosRef:metrosRef||null}))} colors={colors}/>
          <div className="field"><label>Unidad</label><select className="inp" value={form.unidad} onChange={e=>setForm(f=>({...f,unidad:e.target.value,cantidadRef:null,rollosRef:null,metrosRef:null}))}>
            <option value="gr">gr</option><option value="kg">kg</option><option value="mL">mL</option><option value="L">L</option><option value="m">m</option><option value="un">un</option></select></div>
        </div>
        <div style={{display:"flex",gap:10,marginTop:4}}>
          <button className="btn" onClick={pop} style={{flex:1,background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.text,padding:13}}>Cancelar</button>
          <button className="btn" onClick={submit} style={{flex:2,background:colors.accent,color:"#fff",padding:13,fontSize:15}}>Guardar cambios</button>
        </div>
      </div>
      {showAddSub&&<AddModal colors={colors} title={`Nueva subcategoría en ${selCat?.label}`} namePlaceholder="ej. Personal" onClose={()=>setShowAddSub(false)} onSave={({label})=>createSub(label)} showColor={false} accentColor={selCat?.color||"#3b82f6"}/>}
    </div>);
  }

  // ── NuevoProdScreen ───────────────────────────────────────────────────────────
  function NuevoProdScreen({cats,initCatId,initSubId,productos,guardar,pop,showToast,desdeCompras,agregarAlTicket,colors}) {
    const [form,setForm]=useState({
      nombre:"",marca:"",
      catId:initCatId||"", // sin default
      subId:initSubId&&initSubId!==UNASSIGNED_ID?initSubId:"",
      unidadesMes:"1",precioRef:"",cantidadRef:null,rollosRef:null,metrosRef:null,unidad:"gr"
    });
    const [showAddCat,setShowAddCat]=useState(false);
    const [showAddSub,setShowAddSub]=useState(false);

    const selCat=cats.find(c=>c.id===form.catId);

    const createCat=async({label,emoji,color})=>{
      const nc={id:uid(),label,emoji,color,subs:[]};
      await guardar([...cats,nc],null);
      setForm(f=>({...f,catId:nc.id,subId:""}));
      setShowAddCat(false);
      showToast("✅ Categoría creada");
    };

    const createSub=async(label)=>{
      const ns={id:uid(),label:label.trim()};
      await guardar(cats.map(c=>c.id===form.catId?{...c,subs:[...c.subs,ns]}:c),null);
      setForm(f=>({...f,subId:ns.id}));
      setShowAddSub(false);
      showToast("✅ Subcategoría creada");
    };

    const submit=async()=>{
      if(!form.nombre.trim()||!form.marca.trim()) return showToast("Nombre y marca son obligatorios","err");
      if(!form.catId) return showToast("Elegí una categoría","err");
      const pr=form.precioRef?parseFloat(String(form.precioRef).replace(",",".")):null;
      const um=form.unidadesMes?parseFrac(form.unidadesMes):null;
      const cr=form.cantidadRef!=null?parseFloat(form.cantidadRef):null;
      const nuevoProd={...form,precioRef:pr,unidadesMes:um,cantidadRef:cr,rollosRef:form.rollosRef||null,metrosRef:form.metrosRef||null,id:uid(),historialCompra:[],subId:form.subId||null};
      await guardar(null,[...productos,nuevoProd]);
      if(desdeCompras&&agregarAlTicket&&pr){
        agregarAlTicket({
          prodId:nuevoProd.id,nombre:nuevoProd.nombre,marca:nuevoProd.marca,cantRef:cr,rollosRef:nuevoProd.rollosRef,metrosRef:nuevoProd.metrosRef,
          unidad:nuevoProd.unidad,precio:pr,equivalente:pr,precioRef:pr,fecha:todayISO(),
          cantComprada:1,totalPagado:pr,totalRef:pr
        });
      }
      showToast("✅ Producto creado");pop();
    };

    return (<div className="fade">
      <div style={{height:20}}/>
      <div className="card" style={{padding:20,display:"flex",flexDirection:"column",gap:14}}>
        <div style={{fontWeight:700,fontSize:18,color:colors.text,marginBottom:2}}>Nuevo producto</div>
        <div className="field"><label>Nombre</label><input type="search" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. Leche entera" value={form.nombre} onChange={e=>setForm(f=>({...f,nombre:e.target.value}))}/></div>
        <div className="field"><label>Marca / detalle</label><input type="search" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. La Serenísima" value={form.marca} onChange={e=>setForm(f=>({...f,marca:e.target.value}))}/></div>

        {/* Categoría con botón + */}
        <div className="field"><label>Categoría</label>
          <div style={{display:"flex",gap:8}}>
            <select className="inp" value={form.catId} onChange={e=>setForm(f=>({...f,catId:e.target.value,subId:""}))} style={{flex:1}}>
              <option value="">— Elegir categoría —</option>
              {[...cats].sort((a,b)=>alpha(a,b)).map(c=><option key={c.id} value={c.id}>{c.emoji} {c.label}</option>)}
            </select>
            <button className="btn" onClick={()=>setShowAddCat(true)} style={{background:colors.accent,color:"#fff",padding:"9px 14px",fontSize:18,flexShrink:0}}>+</button>
          </div>
        </div>

        {/* Subcategoría con botón + */}
        <div className="field"><label>Subcategoría</label>
          <div style={{display:"flex",gap:8}}>
            <select className="inp" value={form.subId} onChange={e=>setForm(f=>({...f,subId:e.target.value}))} disabled={!form.catId} style={{flex:1,opacity:form.catId?1:0.4}}>
              <option value="">— Sin subcategoría —</option>
              {[...(selCat?.subs||[])].sort((a,b)=>alpha(a,b)).map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
            </select>
            <button className="btn" onClick={()=>form.catId&&setShowAddSub(true)} style={{background:form.catId?(selCat?.color||"#3b82f6"):"#1a2235",color:form.catId?"#fff":"#4a5568",padding:"9px 14px",fontSize:18,flexShrink:0,cursor:form.catId?"pointer":"default"}}>+</button>
          </div>
        </div>

        {/* Modal agregar subcategoría */}
        {showAddSub&&<AddModal colors={colors} title={`Nueva subcategoría en ${selCat?.label}`} namePlaceholder="ej. Personal" onClose={()=>setShowAddSub(false)} onSave={({label})=>createSub(label)} showColor={false} accentColor={selCat?.color||"#3b82f6"}/>}

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div className="field"><label>Unidades/mes</label><input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. 2 o 1/3" value={form.unidadesMes} onChange={e=>setForm(f=>({...f,unidadesMes:e.target.value}))}/></div>

  // ── NuevoPrecioScreen ─────────────────────────────────────────────────────────
  function NuevoPrecioScreen({prodId,productos,guardar,pop,showToast,getCat,colors}) {
    const p=productos.find(x=>x.id===prodId); if(!p) return null;
    const cat=getCat(p.catId); const clr=cat?.color||"#3b82f6";
    const cantRef=p.cantidadRef||null; const unidad=p.unidad||"gr";
    const [form,setForm]=useState({precio:"",cantidad:"",fecha:todayISO()});
    const [saving,setSaving]=useState(false);
    useEffect(()=>{if(cantRef)setForm(f=>({...f,cantidad:String(cantRef)}));},[]);
    const precio=parseFloat((form.precio||"").replace(",","."));
    const cantidadNum=unidad==="m"||unidad==="un"?parseQty(form.cantidad):parseFloat((form.cantidad||"").replace(",","."));
    const cantRefNum=unidad==="m"||unidad==="un"?parseQty(String(cantRef||"")):cantRef;
    const equivalente=(precio>0&&cantidadNum>0&&cantRefNum)?(precio/cantidadNum)*cantRefNum:null;
    const diff=(equivalente!=null&&p.precioRef)?((equivalente-p.precioRef)/p.precioRef*100):null;
    const submit=async()=>{
      if(!precio||precio<=0)return showToast("Precio inválido","err");
      setSaving(true);
      try {
        const entrada={id:uid(),precio,cantidad:form.cantidad||null,equivalente,fecha:form.fecha};
        await guardar(null,productos.map(x=>x.id===prodId?{...x,historialCompra:[...(x.historialCompra||[]),entrada].sort((a,b)=>a.fecha.localeCompare(b.fecha))}:x));
        showToast("✅ Precio registrado");
        pop();
      } catch(e) {
        showToast("Error al guardar","err");
      } finally {
        setSaving(false);
      }
    };
    return (<div className="fade"><TopBar colors={colors} title="Precio de compra" subtitle={`${p.nombre} · ${p.marca||""}`} onBack={pop}/>
      <div className="card" style={{padding:20,display:"flex",flexDirection:"column",gap:14}}>
        <div style={{background:clr+"15",borderRadius:10,padding:"10px 14px",fontSize:13,color:colors.textSecondary}}>Precio de referencia: <span style={{color:clr,fontWeight:700}}>{p.precioRef?fmt(p.precioRef):"no definido"}</span>{cantRef&&<span style={{marginLeft:8,color:colors.textMuted}}>· {cantRef}{unidad}</span>}</div>
        <div className="field"><label>Precio que pagué ($)</label><input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder="ej. 1200" value={form.precio} onChange={e=>setForm(f=>({...f,precio:e.target.value}))} autoFocus/></div>
        <div className="field"><label>Cantidad comprada ({unidad})</label><input type="text" inputMode="decimal" autoComplete="canasta-field-ignore" className="inp" placeholder={cantRef?String(cantRef):unidad==="m"?"ej. 6x50":unidad==="un"?"ej. 50":"ej. 100"} value={form.cantidad} onChange={e=>setForm(f=>({...f,cantidad:e.target.value}))}/></div>
        {equivalente!=null&&(<div style={{background:colors.inputBg,borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:11,color:colors.textMuted,marginBottom:6,textTransform:"uppercase",letterSpacing:".06em",fontWeight:600}}>Equivalente a {cantRef}{unidad}</div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div className="mono" style={{fontSize:22,fontWeight:700,color:clr}}>{fmt(equivalente)}</div>
            {diff!=null&&(<div style={{fontSize:13,fontWeight:600,color:diff>0?"#ef4444":"#10b981",background:diff>0?"#ef444418":"#10b98118",padding:"3px 10px",borderRadius:6}}>{diff>0?"▲":"▼"} {Math.abs(diff).toFixed(1)}% {diff>0?"más caro":"más barato"}</div>)}
          </div>
        </div>)}
        <div className="field"><label>Fecha</label><input className="inp" type="date" value={form.fecha} onChange={e=>setForm(f=>({...f,fecha:e.target.value}))}/></div>
        <div style={{display:"flex",gap:10,marginTop:4}}>
          <button className="btn" onClick={pop} disabled={saving} style={{flex:1,background:colors.card,border:`1px solid ${colors.cardBorder}`,color:colors.text,padding:13}}>Cancelar</button>
          <button className="btn" onClick={submit} disabled={saving} style={{flex:2,background:saving?"#1a2235":clr,color:saving?"#4a5568":"#080c14",padding:13,fontSize:15,transition:"all .2s"}}>
            {saving?"Guardando…":"Confirmar"}
          </button>
        </div>
      </div>
    </div>);
  }

  // ── ExportScreen ──────────────────────────────────────────────────────────────
  // ── CuentaScreen ─────────────────────────────────────────────────────────────
  function CuentaScreen({session,pop,showToast,colors,cerrarSesion,askConfirm}) {
    const [editNombre,setEditNombre]=useState(false);
    const [nombre,setNombre]=useState(session.user.user_metadata?.nombre||"");
    const [savingNombre,setSavingNombre]=useState(false);
    const [showPassForm,setShowPassForm]=useState(false);
    const [passActual,setPassActual]=useState("");
    const [passNueva,setPassNueva]=useState("");
    const [passRepetir,setPassRepetir]=useState("");
    const [passError,setPassError]=useState("");
    const [savingPass,setSavingPass]=useState(false);

    const guardarNombre=async()=>{
      if(!nombre.trim())return;
      setSavingNombre(true);
      try{
        const {error:err}=await sb.auth.updateUser({data:{nombre:nombre.trim()}});
        if(err){showToast(err.message,"err");setSavingNombre(false);return;}
        showToast("Nombre actualizado");
        setEditNombre(false);
      }catch(e){showToast("Error al guardar","err");}
      setSavingNombre(false);
    };

    const cambiarPassword=async()=>{
      setPassError("");
      if(!passActual||!passNueva||!passRepetir){setPassError("Completá los 3 campos.");return;}
      if(passNueva.length<6){setPassError("La nueva contraseña tiene que tener al menos 6 caracteres.");return;}
      if(passNueva!==passRepetir){setPassError("Las contraseñas nuevas no coinciden.");return;}
      setSavingPass(true);
      try{
        const {error:errLogin}=await sb.auth.signInWithPassword({email:session.user.email,password:passActual});
        if(errLogin){setPassError("La contraseña actual es incorrecta.");setSavingPass(false);return;}
        const {error:errUpd}=await sb.auth.updateUser({password:passNueva});
        if(errUpd){setPassError(errUpd.message);setSavingPass(false);return;}
        showToast("Contraseña actualizada");
        setShowPassForm(false);setPassActual("");setPassNueva("");setPassRepetir("");
      }catch(e){setPassError("Error inesperado.");}
      setSavingPass(false);
    };

    return (<div className="fade">
      <TopBar colors={colors} title="👤 Cuenta" onBack={pop}/>
      <div className="card" style={{padding:16,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:600,color:colors.textMuted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Email</div>
        <div style={{fontSize:14,color:colors.text,marginBottom:16}}>{session.user.email}</div>

        <div style={{fontSize:11,fontWeight:600,color:colors.textMuted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Nombre</div>
        {editNombre?(
          <div style={{display:"flex",gap:8}}>
            <input className="inp" autoComplete="canasta-field-ignore" value={nombre} onChange={e=>setNombre(e.target.value)} style={{flex:1}}/>
            <button className="btn" disabled={savingNombre} onClick={guardarNombre} style={{background:colors.accent,color:"#fff",padding:"0 16px",fontSize:13}}>OK</button>
          </div>
        ):(
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontSize:14,color:colors.text}}>{nombre||"—"}</div>
            <button className="btn" onClick={()=>setEditNombre(true)} style={{background:colors.btnSecondary,color:colors.accent,padding:"6px 12px",fontSize:12}}>Editar</button>
          </div>
        )}
      </div>

      <div className="card" style={{padding:16,marginBottom:12}}>
        {!showPassForm?(
          <button className="btn" onClick={()=>setShowPassForm(true)} style={{width:"100%",background:colors.btnSecondary,color:colors.accent,padding:11,fontSize:13}}>🔒 Cambiar contraseña</button>
        ):(
          <div>
            <div style={{fontSize:11,fontWeight:600,color:colors.textMuted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:10}}>Cambiar contraseña</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <div className="field"><label>Contraseña actual</label><PasswordInput colors={colors} value={passActual} onChange={e=>setPassActual(e.target.value)}/></div>
              <div className="field"><label>Nueva contraseña</label><PasswordInput colors={colors} value={passNueva} onChange={e=>setPassNueva(e.target.value)}/><div style={{fontSize:11,color:colors.textMuted,marginTop:2}}>Mínimo 6 caracteres</div></div>
              <div className="field"><label>Repetir nueva contraseña</label><PasswordInput colors={colors} value={passRepetir} onChange={e=>setPassRepetir(e.target.value)}/></div>
            </div>
            {passError&&<div style={{color:colors.error,fontSize:12.5,marginTop:10}}>{passError}</div>}
            <div style={{display:"flex",gap:8,marginTop:14}}>
              <button className="btn" onClick={()=>{setShowPassForm(false);setPassActual("");setPassNueva("");setPassRepetir("");setPassError("");}} style={{flex:1,background:colors.btnSecondary,color:colors.textSecondary,padding:11,fontSize:13}}>Cancelar</button>
              <button className="btn" disabled={savingPass} onClick={cambiarPassword} style={{flex:1,background:colors.accent,color:"#fff",padding:11,fontSize:13,opacity:savingPass?.6:1}}>{savingPass?"Un momento…":"Confirmar"}</button>
            </div>
          </div>
        )}
      </div>
      <button className="btn" onClick={()=>askConfirm("¿Cerrar sesión?",cerrarSesion,"Cerrar sesión","#ef4444")} style={{width:"100%",padding:12,background:colors.errorBg,color:colors.error,border:`1px solid ${colors.errorBorder}`,fontSize:13}}>Cerrar sesión</button>
    </div>);
  }

  // ── GrupoFamiliarScreen ──────────────────────────────────────────────────────
  function GrupoFamiliarScreen({grupoInfo,grupoId,cargarInfoGrupo,session,pop,showToast,colors,salirDelGrupo,expulsarMiembro,regenerarCodigo,renombrarGrupo,askConfirm}) {

    const copiarLink=async()=>{

    </div>);

        <div className="card" style={{padding:20,marginBottom:12,textAlign:"center"}}>
          <div style={{fontSize:34,marginBottom:10}}>👨‍👩‍👧</div>
          <div style={{fontSize:15,fontWeight:700,color:colors.text,marginBottom:6}}>No estás en ningún grupo familiar</div>
          <div style={{fontSize:12.5,color:colors.textMuted,lineHeight:1.5}}>Tu base de datos es individual. Podés compartirla con tu familia invitándolos por link.</div>
        </div>
        <div className="card" style={{padding:16,marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:600,color:colors.textMuted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Crear grupo familiar</div>
          <div style={{fontSize:12.5,color:colors.textMuted,marginBottom:10,lineHeight:1.4}}>Compartí este link con quien quieras sumar. Van a ver y editar la misma base de datos que vos.</div>
          <div style={{display:"flex",gap:8}}>
            <div className="mono" style={{flex:1,background:colors.inputBg,border:`1px solid ${colors.cardBorder}`,borderRadius:10,padding:"10px 12px",fontSize:12,color:colors.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{link}</div>
            <button className="btn" onClick={copiarLink} style={{background:colors.accent,color:"#fff",padding:"0 14px",fontSize:12}}>Copiar</button>
          </div>
        </div>
      </div>);
    }

    return (<div className="fade">
      <TopBar colors={colors} title="👨‍👩‍👧 Grupo Familiar" onBack={pop}/>

      <div className="card" style={{padding:16,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:600,color:colors.textMuted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:8}}>Nombre del grupo</div>
        {editNombre?(
          <div style={{display:"flex",gap:8}}>
            <input className="inp" autoComplete="canasta-field-ignore" value={nombre} onChange={e=>setNombre(e.target.value)} style={{flex:1}}/>
            <button className="btn" onClick={()=>{renombrarGrupo(nombre);setEditNombre(false);}} style={{background:colors.accent,color:"#fff",padding:"0 16px",fontSize:13}}>OK</button>
          </div>
        ):(
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontSize:15,fontWeight:600,color:colors.text}}>{grupoInfo.nombre}</div>
            {esAdmin&&<button className="btn" onClick={()=>{setNombre(grupoInfo.nombre);setEditNombre(true);}} style={{background:colors.btnSecondary,color:colors.accent,padding:"6px 12px",fontSize:12}}>Editar</button>}
          </div>
        )}
      </div>

      <div className="card" style={{padding:16,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:600,color:colors.textMuted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:10}}>Miembros ({grupoInfo.miembros?.length||0})</div>
        {(grupoInfo.miembros||[]).map(m=>(
          <div key={m.user_id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 0",borderTop:`1px solid ${colors.cardBorder}`}}>

          <button className="btn" onClick={()=>askConfirm("¿Generar un nuevo link? El link anterior dejará de funcionar.",regenerarCodigo,"Generar nuevo","#f59e0b")} style={{marginTop:10,background:"none",color:colors.textMuted,padding:"6px 0",fontSize:12,textDecoration:"underline"}}>Generar nuevo link</button>

    </div>);

  function ExportScreen({cats,productos,pop,showToast,colors}) {
    const [openKey,setOpenKey]=useState(null);   // sección cuyo texto está desplegado
    const [openCatId,setOpenCatId]=useState(null); // categoría desplegada
    const toggle=(key)=>setOpenKey(k=>k===key?null:key);
    const toggleCat=(id)=>{setOpenCatId(c=>c===id?null:id);setOpenKey(null);};
    const doCopy=async(text,e)=>{e.stopPropagation();const ok=await copyToClipboard(text);showToast(ok?"📋 Copiado":"No se pudo copiar",ok?null:"err");};

    const TextBlock=({text})=>(
      <div style={{position:"relative"}}>
        <button onClick={e=>doCopy(text,e)} style={{position:"absolute",top:8,right:12,background:colors.accent,border:"none",borderRadius:8,color:"#fff",padding:"4px 10px",fontSize:12,cursor:"pointer",zIndex:1}}>📋 Copiar</button>
        <pre style={{fontSize:12,color:colors.text,lineHeight:1.7,whiteSpace:"pre-wrap",fontFamily:"'DM Mono',monospace",background:colors.inputBg,padding:"32px 16px 12px",margin:0,borderTop:`1px solid ${colors.cardBorder}`}}>{text||"Sin productos."}</pre>
      </div>
    );

    const SectionRow=({label,catId,subId,indent=false})=>{
      const key=`${catId}-${subId}`;
      const isOpen=openKey===key;
      return (<div style={{borderTop:`1px solid ${colors.cardBorder}`}}>
        <div className="row" style={{padding:`10px 16px 10px ${indent?44:16}px`,display:"flex",alignItems:"center",gap:10,cursor:"pointer",WebkitTapHighlightColor:"transparent"}} onClick={()=>toggle(key)}>
          <div style={{flex:1,fontSize:indent?13:14,color:indent?colors.textSecondary:colors.text,fontWeight:indent?400:600}}>{label}</div>
          <div style={{fontSize:12,color:colors.textMuted}}>{isOpen?"▼":"▶"}</div>
        </div>
        {isOpen&&<TextBlock text={buildExportText(cats,productos,catId,subId)}/>}
      </div>);
    };

    return (<div className="fade"><TopBar colors={colors} title="📋 Exportar lista" subtitle="Tocá una sección para ver y copiar" onBack={pop}/>
      <div className="card" style={{overflow:"hidden",marginBottom:8}}>
        <SectionRow label="Toda la canasta" catId={null} subId={null}/>
      </div>
      <div style={{fontSize:11,fontWeight:600,color:colors.textMuted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:8,marginTop:4}}>Por sección</div>
      {[...cats].sort((a,b)=>alpha(a,b)).map(cat=>{
        const cp=productos.filter(p=>p.catId===cat.id);
        const validS=new Set(cat.subs.map(s=>s.id));
        const orphans=cp.filter(p=>!p.subId||!validS.has(p.subId));
        const hasSubs=cat.subs.length>0;
        const isOpen=openCatId===cat.id;
        return (<div key={cat.id} className="card" style={{marginBottom:8,overflow:"hidden",borderLeft:`3px solid ${cat.color}`}}>
          <div style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:10,cursor:"pointer",WebkitTapHighlightColor:"transparent"}} onClick={()=>toggleCat(cat.id)}>
            <span style={{fontSize:18}}>{cat.emoji}</span>
            <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14,color:colors.text}}>{cat.label}</div><div style={{fontSize:11,color:colors.textMuted}}>{cp.length} productos</div></div>
            <div style={{fontSize:12,color:colors.textMuted}}>{isOpen?"▼":"▶"}</div>
          </div>
          {isOpen&&(hasSubs?(<>
            <SectionRow label="Toda la categoría" catId={cat.id} subId={null}/>
            {[...cat.subs].sort((a,b)=>alpha(a,b)).map(sub=>{
              const sp=cp.filter(p=>p.subId===sub.id);
              if(!sp.length)return null;
              return <SectionRow key={sub.id} label={sub.label} catId={cat.id} subId={sub.id} indent/>;
            })}
            {orphans.length>0&&<SectionRow label="Sin subcategoría" catId={cat.id} subId="__sin_sub__" indent/>}
          </>):(
            <TextBlock text={buildExportText(cats,productos,cat.id,null)}/>
          ))}
        </div>);
      })}
    </div>);
  }

  // ── Listas de compras ─────────────────────────────────────────────────────────
  const fmtEntero=(v)=>"$"+Math.round(v).toLocaleString("es-AR");
  const precioEstimado=(p)=>p?(p.precioRef??ultimoEquiv(p)??null):null;
  const resumenLista=(l,productos,ticket)=>{
    const enTicket=new Map((ticket||[]).map(i=>[i.prodId,i]));
    let total=0,hechos=0,estimado=0,gastado=0;
    (l.items||[]).forEach(it=>{
      const p=it.prodId?productos.find(x=>x.id===it.prodId):null;
      if(it.prodId&&!p)return; // producto borrado
      if(it.estado==="comprado")return; // comprado en una compra anterior
      total++;
      const t=it.prodId?enTicket.get(it.prodId):null;
      if(t){hechos++;gastado+=t.totalPagado??t.precio??0;}
      else if(it.estado==="tilde"||it.estado==="no_habia")hechos++;
      if(it.estado!=="no_habia"){const pe=precioEstimado(p);if(pe)estimado+=pe*(it.cant||1);}
    });
    return {total,hechos,estimado,gastado,pendientes:total-hechos};
  };

  const contarLista=(l,productos,ticket)=>{
    const enTicket=new Set((ticket||[]).map(i=>i.prodId));
    let total=0,comprados=0;
    (l.items||[]).forEach(it=>{
      if(it.prodId&&!productos.some(x=>x.id===it.prodId))return;
      total++;
      if(it.estado==="comprado"||it.estado==="tilde"||(it.prodId&&enTicket.has(it.prodId)))comprados++;
    });
    return {total,comprados};
  };

    const prodDe=(it)=>it.prodId?productos.find(x=>x.id===it.prodId):null;
    const items=l.items.filter(it=>!it.prodId||prodDe(it));
    const estadoDe=(it)=>{
      if(it.estado==="comprado")return "comprado";       // comprado en una compra anterior
      if(!enCompra)return "pendiente";
      if(it.prodId&&enTicket.has(it.prodId))return "ticket";
      return it.estado||"pendiente";
    };
    const setItems=(fn)=>guardarLista({...l,items:fn(l.items)});
    const cambiarItem=(id,cambios)=>setItems(its=>its.map(x=>x.id===id?{...x,...cambios}:x));
    const quitarItem=(id)=>setItems(its=>its.filter(x=>x.id!==id));
    const agregarProd=(p)=>{
      const ya=l.items.find(x=>x.prodId===p.id);
      if(ya)cambiarItem(ya.id,{estado:"pendiente"});
      else setItems(its=>[...its,{id:uid(),prodId:p.id,texto:null,cant:cantSugerida(p),estado:"pendiente"}]);
      setQ("");
    };
    const agregarVarios=(prods)=>setItems(its=>{
      const ids=new Set(prods.map(p=>p.id));
      const act=its.map(x=>x.prodId&&ids.has(x.prodId)?{...x,estado:"pendiente"}:x);
      const nuevos=prods.filter(p=>!its.some(x=>x.prodId===p.id)).map(p=>({id:uid(),prodId:p.id,texto:null,cant:cantSugerida(p),estado:"pendiente"}));
      return [...act,...nuevos];
    });
    const agregarTexto=(t)=>{setItems(its=>[...its,{id:uid(),prodId:null,texto:t.trim(),cant:1,estado:"pendiente"}]);setQ("");};

    // Buscador para agregar
    const enLista=new Set(items.filter(x=>x.prodId&&x.estado!=="comprado").map(x=>x.prodId));
    const resultados=q.trim()?productos.filter(p=>!enLista.has(p.id)&&(norm(p.nombre).includes(norm(q))||norm(p.marca||"").includes(norm(q)))).sort((a,b)=>alphaStr(a.nombre,b.nombre)).slice(0,6):[];
    // Sugerencias: se acaban en menos de 2 semanas

    const tocarCirculo=(it)=>{

      if(enCompra&&it.prodId&&st!=="tilde")return setCompraItem(it);
      cambiarItem(it.id,{estado:st==="pendiente"?"tilde":"pendiente"});
    };

    // Agrupar pendientes por categoría
    const pend=items.filter(it=>estadoDe(it)==="pendiente");
    const grupos={};
    pend.forEach(it=>{const p=prodDe(it);const c=p?cats.find(x=>x.id===p.catId):null;const k=c?c.id:"__otros";(grupos[k]=grupos[k]||{cat:c,items:[]}).items.push(it);});
    const ordenGrupos=Object.values(grupos).sort((a,b)=>!a.cat?1:!b.cat?-1:alpha(a.cat,b.cat));
    const noHabia=items.filter(it=>estadoDe(it)==="no_habia");
    const hechos=items.filter(it=>["tilde","ticket"].includes(estadoDe(it)));
    const anteriores=items.filter(it=>estadoDe(it)==="comprado");

    const Fila=({it})=>{
      const p=prodDe(it); const st=estadoDe(it); const c=p?cats.find(x=>x.id===p.catId):null;
      const hecho=st==="tilde"||st==="ticket"||st==="comprado"; const nh=st==="no_habia"; const ant=st==="comprado";
      const t=st==="ticket"?enTicket.get(it.prodId):null;
      const pe=precioEstimado(p);
      const meta=p?[p.marca,p.cantidadRef?fmtCantRef(p):null].filter(Boolean).join(" · "):"Ítem libre";
      const isSel=selMode&&sel.has(it.id);
      return (<div {...lp(
          enCompra?()=>setOpcItem(it):()=>{setSelMode(true);setSel(prev=>new Set(prev).add(it.id));},

        )} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 14px",borderLeft:`3px solid ${isSel?colors.accent:c?.color||colors.hoverCard}`,background:isSel?`${colors.accent}22`:"transparent",cursor:selMode?"pointer":"default",...noSelectStyle}}>
        {selMode&&<div style={{width:22,height:22,borderRadius:"50%",flexShrink:0,border:`2px solid ${isSel?colors.accent:colors.hoverCard}`,background:isSel?colors.accent:"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:"#fff",fontWeight:700}}>{isSel?"✓":""}</div>}
        {enCompra&&!ant&&<div onClick={e=>{e.stopPropagation();tocarCirculo(it);}} style={{width:26,height:26,borderRadius:"50%",flexShrink:0,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,color:"#fff",
          border:`2px solid ${hecho?"#10b981":nh?colors.warning:colors.hoverCard}`,background:hecho?"#10b981":"transparent"}}>{hecho?"✓":nh?<span style={{color:colors.warning,fontSize:12}}>✕</span>:""}</div>}
