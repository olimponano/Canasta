<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#080c14"/>
  <title>Canasta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#080c14;font-family:'DM Sans','Segoe UI',sans-serif}
    #root{min-height:100vh}
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#1e2535}
    .btn{cursor:pointer;border:none;font-family:inherit;font-weight:600;transition:all .15s;border-radius:10px}
    .btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
    .btn:active{transform:translateY(0);filter:brightness(.95)}
    .card{background:#0d1321;border:1px solid #1a2235;border-radius:14px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field label{font-size:11px;font-weight:600;color:#4a5568;text-transform:uppercase;letter-spacing:.08em}
    .inp{background:#080c14;border:1px solid #1a2235;color:#e8eaf0;border-radius:10px;padding:11px 14px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;width:100%}
    .inp:focus{border-color:#3b82f6}
    .mono{font-family:'DM Mono',monospace}
    .fade{animation:fi .22s ease}
    @keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    .row{cursor:pointer;transition:all .15s}
    .row:hover{transform:translateX(3px);border-color:#2a3550!important}
  </style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#3b82f6;font-family:monospace">Cargando…</div></div>

<!-- 1. React -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- 4. Supabase -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<!-- 5. Babel standalone -->
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
(function() {
  const { useState, useEffect, useRef } = React;
  const LineChart=null, Line=null, XAxis=null, YAxis=null, Tooltip=null, CartesianGrid=null;
const ResponsiveContainer=({children})=>children||null;

  const SUPABASE_URL = "https://czktusbzqrqcdxfmhioc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nJE2_030ourYKjbk_lKlTQ__8l2O0Sg";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const norm = (s) => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
  const matchStr = (a, b) => {
    return norm(a) === norm(b);
  };
  const fmt = (n) => n == null ? "—" : `$${Number(n).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  const fmtDate = (d) => new Date(d + "T12:00:00").toLocaleDateString("es-AR", { day: "2-digit", month: "short", year: "2-digit" });
  const todayISO = () => new Date().toISOString().split("T")[0];
  const COLORS = ["#60a5fa","#f472b6","#4ade80","#fb923c","#a78bfa","#facc15","#34d399","#f87171","#38bdf8","#e879f9"];
  const alpha = (a, b, key="label") => (a[key]||"").localeCompare(b[key]||"", "es");
  const alphaStr = (a, b) => (a||"").localeCompare(b||"", "es");
  const fmtU = (u) => {
    if (!u) return "—";
    if (Number.isInteger(u)) return String(u);
    const fracs = [[1/12,"1/12"],[1/6,"1/6"],[1/4,"1/4"],[1/3,"1/3"],[1/2,"1/2"],[2/3,"2/3"],[3/4,"3/4"]];
    for (const [v,s] of fracs) if (Math.abs(u-v)<0.001) return s;
    return Number(u.toFixed(2)).toLocaleString("es-AR");
  };

  // Parse "NxM" format → total numeric value. "4x30"→120, "300"→300
  const parseQty = (s) => {
    if (!s) return null;
    const str = String(s).trim();
    if (str.includes("x")) {
      const [a, b] = str.split("x").map(Number);
      return (isNaN(a)||isNaN(b)) ? null : a * b;
    }
    const n = parseFloat(str.replace(",","."));
    return isNaN(n) ? null : n;
  };

  // Parse fraction input "1/3" → 0.333, "2" → 2
  const parseFrac = (s) => {
    if (!s) return null;
    const str = String(s).trim();
    if (str.includes("/")) {
      const [a,b] = str.split("/").map(Number);
      return (!isNaN(a)&&!isNaN(b)&&b!==0) ? a/b : null;
    }
    const n = parseFloat(str.replace(",","."));
    return isNaN(n) ? null : n;
  };
  // Muestra "3x40m" si hay display guardado, sino "120m"
  const fmtCantRef=(p)=>{if(!p||!p.cantidadRef)return "";const disp=p.cantidadRefDisplay?`${p.cantidadRefDisplay}${p.unidad||""}`:null;return disp||`${p.cantidadRef}${p.unidad||""}`};

  const DEFAULT_CATS = [
    { id:"primario",   label:"Primario",   emoji:"🛒", color:"#60a5fa", subs:[] },
    { id:"higiene",    label:"Higiene",    emoji:"🧴", color:"#f472b6", subs:[] },
    { id:"verduleria", label:"Verdulería", emoji:"🥦", color:"#4ade80", subs:[] },
    { id:"carniceria", label:"Carnicería", emoji:"🥩", color:"#fb923c", subs:[] },
    { id:"secundario", label:"Secundario", emoji:"🍪", color:"#a78bfa", subs:[] },
  ];
  const DEFAULT_PRODUCTOS = [];
  const UNASSIGNED_ID = "__sin_sub__";

  function isUnassignedProd(p, cat) {
    if (!cat || !cat.subs.length) return false;
    return !p.subId || !cat.subs.find(s => s.id === p.subId);
  }

  // Backup export — full format compatible with import
  function buildBackupText(cats, productos) {
    const lines = [];
    [...cats].sort((a,b)=>alpha(a,b)).forEach(cat => {
      const catProds = productos.filter(p=>p.catId===cat.id);
      if (!catProds.length) return;
      lines.push(`---${cat.label}---`);
      if (cat.subs.length === 0) {
        [...catProds].sort((a,b)=>alpha(a,b,"nombre")).forEach(p => {
          const um = p.unidadesMes ? (Number.isInteger(p.unidadesMes)?String(p.unidadesMes):(() => {
            const fracs=[[1/12,"1/12"],[1/6,"1/6"],[1/4,"1/4"],[1/3,"1/3"],[1/2,"1/2"],[2/3,"2/3"],[3/4,"3/4"]];
            for(const [v,s] of fracs) if(Math.abs(p.unidadesMes-v)<0.001) return s;
            return p.unidadesMes.toFixed(2);
          })()) : "";
          const cant = p.cantidadRef||"";
          const unit = p.unidad||"gr";
          const precio = p.precioRef?`${p.precioRef}$`:"";
          lines.push([p.nombre,p.marca||"",cant,unit,precio,um].filter((v,i)=>i<4||v).join("-"));
        });
      } else {
        [...cat.subs].sort((a,b)=>alpha(a,b)).forEach(sub => {
          const subProds = [...catProds.filter(p=>p.subId===sub.id)].sort((a,b)=>alpha(a,b,"nombre"));
          if (!subProds.length) return;
          lines.push(sub.label);
          subProds.forEach(p => {
            const um = p.unidadesMes ? (Number.isInteger(p.unidadesMes)?String(p.unidadesMes):(() => {
              const fracs=[[1/12,"1/12"],[1/6,"1/6"],[1/4,"1/4"],[1/3,"1/3"],[1/2,"1/2"],[2/3,"2/3"],[3/4,"3/4"]];
              for(const [v,s] of fracs) if(Math.abs(p.unidadesMes-v)<0.001) return s;
              return p.unidadesMes.toFixed(2);
            })()) : "";
            const cant = p.cantidadRef||"";
            const unit = p.unidad||"gr";
            const precio = p.precioRef?`${p.precioRef}$`:"";
            lines.push([p.nombre,p.marca||"",cant,unit,precio,um].filter((v,i)=>i<4||v).join("-"));
          });
        });
      }
      lines.push("");
    });
    return lines.join("\n").trim();
  }

  function buildExportText(cats, productos, filterCatId=null, filterSubId=null) {
    // Handle orphans export
    if(filterSubId==="__sin_sub__"&&filterCatId){
      const cat=cats.find(c=>c.id===filterCatId);
      const validSubs=new Set((cat?.subs||[]).map(s=>s.id));
      const orphans=productos.filter(p=>p.catId===filterCatId&&(!p.subId||!validSubs.has(p.subId)));
      const lines=[];
      lines.push(`=== ${cat?.label.toUpperCase()} — SIN SUBCATEGORÍA ===`);
      [...orphans].sort((a,b)=>alpha(a,b,"nombre")).forEach(p=>{lines.push(p.nombre);lines.push(`${p.marca||""}${p.precioRef?" "+fmt(p.precioRef):""}`.trim());lines.push("");});
      return lines.join("\n").trim();
    }
    const lines = [];
    const tCats = filterCatId ? cats.filter(c=>c.id===filterCatId) : [...cats].sort((a,b)=>alpha(a,b));
    tCats.forEach(cat => {
      const cp = productos.filter(p=>p.catId===cat.id); if (!cp.length) return;
      if (cat.subs.length===0) {
        const f = filterSubId ? [] : [...cp].sort((a,b)=>alpha(a,b,"nombre"));
        if (!f.length) return;
        lines.push(`=== ${cat.label.toUpperCase()} ===`);
        f.forEach(p=>{lines.push(p.nombre);lines.push(`${p.marca||""}${p.precioRef?" "+fmt(p.precioRef):""}`.trim());lines.push("");});
      } else {
        const tSubs = filterSubId ? cat.subs.filter(s=>s.id===filterSubId) : [...cat.subs].sort((a,b)=>alpha(a,b));
        const validSubs=new Set(cat.subs.map(s=>s.id));
        const orphans=cp.filter(p=>!p.subId||!validSubs.has(p.subId));
        const hasProds = tSubs.some(sub => cp.some(p=>p.subId===sub.id)) || (!filterSubId&&orphans.length>0);
        if (!hasProds) return;
        lines.push(`=== ${cat.label.toUpperCase()} ===`);
        tSubs.forEach(sub => {
          const sp = [...cp.filter(p=>p.subId===sub.id)].sort((a,b)=>alpha(a,b,"nombre"));
          if (!sp.length) return;
          lines.push(`--- ${sub.label} ---`);
          sp.forEach(p=>{lines.push(p.nombre);lines.push(`${p.marca||""}${p.precioRef?" "+fmt(p.precioRef):""}`.trim());lines.push("");});
        });
        // Exportar huérfanos al final si no hay filtro de sub
        if(!filterSubId&&orphans.length>0){
          lines.push(`--- Sin subcategoría ---`);
          [...orphans].sort((a,b)=>alpha(a,b,"nombre")).forEach(p=>{lines.push(p.nombre);lines.push(`${p.marca||""}${p.precioRef?" "+fmt(p.precioRef):""}`.trim());lines.push("");});
        }
      }
    });
    return lines.join("\n").trim();
  }

  async function copyToClipboard(text) {
    try { if (navigator.clipboard) { await navigator.clipboard.writeText(text); return true; } } catch {}
    try {
      const el=document.createElement("textarea"); el.value=text; el.setAttribute("readonly","");
      el.style.cssText="position:absolute;left:-9999px;top:0"; document.body.appendChild(el);
      el.focus(); el.select(); el.setSelectionRange(0,el.value.length);
      const ok=document.execCommand("copy"); document.body.removeChild(el); return ok;
    } catch { return false; }
  }

  function parseProductLine(l) {
    if (!/\$/.test(l)||!l.includes("-")) return null;
    const parts=l.split("-").map(p=>p.trim()); if(parts.length<4) return null;
    const nombre=parts[0],marca=parts[1];
    const rawCant=(parts[2]||"").trim();
    const uLow=(parts[3]||"").toLowerCase();
    const cantidad=(uLow==="m"||uLow==="un")?rawCant:(parseFloat(rawCant)||null);
    const unidad=uLow==="ml"?"mL":uLow==="l"?"L":uLow==="kg"?"kg":uLow==="m"?"m":uLow==="un"?"un":"gr";
    const precioRef=parseFloat((parts[4]||"").replace(/[$\s]/g,"").replace(",","."))||null;
    const umStr=(parts[5]||"").trim();
    const unidadesMes=umStr?(umStr.includes("/")?parseFloat(umStr.split("/")[0])/parseFloat(umStr.split("/")[1]):parseFloat(umStr.replace(",","."))):null;
    return {nombre,marca,cantidadRef:cantidad,unidad,precioRef,unidadesMes};
  }

  function parseImportText(text) {
    const lines=text.split("\n").map(l=>l.trim());
    const parsed=[]; let currentCat=null,currentSub=null,currentProducts=[];
    const flush=()=>{if(currentCat&&currentProducts.length){parsed.push({catLabel:currentCat,subLabel:currentSub,products:[...currentProducts]});currentProducts=[];}};
    for(const line of lines){
      if(!line) continue;
      const catMatch=line.match(/^---(.+?)---$/);
      if(catMatch){flush();currentCat=catMatch[1].trim();currentSub=null;continue;}
      if(!currentCat) continue;
      const prod=parseProductLine(line);
      if(prod){currentProducts.push(prod);}
      else{flush();currentSub=line;}
    }
    flush();
    return parsed;
  }


  function Confirm({msg,onOk,onCancel,okLabel="Confirmar",okColor="#3b82f6"}) {
    return (
      <div style={{position:"fixed",inset:0,background:"#000b",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:"#0d1321",border:"1px solid #2a3550",borderRadius:16,padding:24,maxWidth:320,width:"100%"}}>
          <div style={{fontSize:15,lineHeight:1.5,marginBottom:20,color:"#e8eaf0"}}>{msg}</div>
          <div style={{display:"flex",gap:10}}>
            <button className="btn" onClick={onCancel} style={{flex:1,background:"#1a2235",color:"#8b9ab0",padding:12}}>Cancelar</button>
            <button className="btn" onClick={onOk} style={{flex:1,background:okColor,color:okColor==="#ef4444"?"#fff":"#080c14",padding:12}}>{okLabel}</button>
          </div>
        </div>
      </div>
    );
  }

  function AddModal({title,namePlaceholder,onClose,onSave,showColor=true,accentColor="#3b82f6"}) {
    const [label,setLabel]=useState(""); const [emoji,setEmoji]=useState("📦"); const [color,setColor]=useState(accentColor);
    const submit=()=>{if(!label.trim())return; onSave({label:label.trim(),emoji,color});};
    return (
      <div style={{position:"fixed",inset:0,background:"#000c",zIndex:1500,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div style={{background:"#0d1321",borderRadius:"20px 20px 0 0",padding:"28px 24px 36px",width:"100%",maxWidth:500,border:"1px solid #1a2235",borderBottom:"none"}}>
          <div style={{width:40,height:4,background:"#2a3550",borderRadius:2,margin:"0 auto 24px"}}/>
          <div style={{fontWeight:700,fontSize:18,marginBottom:20,color:"#e8eaf0"}}>{title}</div>
          <div style={{display:"grid",gridTemplateColumns:"64px 1fr",gap:10,marginBottom:16}}>
            <div className="field"><label>Emoji</label><input className="inp" value={emoji} onChange={e=>setEmoji(e.target.value)} style={{textAlign:"center",fontSize:22,padding:"10px 4px"}} autoFocus/></div>
            <div className="field"><label>Nombre</label><input className="inp" placeholder={namePlaceholder} value={label} onChange={e=>setLabel(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
          </div>
          {showColor&&(
            <div style={{marginBottom:20}}>
              <div style={{fontSize:11,fontWeight:600,color:"#4a5568",textTransform:"uppercase",letterSpacing:".08em",marginBottom:10}}>Color</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>{COLORS.map(c=><div key={c} onClick={()=>setColor(c)} style={{width:32,height:32,borderRadius:"50%",background:c,cursor:"pointer",border:color===c?"3px solid #fff":"3px solid transparent",transition:"all .15s",flexShrink:0}}/>)}</div>
            </div>
          )}
          <div style={{display:"flex",gap:10}}>
            <button className="btn" onClick={onClose} style={{flex:1,background:"#1a2235",color:"#8b9ab0",padding:13,fontSize:14}}>Cancelar</button>
            <button className="btn" onClick={submit} style={{flex:2,background:showColor?color:accentColor,color:"#080c14",padding:13,fontSize:15,fontWeight:700}}>Crear</button>
          </div>
        </div>
      </div>
    );
  }

  function FloatingAdd({onClick}) {
    return <button onClick={onClick} style={{position:"fixed",bottom:84,right:20,width:56,height:56,borderRadius:"50%",background:"#3b82f6",color:"#fff",fontSize:28,display:"flex",alignItems:"center",justifyContent:"center",border:"none",cursor:"pointer",boxShadow:"0 4px 24px #3b82f655",zIndex:100,lineHeight:1}}>+</button>;
  }

  function FloatingCompras({onClick}) {
    return <button onClick={onClick} style={{position:"fixed",bottom:84,right:20,width:56,height:56,borderRadius:"50%",background:"#10b981",color:"#fff",fontSize:26,display:"flex",alignItems:"center",justifyContent:"center",border:"none",cursor:"pointer",boxShadow:"0 4px 24px #10b98155",zIndex:100,lineHeight:1,filter:"brightness(1.3)"}}>🛒</button>;
  }

  function TicketDrawer({ticket,setTicket,productos,cats,ticketOpen,setTicketOpen,onFinalizar,onCancelar,onVerHistorial,askConfirm}) {
    const [editIdx,setEditIdx]=useState(null);
    const [editCant,setEditCant]=useState("");
    const [editPrecio,setEditPrecio]=useState("");
    const totalPagado=ticket.reduce((s,i)=>s+(i.totalPagado??i.precio??0),0);
    const totalRef=ticket.reduce((s,i)=>s+(i.totalRef??i.precioRef??0),0);
    const diff=totalPagado-totalRef;
    const diffPct=totalRef>0?((diff/totalRef)*100).toFixed(1):null;
    const eliminarItem=(idx)=>askConfirm("¿Eliminar este producto del ticket?",()=>setTicket(t=>t.filter((_,i)=>i!==idx)),"Eliminar","#ef4444");
    const iniciarEdicion=(idx)=>{const item=ticket[idx];setEditCant(String(item.cantComprada||1));setEditPrecio(String(item.precio||""));setEditIdx(idx);};
    const guardarEdicion=()=>{
      const item=ticket[editIdx];
      const nuevoPrecio=parseFloat(String(editPrecio).replace(",","."))||item.precio;
      const nuevaCant=parseInt(editCant)||item.cantComprada||1;
      const cantRefNum=item.cantRef;
      const cantNum=parseFloat(String(item.cantidad||cantRefNum))||cantRefNum;
      const equivalente=(nuevoPrecio>0&&cantNum>0&&cantRefNum)?(nuevoPrecio/cantNum)*cantRefNum:item.equivalente;
      const totalPagado=nuevoPrecio*nuevaCant;
      const totalRef=item.precioRef?item.precioRef*nuevaCant:null;
      setTicket(t=>t.map((x,i)=>i===editIdx?{...x,precio:nuevoPrecio,cantComprada:nuevaCant,totalPagado,totalRef,equivalente,stockDelta:x.stockDelta?{...x.stockDelta,cantidad:nuevaCant}:x.stockDelta}:x));
      setEditIdx(null);
    };
    return (
      <div style={{position:"fixed",bottom:0,left:0,right:0,maxWidth:500,margin:"0 auto",zIndex:150,background:"#0d1321",borderTop:"2px solid #10b981",borderRadius:"16px 16px 0 0",boxShadow:"0 -8px 32px #0008"}}>
        <div style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>setTicketOpen(o=>!o)}>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:700,color:"#10b981"}}>🛒 Modo compras{ticket.length>0&&` · ${ticket.length} producto${ticket.length>1?"s":""}`}</div>
            {ticket.length>0&&(<div style={{fontSize:12,color:"#4a5568",marginTop:2}}><span className="mono" style={{color:"#e8eaf0",fontWeight:700}}>{fmt(totalPagado)}</span>{diffPct!==null&&<span style={{marginLeft:8,color:diff<=0?"#10b981":"#ef4444",fontWeight:600}}>{diff<=0?"▼":"▲"} {Math.abs(parseFloat(diffPct))}% vs ref</span>}</div>)}
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <button className="btn" onClick={e=>{e.stopPropagation();onVerHistorial();}} style={{background:"#1a2235",color:"#8b9ab0",border:"1px solid #2a3550",padding:"7px 12px",fontSize:13}}>📋</button>
            {ticket.length>0&&<button className="btn" onClick={e=>{e.stopPropagation();onFinalizar();}} style={{background:"#10b981",color:"#fff",padding:"7px 14px",fontSize:13}}>Finalizar</button>}
            <button className="btn" onClick={e=>{e.stopPropagation();onCancelar();}} style={{background:"#1a0a0a",color:"#ef4444",border:"1px solid #2d1212",padding:"7px 12px",fontSize:13}}>✕</button>
            <span style={{color:"#4a5568",fontSize:16}}>{ticketOpen?"▼":"▲"}</span>
          </div>
        </div>
        {ticketOpen&&ticket.length>0&&(
          <div style={{maxHeight:280,overflowY:"auto",borderTop:"1px solid #1a2235"}}>
            {ticket.map((item,i)=>{
              const p=productos.find(x=>x.id===item.prodId);
              const cat=cats.find(c=>c.id===p?.catId);
              const diffItem=item.totalRef>0?item.totalPagado-item.totalRef:null;
              const isEditing=editIdx===i;
              return (<div key={i} style={{padding:"10px 16px",borderBottom:"1px solid #1a2235"}}>
                {isEditing?(
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    <div style={{fontSize:13,fontWeight:600,color:"#e8eaf0"}}>{item.nombre}</div>
                    <div style={{display:"flex",gap:8}}>
                      <div style={{flex:1}}><div style={{fontSize:10,color:"#4a5568",marginBottom:3,fontWeight:600,textTransform:"uppercase"}}>Precio $</div><input className="inp" value={editPrecio} onChange={e=>setEditPrecio(e.target.value)} style={{padding:"7px 10px",fontSize:14}} autoFocus/></div>
                      <div style={{flex:1}}><div style={{fontSize:10,color:"#4a5568",marginBottom:3,fontWeight:600,textTransform:"uppercase"}}>Compré</div><input className="inp" value={editCant} onChange={e=>setEditCant(e.target.value)} style={{padding:"7px 10px",fontSize:14}}/></div>
                    </div>
                    <div style={{display:"flex",gap:8}}>

                    </div>

                      <div className="mono" style={{fontSize:14,fontWeight:700,color:"#e8eaf0"}}>{fmt(item.totalPagado)}</div>

                      <button onClick={()=>eliminarItem(i)} style={{width:26,height:26,borderRadius:6,background:"#1a0a0a",border:"1px solid #2d1212",color:"#ef4444",fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
                    </div>

            <div style={{padding:"10px 16px",display:"flex",justifyContent:"space-between",background:"#080c14"}}>

  function HistorialTickets({tickets,onClose}) {

    return (
      <div style={{position:"fixed",inset:0,background:"#000c",zIndex:2000,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div style={{background:"#0d1321",borderRadius:"20px 20px 0 0",padding:"24px 20px 36px",width:"100%",maxWidth:500,border:"1px solid #1a2235",borderBottom:"none",maxHeight:"80vh",overflowY:"auto"}}>

  // ── ComprasCardInline ─────────────────────────────────────────────────────────
  function ComprasCardInline({p,cat,stock,stockTotal,guardarStock,mesesRestantes,fmtMeses,guardar,productos,showToast,agregarAlTicket,askConfirm}) {
    const [open,setOpen]=useState(false);
    const [precio,setPrecio]=useState("");
    const [cantidad,setCantidad]=useState(p.cantidadRef?String(p.cantidadRef):"");
    const [cantRollos,setCantRollos]=useState(""); // rollos por paquete
    const [cantMetros,setCantMetros]=useState(""); // metros por rollo
    const [cantComprada,setCantComprada]=useState("1"); // paquetes comprados
    const [fecha,setFecha]=useState(todayISO());
    const [saving,setSaving]=useState(false);

    const esM=p.unidad==="m";
    const entradasGuardadas=stock[p.id]||[];
    const total=stockTotal(p);
    const meses=mesesRestantes(p);
    const mesesTxt=fmtMeses(meses);
    const urgColor=meses===null?"#4a5568":meses===0?"#ef4444":meses<1?"#f97316":meses<2?"#facc15":"#4ade80";
    const hist=p.historialCompra||[];
    const ultimoPrecio=hist.length>0?hist[hist.length-1].precio:null;
    const fmtTotal=(t)=>{const r=Math.round(t*100)/100;return r===Math.round(r)?String(Math.round(r)):r.toLocaleString("es-AR");};

    const precioNum=parseFloat((precio||"").replace(",","."));
    const cantRollosNum=esM?(parseInt(cantRollos)||0):0;
    const cantMetrosNum=esM?(parseFloat(cantMetros)||0):0;
    const cantCompradaNum=parseInt(cantComprada)||1;
    // Para m: un paquete = rollos × metros; total metros = paquetes × rollos × metros
    const metrosPorPaq=cantRollosNum*cantMetrosNum;
    const cantNum=esM?metrosPorPaq*cantCompradaNum:parseFloat((cantidad||"").replace(",","."));
    const cantDisplay=esM&&cantRollosNum>0&&cantMetrosNum>0?`${cantRollosNum}x${cantMetrosNum}`:null;
    const cantRefNum=p.cantidadRef;
    // equivalente = precio por paquete normalizado a unidad de referencia
    const equivalente=(precioNum>0&&metrosPorPaq>0&&cantRefNum)?(precioNum/metrosPorPaq)*cantRefNum:null;
    const diff=equivalente!=null&&p.precioRef?((equivalente-p.precioRef)/p.precioRef*100):null;
    const totalPagado=precioNum>0&&cantCompradaNum>0?precioNum*cantCompradaNum:null;
    const totalRef=p.precioRef&&cantCompradaNum>0?p.precioRef*cantCompradaNum:null;

    const doRegistrar=async()=>{
      setSaving(true);
      try {
        const cantGuardada=esM?String(cantNum):cantidad||null;
        const entrada={id:uid(),precio:precioNum,cantidad:cantGuardada,equivalente,fecha};
        await guardar(null,productos.map(x=>x.id===p.id?{...x,historialCompra:[...(x.historialCompra||[]),entrada].sort((a,b)=>a.fecha.localeCompare(b.fecha))}:x));
        agregarAlTicket({
          prodId:p.id,nombre:p.nombre,marca:p.marca,cantRef:cantRefNum,cantRefDisplay:p.cantidadRefDisplay||null,
          cantDisplay,unidad:p.unidad,precio:precioNum,equivalente,precioRef:p.precioRef,fecha,
          cantComprada:cantCompradaNum,totalPagado,totalRef,
          stockDelta:{cantRef:cantRefNum,cantidad:cantCompradaNum,entradasBase:entradasGuardadas,display:p.cantidadRefDisplay||null}
        });
        showToast("✅ Agregado al ticket");
        setOpen(false);
      } catch(e){showToast("Error al guardar","err");}
      finally{setSaving(false);}
    };

    const registrar=()=>{
      if(!precioNum||precioNum<=0)return showToast("Precio inválido","err");
      askConfirm(
        `¿Registrar ${p.nombre} a ${fmt(precioNum)}?`,
        doRegistrar,
        "Confirmar"
      );
    };

    return (
      <div className="card" style={{borderLeft:`3px solid ${cat?.color||"#444"}`,overflow:"hidden"}}>
        <div style={{padding:"12px 14px",display:"flex",alignItems:"stretch",gap:10}}>
          <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>setOpen(o=>!o)}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{fontWeight:600,fontSize:15,color:"#e8eaf0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",flex:1,marginRight:8}}>{p.nombre}</div>
              <div style={{fontSize:12,fontWeight:700,color:urgColor,flexShrink:0,textAlign:"right"}}>{mesesTxt}</div>
            </div>
            <div style={{fontSize:12,color:"#4a5568",marginTop:2,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span>{p.marca||"—"}{p.cantidadRef&&<span style={{marginLeft:6}}>{fmtCantRef(p)}</span>}</span>
              <span style={{fontSize:12,color:"#4a5568"}}>Stock: <span className="mono" style={{fontWeight:700,color:"#e8eaf0",fontSize:13}}>{fmtTotal(total)}</span></span>
            </div>
            <div style={{marginTop:4,display:"flex",gap:10}}>
              {p.precioRef&&<span style={{fontSize:12,color:"#4a5568"}}>Ref: <span style={{color:cat?.color||"#3b82f6",fontWeight:700,fontFamily:"'DM Mono',monospace"}}>{fmt(p.precioRef)}</span></span>}
              {ultimoPrecio&&<span style={{fontSize:12,color:"#4a5568"}}>Último: <span style={{color:"#e8eaf0",fontWeight:700,fontFamily:"'DM Mono',monospace"}}>{fmt(ultimoPrecio)}</span></span>}
            </div>
          </div>
          <button onClick={()=>setOpen(o=>!o)} style={{width:38,alignSelf:"center",height:38,borderRadius:10,background:open?"#1a2235":"#3b82f6",border:"none",color:"#fff",fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:600,flexShrink:0,transition:"background .15s"}}>{open?"▲":"+"}</button>
        </div>

        {open&&(
          <div style={{borderTop:"1px solid #1a2235",padding:"12px 14px",display:"flex",flexDirection:"column",gap:10}}>
            {esM?(
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,alignItems:"end"}}>
                <div>
                  <div style={{fontSize:10,color:"#4a5568",marginBottom:3,fontWeight:600,textTransform:"uppercase",letterSpacing:".06em"}}>Precio $</div>
                  <input className="inp" placeholder="ej. 1000" value={precio} onChange={e=>setPrecio(e.target.value)} style={{padding:"8px 10px",fontSize:14}} autoFocus/>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#4a5568",marginBottom:3,fontWeight:600,textTransform:"uppercase",letterSpacing:".06em"}}>Rollos x Paq</div>
                  <input className="inp" placeholder="3" value={cantRollos} onChange={e=>setCantRollos(e.target.value)} style={{padding:"8px 8px",fontSize:14,textAlign:"center"}}/>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#4a5568",marginBottom:3,fontWeight:600,textTransform:"uppercase",letterSpacing:".06em"}}>Metros</div>
                  <input className="inp" placeholder="40" value={cantMetros} onChange={e=>setCantMetros(e.target.value)} style={{padding:"8px 8px",fontSize:14,textAlign:"center"}}/>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#4a5568",marginBottom:3,fontWeight:600,textTransform:"uppercase",letterSpacing:".06em"}}>Compré</div>
                  <input className="inp" placeholder="1" value={cantComprada} onChange={e=>setCantComprada(e.target.value)} style={{padding:"8px 8px",fontSize:14,textAlign:"center"}}/>
                </div>
              </div>
            ):(
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                <div>
                  <div style={{fontSize:10,color:"#4a5568",marginBottom:3,fontWeight:600,textTransform:"uppercase",letterSpacing:".06em"}}>Precio $</div>
                  <input className="inp" placeholder="ej. 1200" value={precio} onChange={e=>setPrecio(e.target.value)} style={{padding:"8px 10px",fontSize:14}} autoFocus/>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#4a5568",marginBottom:3,fontWeight:600,textTransform:"uppercase",letterSpacing:".06em"}}>{p.unidad||"gr"}</div>
                  <input className="inp" placeholder={p.cantidadRef?String(p.cantidadRef):"cant."} value={cantidad} onChange={e=>setCantidad(e.target.value)} style={{padding:"8px 10px",fontSize:14}}/>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#4a5568",marginBottom:3,fontWeight:600,textTransform:"uppercase",letterSpacing:".06em"}}>Compré</div>
                  <input className="inp" placeholder="1" value={cantComprada} onChange={e=>setCantComprada(e.target.value)} style={{padding:"8px 10px",fontSize:14}}/>
                </div>
              </div>
            )}
            {equivalente!=null&&(
              <div style={{background:"#080c14",borderRadius:8,padding:"7px 10px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontSize:11,color:"#4a5568"}}>Equiv. {fmtCantRef(p)}:</span>
                <span className="mono" style={{fontWeight:700,color:cat?.color||"#3b82f6",fontSize:13}}>{fmt(equivalente)}</span>
                {diff!=null&&<span style={{fontSize:12,fontWeight:600,color:diff>0?"#ef4444":"#10b981"}}>{diff>0?"▲":"▼"} {Math.abs(diff).toFixed(1)}%</span>}
                {totalPagado&&cantCompradaNum>1&&<span style={{fontSize:11,color:"#4a5568",marginLeft:4}}>· Total: <span className="mono" style={{color:"#e8eaf0",fontWeight:700}}>{fmt(totalPagado)}</span></span>}
              </div>
            )}
            <div>
              <div style={{fontSize:10,color:"#4a5568",marginBottom:3,fontWeight:600,textTransform:"uppercase",letterSpacing:".06em"}}>Fecha</div>
              <input className="inp" type="date" value={fecha} onChange={e=>setFecha(e.target.value)} style={{padding:"8px 10px",fontSize:14}}/>
            </div>
            <button className="btn" onClick={registrar} disabled={saving} style={{background:saving?"#1a2235":"#10b981",color:saving?"#4a5568":"#fff",padding:"10px 0",fontSize:14,fontWeight:700}}>
              {saving?"Guardando…":"Registrar y agregar al ticket"}
            </button>
          </div>
        )}
      </div>
    );
  }
